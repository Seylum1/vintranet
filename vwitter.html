<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vwitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link rel="preconnect" href="https://lech-backend.onrender.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.451.0/dist/umd/lucide.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d0f13; --bg2:#14171c; --panel:#171a20; --panelH:#1c2027;
  --line:#252a32; --lineL:#2f353f;
  --ink:#e7e9ea; --ink2:#9aa4b0; --ink3:#6b7480;
  --brand:#6d5cff; --brandD:#5646e0; --brandL:#9d90ff;
  --blue:#4a9eff; --green:#00ba7c; --red:#f4344e; --amber:#ffb020;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
a{color:var(--brandL);text-decoration:none;} a:hover{text-decoration:underline;}
::-webkit-scrollbar{width:10px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}
.shell{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:236px minmax(0,1fr) 300px;gap:0;min-height:100vh;}
svg.ic{display:block;flex:none;}
/* ── left rail ── */
.rail{border-right:1px solid var(--line);padding:14px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;}
.logo{font-size:24px;font-weight:900;letter-spacing:-.03em;color:var(--ink);padding:8px 12px 16px;display:flex;align-items:center;gap:10px;}
.logo .v{background:var(--brand);color:#fff;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}
.navi{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:10px;font-size:16px;font-weight:600;color:var(--ink2);background:none;border:0;width:100%;text-align:left;}
.navi:hover{background:var(--panelH);color:var(--ink);}
.navi.on{font-weight:800;color:var(--ink);background:var(--panelH);}
.navi .badge{margin-left:auto;background:var(--brand);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center;}
.postbtn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:800;margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
.postbtn:hover{background:var(--brandD);}
.railfoot{margin-top:auto;position:relative;}
.me-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);width:100%;text-align:left;color:var(--ink);}
.me-chip:hover{border-color:var(--lineL);}
.me-chip .nm{font-weight:700;font-size:14px;line-height:1.2;} .me-chip .hn{font-size:12px;color:var(--ink2);}
.me-chip .caret{margin-left:auto;display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:var(--panelH);color:var(--ink2);flex:none;}
.menu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--bg2);border:1px solid var(--lineL);border-radius:12px;padding:6px;z-index:60;box-shadow:0 14px 44px rgba(0,0,0,.55);}
.menu .mlabel{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink3);padding:5px 8px 6px;}
.menu button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:var(--ink);font-size:14px;font-weight:600;padding:8px;border-radius:8px;text-align:left;}
.menu button:hover{background:var(--panelH);}
.menu button.danger{color:var(--red);}
/* ── centre column ── */
.col{border-right:1px solid var(--line);min-height:100vh;}
.colhd{position:sticky;top:0;z-index:5;background:rgba(13,15,19,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:12px 16px;display:flex;align-items:center;gap:12px;}
.colhd h1{font-size:19px;font-weight:800;} .colhd .sub{font-size:12px;color:var(--ink3);}
.colhd .back{background:var(--bg2);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;flex:none;}
.colhd .back:hover{background:var(--panelH);}
.hdsearch{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-width:210px;}
.hdsearch:focus-within{border-color:var(--brand);}
.hdsearch input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;outline:none;}
.seg{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:2px;}
.seg button{background:none;border:0;color:var(--ink2);font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;}
.seg button.on{background:var(--brand);color:#fff;font-weight:700;}
/* ── avatars ── */
.av{border-radius:50%;flex:none;object-fit:cover;image-rendering:pixelated;background:var(--panelH);}
.av.office{border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;}
/* ── composer ── */
.composer{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.composer textarea{width:100%;background:none;border:0;color:var(--ink);font:inherit;font-size:19px;resize:none;outline:none;min-height:52px;padding-top:4px;}
.composer .foot{display:flex;align-items:center;gap:12px;margin-top:6px;}
.count{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;} .count.over{color:var(--red);}
.idents{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.idents .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink3);}
.pill{display:flex;align-items:center;gap:7px;background:none;border:1px solid var(--lineL);border-radius:999px;padding:3px 11px 3px 3px;font-size:13px;font-weight:600;color:var(--ink2);}
.pill:hover{border-color:var(--brandL);color:var(--ink);}
.pill.on{background:var(--panelH);border-color:var(--brand);color:var(--ink);font-weight:700;}
.pill .sq{width:22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none;}
.hint{font-size:12px;color:var(--ink3);font-family:var(--mono);}
.btn{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:800;font-size:15px;}
.btn:hover{background:var(--brandD);} .btn[disabled]{opacity:.5;cursor:default;}
.btn.sec{background:var(--panelH);color:var(--ink);border:1px solid var(--lineL);} .btn.sec:hover{background:var(--line);}
.btn.warn{background:none;color:var(--red);border:1px solid var(--red);} .btn.warn:hover{background:rgba(244,52,78,.12);}
.btn.sm{padding:7px 15px;font-size:13px;}
.iconbtn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--panelH);border:1px solid var(--lineL);color:var(--ink2);}
.iconbtn:hover{color:var(--ink);} .iconbtn.danger{background:none;border-color:rgba(244,52,78,.45);color:var(--red);}
/* ── post ── */
.post{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.post:hover{background:#0f1216;} .post.clk{cursor:pointer;}
.post .gutter{display:flex;flex-direction:column;align-items:center;flex:none;gap:6px;}
.post .rail2{width:2px;flex:1;background:var(--line);border-radius:1px;min-height:8px;}
.post .body{flex:1;min-width:0;}
.rp{font-size:13px;color:var(--ink2);font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.phead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px;}
.phead .nm{font-weight:700;color:var(--ink);cursor:pointer;} .phead .nm:hover{text-decoration:underline;}
.phead .off{display:inline-flex;align-items:center;background:rgba(109,92,255,.18);color:var(--brandL);font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;letter-spacing:.03em;border:1px solid rgba(109,92,255,.45);}
.phead .by{font-family:var(--mono);font-size:12px;color:var(--ink3);}
.badges{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;}
.phead .hn{color:var(--ink2);} .phead .dot{color:var(--ink3);} .phead .tm{color:var(--ink2);}
.ptext{font-size:15px;white-space:pre-wrap;word-wrap:break-word;margin:3px 0 4px;line-height:1.5;}
.quote{border:1px solid var(--lineL);border-radius:14px;padding:11px 13px;margin:8px 0;}
.actions{display:flex;gap:4px;max-width:460px;justify-content:space-between;margin-top:8px;}
.act{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--ink2);font-size:13px;padding:5px 9px;border-radius:999px;font-variant-numeric:tabular-nums;}
.act:hover{color:var(--brandL);background:rgba(109,92,255,.12);}
.act.rt:hover{color:var(--green);background:rgba(0,186,124,.12);} .act.rt.on{color:var(--green);}
.act.del:hover{color:var(--red);background:rgba(244,52,78,.12);}
.stats{display:flex;gap:18px;margin-top:12px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2);}
.stats strong{color:var(--ink);}
/* ── right rail / generic ── */
.side{padding:14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px;}
.widget{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.widget h3{font-size:16px;font-weight:800;margin-bottom:8px;}
.uitem{display:flex;align-items:center;gap:10px;padding:7px 0;width:100%;background:none;border:0;text-align:left;color:var(--ink);}
.uitem:hover .nm{text-decoration:underline;}
.uitem .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:3px;} .uitem .hn{font-size:12px;color:var(--ink2);}
.empty{text-align:center;color:var(--ink3);padding:44px 16px;font-size:15px;}
.field{margin-bottom:16px;} .field label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field input,.field textarea,.field select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font:inherit;outline:none;}
.field input:focus,.field textarea:focus{border-color:var(--brand);}
.inline-in{background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font:inherit;outline:none;}
.inline-in:focus{border-color:var(--brand);}
.coverwrap{position:relative;}
.cover{height:140px;background:linear-gradient(120deg,var(--panelH),var(--panel));border-bottom:1px solid var(--line);background-size:cover;background-position:center;}
.coverctl{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;}
.bstate{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:11px;border-radius:999px;padding:3px 10px;background:rgba(13,15,19,.82);}
.bstate.wait{color:var(--amber);border:1px solid rgba(255,176,32,.5);}
.bstate.no{color:var(--red);border:1px solid rgba(244,52,78,.5);}
.pickrow{display:flex;gap:12px;align-items:flex-start;}
.prev{width:210px;min-height:70px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;flex:none;}
.banrow{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start;}
.banprev{width:190px;height:58px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);background-size:cover;background-position:center;flex:none;}
.profhd{padding:0 16px 16px;border-bottom:1px solid var(--line);}
.profhd .top{display:flex;align-items:flex-end;gap:14px;margin-top:-28px;}
.profhd .nm{font-size:22px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.profhd .hn{color:var(--ink2);font-size:15px;}
.profhd .bio{margin-top:10px;font-size:15px;white-space:pre-wrap;line-height:1.5;}
.meta{display:flex;gap:16px;margin-top:12px;font-size:13px;color:var(--ink2);font-family:var(--mono);flex-wrap:wrap;}
.meta span{display:flex;align-items:center;gap:6px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;align-items:center;}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(109,92,255,.14);border:1px solid rgba(109,92,255,.45);color:var(--brandL);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;}
.tabs{display:flex;border-bottom:1px solid var(--line);}
.tabs button{flex:1;background:none;border:0;color:var(--ink2);font-weight:700;font-size:14px;padding:13px 8px;position:relative;}
.tabs button.on{color:var(--ink);} .tabs button.on::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:3px;background:var(--brand);border-radius:2px;}
.subnav{display:flex;gap:2px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap;}
.subnav button{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--ink2);font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;}
.subnav button.on{background:var(--brand);color:#fff;font-weight:700;}
.subnav button:hover:not(.on){background:var(--panelH);color:var(--ink);}
.filterbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);}
.filterbar .box{flex:1;display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;}
.filterbar .box:focus-within{border-color:var(--brand);}
.filterbar input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:13px;outline:none;}
.state{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;letter-spacing:.02em;}
.state.ok{color:var(--green);border:1px solid rgba(0,186,124,.4);background:rgba(0,186,124,.1);}
.state.vac{color:var(--amber);border:1px solid rgba(255,176,32,.45);background:rgba(255,176,32,.1);}
.notif{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--ink);align-items:flex-start;}
.notif:hover{background:#0f1216;} .notif.unread{background:rgba(109,92,255,.07);}
.notif .ni{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--panelH);color:var(--brandL);flex:none;}
/* ── messages ── */
.dmsplit{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 55px);}
.dmlist{border-right:1px solid var(--line);display:flex;flex-direction:column;}
.dmpane{display:flex;flex-direction:column;}
.conv{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--ink);}
.conv:hover{background:#0f1216;} .conv.on{background:var(--panelH);}
.conv .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv .pv{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv .when{margin-left:auto;color:var(--ink3);font-size:11px;font-family:var(--mono);}
.unreaddot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none;}
.daysep{text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink3);margin:10px 0;}
.bubble{max-width:74%;padding:9px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-wrap:break-word;line-height:1.45;}
.bubble.me{background:var(--brand);color:#fff;margin-left:auto;border-bottom-right-radius:5px;}
.bubble.them{background:var(--panelH);border-bottom-left-radius:5px;}
.bubble .bt{font-size:10px;opacity:.75;margin-top:4px;font-family:var(--mono);}
.dmfoot{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg);}
.dmfoot input{flex:1;min-width:0;background:var(--panelH);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:9px 14px;font:inherit;outline:none;}
.dmfoot input:focus{border-color:var(--brand);}
.grp{font-size:12px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;}
.chk{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;font-size:14px;}
.chk:hover{background:var(--panelH);} .chk input{width:16px;height:16px;accent-color:var(--brand);}
.chk .who{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9000;background:var(--panel);border:1px solid var(--lineL);color:var(--ink);
  padding:12px 20px;border-radius:12px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:90vw;text-align:center;}
.toast.bad{border-color:var(--red);color:#ffb4bf;} .toast.ok{border-color:var(--green);}
.modal-bg{position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px;overflow:auto;}
.modal{background:var(--bg);border:1px solid var(--lineL);border-radius:18px;max-width:600px;width:100%;box-shadow:0 20px 70px rgba(0,0,0,.6);}
.modal .mh{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);}
.modal .mh h2{font-size:18px;font-weight:800;} .modal .mb{padding:16px;}
.tag{display:inline-block;background:var(--panelH);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--ink2);margin:2px 4px 2px 0;}
@media(max-width:1000px){.shell{grid-template-columns:70px minmax(0,1fr);} .side{display:none;} .logo span:not(.v),.navi span:not(.badge),.me-chip .txt{display:none;}
  .navi{justify-content:center;} .postbtn span{display:none;} .menu{left:0;right:auto;width:210px;}
  .hdsearch{min-width:0;width:150px;}
  .railfoot .btn{font-size:0;padding:12px;} .railfoot .btn::after{content:"→";font-size:18px;}}
@media(max-width:760px){.dmsplit{grid-template-columns:1fr;} .dmsplit.open .dmlist{display:none;} .dmsplit:not(.open) .dmpane{display:none;}}
@media(max-width:640px){.shell{grid-template-columns:1fr;} .rail{position:sticky;bottom:0;top:auto;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);order:2;z-index:50;background:var(--bg);}
  .logo,.railfoot,.postbtn{display:none;} .navi{flex:1;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useCallback,useRef}=React;

/* ═══════════════════════════════════════════════════════════════════════════
   VWITTER — the network's social service
   Every Vintranet account is automatically its own handle (@username). Some
   accounts belong to an OFFICE: anyone holding a reaching office may post as it.
   The server verifies every post is genuinely from the account that signed it,
   keeps direct messages to their two participants, and reserves the office
   accounts to a network administrator. This page only offers what the server
   already allows.
   ═══════════════════════════════════════════════════════════════════════════ */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
const API="https://lech-backend.onrender.com";
let AUTH_TOKEN=null;
const SESSION_KEY="lech_session",SESSION_ACC_KEY="lech_session_acc";
function saveSession(t,a){try{if(t)localStorage.setItem(SESSION_KEY,t);if(a)localStorage.setItem(SESSION_ACC_KEY,JSON.stringify(a));}catch(e){}}
function cachedAccount(){try{const t=localStorage.getItem(SESSION_KEY);if(!t)return null;const a=localStorage.getItem(SESSION_ACC_KEY);if(!a)return null;AUTH_TOKEN=t;return JSON.parse(a);}catch(e){return null;}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY);localStorage.removeItem(SESSION_ACC_KEY);}catch(e){}AUTH_TOKEN=null;}
function forgetSession(){const t=AUTH_TOKEN;clearSession();try{if(t)fetch(API+"/api/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t})});}catch(e){}}
async function srestore(){let t=null;try{t=localStorage.getItem(SESSION_KEY);}catch(e){}if(!t)return null;AUTH_TOKEN=t;
  try{const r=await fetch(API+"/api/me?token="+encodeURIComponent(t));const d=await r.json();
    if(d&&d.ok&&d.account){saveSession(t,d.account);return d.account;}clearSession();return null;}catch(e){return null;}}
async function sgetAll(){try{const r=await fetch(API+"/api/data"+(AUTH_TOKEN?"?token="+encodeURIComponent(AUTH_TOKEN):""));const d=await r.json();return (d&&d.ok)?(d.data||{}):{};}catch(e){return{};}}
async function sset(k,v){try{const r=await fetch(API+"/api/set",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:AUTH_TOKEN,key:k,value:v})});const d=await r.json();return d&&d.ok?{ok:true}:{ok:false,error:(d&&d.error)||"Refused."};}catch(e){return {ok:false,error:"Connection error."};}}
async function sdel(k){try{const r=await fetch(API+"/api/unset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:AUTH_TOKEN,key:k})});const d=await r.json();return d&&d.ok?{ok:true}:{ok:false,error:(d&&d.error)||"Refused."};}catch(e){return{ok:false,error:"Connection error."};}}
async function slogin(u,p){try{const r=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:String(u||"").trim(),password:p})});const d=await r.json();if(d&&d.ok){AUTH_TOKEN=d.token;saveSession(d.token,d.account);return {ok:true,account:d.account};}return {ok:false,error:(d&&d.error)||"Sign in refused"};}catch(e){return {ok:false,error:"Connection error"};}}

/* Office catalogue — individually-held offices, MUST match server.js. Fixed
   single-role offices match a role field; cabinet/ministerial offices are read
   LIVE from each nation's register (bk_officials / vx_gov.cabinet / wx_gov.cabinet)
   so an office account maps to ONE post, not a whole group. */
const isAdmin=a=>!!a&&(a.role==="emperor"||a.sysAdmin===true);
const FIXED_OFFICES=[
  {id:"lech_emperor",label:"Emperor of Lech",group:"Empire of Lech",field:"role",values:["emperor"]},
  {id:"vx_president",label:"President of Vindex",group:"Republic of Vindex",field:"vxRole",values:["president"]},
  {id:"vx_vp",label:"Vice-President of Vindex",group:"Republic of Vindex",field:"vxRole",values:["vice_president"]},
  {id:"vx_speaker",label:"Speaker of Vindex",group:"Republic of Vindex",field:"vxRole",values:["speaker"]},
  {id:"wx_sovereign",label:"Sovereign of Wilden",group:"Wilden",field:"wxRole",values:["sovereign"]},
  {id:"wx_pm",label:"Prime Minister of Wilden",group:"Wilden",field:"wxRole",values:["pm"]},
  {id:"wx_speaker",label:"Speaker of the Commons",group:"Wilden",field:"wxRole",values:["speaker"]},
];
function vwOfficeLabel(id){
  const f=FIXED_OFFICES.find(o=>o.id===id);if(f)return f.label;
  if(id==="lech:chancellor")return "Chancellor of Lech";
  if(id.indexOf("lechmin:")===0)return id.slice(8)+" (Lech)";
  if(id.indexOf("cab:vx_gov:")===0)return id.slice(11)+" (Vindex)";
  if(id.indexOf("cab:wx_gov:")===0)return id.slice(11)+" (Wilden)";
  return id;
}
function vwOfficeMatches(id,account,data){
  if(!account)return false;
  const u=String(account.username||"").toLowerCase();
  const f=FIXED_OFFICES.find(o=>o.id===id);
  if(f)return f.values.map(String).includes(String(account[f.field]||""));
  if(id==="lech:chancellor")return String(((data&&data.bk_officials)||{}).chancellor_username||"").toLowerCase()===u;
  if(id.indexOf("lechmin:")===0){const m=((data&&data.bk_officials)||{}).minister_usernames||{};return String(m[id.slice(8)]||"").toLowerCase()===u;}
  if(id.indexOf("cab:")===0){const p=id.split(":"),gov=p[1],post=p.slice(2).join(":");const cab=((data&&data[gov])||{}).cabinet||{};return String(cab[u]||"").toLowerCase()===String(post).toLowerCase();}
  return false;
}
/* Who currently holds an office — the reverse lookup of vwOfficeMatches. Used to
   show, everywhere an office appears, the person answerable for it. */
function vwOfficeHolder(id,data,accounts){
  const f=FIXED_OFFICES.find(o=>o.id===id);
  if(f){const hit=Object.values(accounts||{}).find(a=>f.values.map(String).includes(String(a[f.field]||"")));
    return hit?String(hit.username||"").toLowerCase():"";}
  if(id==="lech:chancellor")return String(((data&&data.bk_officials)||{}).chancellor_username||"").toLowerCase();
  if(id.indexOf("lechmin:")===0){const m=((data&&data.bk_officials)||{}).minister_usernames||{};return String(m[id.slice(8)]||"").toLowerCase();}
  if(id.indexOf("cab:")===0){const p=id.split(":"),gov=p[1],post=p.slice(2).join(":");const cab=((data&&data[gov])||{}).cabinet||{};
    const hit=Object.entries(cab).find(([,v])=>String(v||"").toLowerCase()===String(post).toLowerCase());return hit?String(hit[0]).toLowerCase():"";}
  return "";
}
function vwUserControls(account,oa,data){if(!account||!oa)return false;if(isAdmin(account))return true;
  return (oa.offices||[]).some(id=>vwOfficeMatches(id,account,data));}
// The offices an admin may attach, built from the live registers.
function vwAvailableOffices(data){
  const out=FIXED_OFFICES.map(o=>({id:o.id,label:o.label,group:o.group}));
  const bo=(data&&data.bk_officials)||{};
  out.push({id:"lech:chancellor",label:"Chancellor of Lech",group:"Empire of Lech"});
  Object.keys(bo.minister_usernames||{}).forEach(k=>out.push({id:"lechmin:"+k,label:k+" (Lech)",group:"Empire of Lech"}));
  [["vx_gov","Republic of Vindex","Vindex"],["wx_gov","Wilden","Wilden"]].forEach(([gov,grp,short])=>{
    const cab=((data&&data[gov])||{}).cabinet||{};
    [...new Set(Object.values(cab).filter(Boolean))].forEach(post=>out.push({id:"cab:"+gov+":"+post,label:post+" ("+short+")",group:grp}));
  });
  return out;
}

/* ── icons ─────────────────────────────────────────────────────────────────────
   Drawn from the Lucide set loaded in <head>, rendered as React elements (no DOM
   swapping), so they inherit colour and can be hovered. Replaces the emoji the
   page used to use, which rendered differently on every operating system. */
const ICON_FALLBACK={"message-circle":"↩","repeat-2":"⇄","quote":"❝","link":"∞","trash-2":"×","more-horizontal":"…","bell":"!","mail":"✉","home":"⌂","search":"⌕","user":"○","landmark":"▣","wrench":"⚙","send":"→","plus":"+","pencil":"✎","arrow-left":"←","log-out":"→","chevron-up":"^","chevron-down":"v","badge-check":"✓","filter":"≡","clock":"◷","calendar":"▦","pen-line":"✎","reply":"↩","external-link":"↗","shield-check":"✓","users":"○","file-text":"▤"};
function lucideNode(name){
  const L=(typeof window!=="undefined"&&window.lucide)||{};
  const pascal=String(name).replace(/(^|-)([a-z0-9])/g,(m,a,b)=>b.toUpperCase());
  const src=L.icons||L;
  const node=src[pascal]||src[name]||null;
  if(!Array.isArray(node))return null;
  // the set ships icons either as ["svg",attrs,children] or as a bare list of parts
  const parts=(typeof node[0]==="string"&&node[0].toLowerCase()==="svg")?(node[2]||[]):node;
  return parts.filter(p=>Array.isArray(p)&&typeof p[0]==="string");
}
function Ic({n,s=18,sw=1.9,style}){
  const parts=lucideNode(n);
  if(!parts||!parts.length)return <span style={{width:s,textAlign:"center",fontSize:s*0.8,lineHeight:1,...(style||{})}}>{ICON_FALLBACK[n]||"•"}</span>;
  return <svg className="ic" viewBox="0 0 24 24" width={s} height={s} fill="none" stroke="currentColor" strokeWidth={sw}
    strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" style={style}>
    {parts.map((part,i)=>React.createElement(part[0],{key:i,...(part[1]||{})}))}
  </svg>;
}

   verified (blue) — plus, on top, a golden globe for a head of state / government
   (the same offices the index page shows). Office accounts are always verified. */
const WORLD_LEADER_OFFICES=["lech_emperor","lech:chancellor","vx_president","vx_vp","wx_sovereign","wx_pm"];
function isWorldLeaderUser(acc,data){return !!acc&&WORLD_LEADER_OFFICES.some(id=>vwOfficeMatches(id,acc,data));}
function isWorldLeaderOffice(oa){return !!oa&&(oa.offices||[]).some(id=>WORLD_LEADER_OFFICES.includes(id));}
function userCheck(acc,verifiedSet){
  if(!acc)return "";
  if(isAdmin(acc))return "admin";                                            // red
  if(acc.sysMod===true)return "mod";                                         // purple
  if(verifiedSet&&verifiedSet.has(String(acc.username||"").toLowerCase()))return "verified"; // blue
  return "";
}
const CHECK_COLOR={admin:"#f4344e",mod:"#7c5cff",verified:"#4a9eff"};

function timeAgo(ts){if(!ts)return"";const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return s+"s";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";
  if(s<604800)return Math.floor(s/86400)+"d";return new Date(ts).toLocaleDateString("en-GB",{day:"numeric",month:"short"});}
function fmtWhen(ts){if(!ts)return"";return new Date(ts).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function fmtClock(ts){if(!ts)return"";return new Date(ts).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});}
function dayKey(ts){const d=new Date(ts||0);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();}
function dayLabel(ts){const d=new Date(ts||0),now=new Date();
  if(dayKey(ts)===dayKey(now.getTime()))return "TODAY";
  if(dayKey(ts)===dayKey(now.getTime()-86400000))return "YESTERDAY";
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}).toUpperCase();}
function mcFace(n,s){return "https://mc-heads.net/avatar/"+encodeURIComponent(n||"steve")+"/"+(s||48);}

/* ── images ────────────────────────────────────────────────────────────────────
   Banners and office pictures are shrunk in the browser before they ever reach
   the server: cover-cropped to a fixed frame and re-encoded until they are small
   enough to sit in the same record store as everything else. */
const BANNER_W=1200,BANNER_H=360,PFP_SIZE=256,IMG_CAP=360000;
function readFileDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();
  r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("Could not read that file."));r.readAsDataURL(file);});}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();
  i.onload=()=>res(i);i.onerror=()=>rej(new Error("That file isn't an image."));i.src=src;});}
async function shrinkImage(file,w,h,q){
  if(!file)return "";
  if(!/^image\//.test(file.type||""))throw new Error("Choose an image file (JPG, PNG, GIF or WebP).");
  const img=await loadImg(await readFileDataURL(file));
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const g=c.getContext("2d");g.fillStyle="#171a20";g.fillRect(0,0,w,h);
  const s=Math.max(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s;
  g.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
  let qq=q||0.78,out=c.toDataURL("image/jpeg",qq);
  while(out.length>IMG_CAP&&qq>0.3){qq-=0.12;out=c.toDataURL("image/jpeg",qq);}
  if(out.length>IMG_CAP)throw new Error("That image is too large even compressed — try a smaller one.");
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════════
   COMPOSER — identities are pills, not a dropdown, so you can always see whether
   you are about to speak for yourself or for the state. The rate limit counts
   down on the button instead of refusing you after the fact.
   ══════════════════════════════════════════════════════════════════════════════ */
function Composer({me,identities,activeId,setActiveId,onPost,placeholder,replyTo,quoted,ctx,onDone,autoFocus,cooldown}){
  const [text,setText]=useState("");const [busy,setBusy]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{if(autoFocus&&ref.current)ref.current.focus();},[autoFocus]);
  const left=POST_MAX-text.length;
  const ident=identities.find(i=>i.id===activeId)||identities[0];
  const waiting=!replyTo&&cooldown>0;
  const go=async()=>{if(!text.trim()||left<0||busy||waiting)return;setBusy(true);
    const r=await onPost({text:text.trim(),asOffice:ident&&ident.office?ident.id:"",replyTo:replyTo||"",repostOf:quoted?quoted.id:""});
    setBusy(false);if(r.ok){setText("");if(onDone)onDone();}};
  const label=replyTo?"Reply":(quoted?"Quote":"Post");
  return <div className="composer">
    <Avatar p={ident} size={replyTo?40:44}/>
    <div style={{flex:1,minWidth:0}}>
      {identities.length>1&&<div className="idents">
        <span className="lbl">{replyTo?"REPLYING AS":"POST AS"}</span>
        {identities.map(i=><button key={i.id} className={"pill"+(i.id===activeId?" on":"")} onClick={()=>setActiveId(i.id)} title={"@"+i.handle}>
          {i.office?<span className="sq">{(i.handle||"O")[0].toUpperCase()}</span>:<img className="av" src={mcFace(i.mc||i.handle,22)} style={{width:22,height:22}} alt=""/>}
          {i.office?i.name:"Yourself"}
        </button>)}
      </div>}
      <textarea ref={ref} value={text} onChange={e=>setText(e.target.value)} placeholder={placeholder||"What's happening?"}
        onKeyDown={e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))go();}}/>
      {quoted&&<div className="quote"><QuotedPost post={quoted} ctx={ctx}/></div>}
      <div className="foot">
        <span className="hint">{ident&&ident.office?"Posting as an office — everyone can see you signed it":"Visible to everyone on the Vintranet"}</span>
        <span className={"count"+(left<0?" over":"")} style={{marginLeft:"auto"}}>{left}</span>
        <button className="btn sm" disabled={!text.trim()||left<0||busy||waiting} onClick={go}
          title={waiting?"Rate limit: one post a minute":undefined}>{busy?"…":(waiting?"Wait "+cooldown+"s":label)}</button>
      </div>
    </div>
  </div>;
}

/* ══════════════════════════════════════════════════════════════════════════════
   A POST
   ══════════════════════════════════════════════════════════════════════════════ */
function PostCard({post,ctx,onOpen,onReply,onRepost,onQuote,onDelete,onProfile,compact,thread}){
  const p=ctx.poster(post);
  const replies=ctx.repliesTo(post.id).length;
  const reposts=ctx.repostsOf(post.id).length;
  const iReposted=ctx.iRepostedOf(post.id);
  const parent=post.replyTo?ctx.byId(post.replyTo):null;
  const parentWho=parent?ctx.poster(parent):null;
  return <div className={"post"+(onOpen?" clk":"")} onClick={onOpen?()=>onOpen(post.id):undefined}>
    <div className="gutter">
      <Avatar p={p} size={44} onClick={e=>{if(onProfile){e.stopPropagation();onProfile(p);}}}/>
      {thread&&<span className="rail2"/>}
    </div>
    <div className="body">
      {post.replyTo&&<div className="rp">
        <Ic n="reply" s={14}/>
        {parentWho?<span>Replying to <a href="#" onClick={e=>{e.preventDefault();e.stopPropagation();if(onProfile)onProfile(parentWho);}}>@{parentWho.handle}</a></span>
          :<span>Replying to a post that has been deleted</span>}
      </div>}
      <div className="phead">
        <span className="nm" onClick={e=>{if(onProfile){e.stopPropagation();onProfile(p);}}}>{p.name}</span>
        <Badge check={p.check} globe={p.globe}/>
        {p.office&&<span className="off">OFFICE</span>}
        <span className="hn">@{p.handle}</span><span className="dot">·</span><span className="tm">{timeAgo(post.at)}</span>
        {p.office&&post.author&&<span className="by">signed by @{post.author}</span>}
      </div>
      {post.text&&<div className="ptext">{post.text}</div>}
      {post.repostOf&&ctx.byId(post.repostOf)&&<div className="quote">
        <QuotedPost post={ctx.byId(post.repostOf)} ctx={ctx}/></div>}
      {post.repostOf&&!ctx.byId(post.repostOf)&&<div className="quote"><span style={{color:"var(--ink3)"}}>This post is unavailable.</span></div>}
      {!compact&&<div className="actions" onClick={e=>e.stopPropagation()}>
        <button className="act" onClick={()=>onReply(post)} title="Reply"><Ic n="message-circle" s={17}/><span>{replies||""}</span></button>
        <button className={"act rt"+(iReposted?" on":"")} onClick={()=>onRepost(post)} title={iReposted?"Undo repost":"Repost"}><Ic n="repeat-2" s={17}/><span>{reposts||""}</span></button>
        <button className="act" onClick={()=>onQuote(post)} title="Quote with your own words"><Ic n="quote" s={16}/><span>Quote</span></button>
        <button className="act" onClick={()=>onOpen&&onOpen(post.id)} title="Open thread"><Ic n="link" s={16}/></button>
        {ctx.canDelete(post)&&<button className="act del" onClick={()=>onDelete(post)} title="Delete"><Ic n="trash-2" s={16}/></button>}
      </div>}
    </div>
  </div>;
}
function QuotedPost({post,ctx}){
  const p=ctx.poster(post);
  return <div><div className="phead" style={{fontSize:14}}>
    <Avatar p={p} size={20}/><span className="nm">{p.name}</span><Badge check={p.check} globe={p.globe}/>{p.office&&<span className="off">OFFICE</span>}
    <span className="hn">@{p.handle}</span><span className="dot">·</span><span className="tm">{timeAgo(post.at)}</span></div>
    {post.text&&<div className="ptext" style={{fontSize:14,marginTop:2}}>{post.text}</div>}</div>;
}

/* ══════════════════════════════════════════════════════════════════════════════
   FEED / THREAD / PROFILE
   ══════════════════════════════════════════════════════════════════════════════ */
function Feed({ctx,acts,filter}){
  const items=useMemo(()=>ctx.posts.filter(p=>!p.replyTo).filter(p=>filter==="offices"?!!p.asOffice:true)
    .sort((a,b)=>(b.at||0)-(a.at||0)),[ctx.posts,filter]);
  return <div>
    <Composer {...acts.composerProps}/>
    {items.length===0?<div className="empty">{filter==="offices"?"No office has posted yet.":"No posts yet. Be the first to say something."}</div>
      :items.map(p=><PostCard key={p.id} post={p} ctx={ctx} onOpen={acts.open} onReply={acts.reply} onRepost={acts.repost} onQuote={acts.quote} onDelete={acts.del} onProfile={acts.profile}/>)}
  </div>;
}
function Thread({id,ctx,acts}){
  const post=ctx.byId(id);
  const [sort,setSort]=useState("old");
  if(!post)return <div className="empty">This post is unavailable.</div>;
  const parent=post.replyTo?ctx.byId(post.replyTo):null;
  const parentWho=parent?ctx.poster(parent):null;
  const p=ctx.poster(post);
  const replies=ctx.repliesTo(id).slice().sort((a,b)=>{
    if(sort==="offices"){const ao=a.asOffice?0:1,bo=b.asOffice?0:1;if(ao!==bo)return ao-bo;}
    return (a.at||0)-(b.at||0);});
  const quotes=ctx.posts.filter(q=>q.repostOf===id&&q.text).length;
  return <div>
    {parent&&<div className="post" style={{paddingBottom:4,cursor:"pointer"}} onClick={()=>acts.open(parent.id)}>

      <div className="body" style={{paddingBottom:8}}>
        <div className="phead" style={{fontSize:14}}><span className="nm">{parentWho.name}</span><Badge check={parentWho.check} globe={parentWho.globe}/>
          <span className="hn">@{parentWho.handle}</span><span className="dot">·</span><span className="tm">{timeAgo(parent.at)}</span></div>
        {parent.text&&<div className="ptext" style={{fontSize:14,color:"var(--ink2)"}}>{parent.text}</div>}
      </div>
    </div>}
    <div style={{padding:"8px 16px 16px",borderBottom:"1px solid var(--line)",background:"#0f1216"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
        <Avatar p={p} size={46}/>
        <div style={{minWidth:0}}>
          <div className="nm" style={{display:"flex",alignItems:"center",gap:5,fontWeight:700,flexWrap:"wrap"}}>{p.name}<Badge check={p.check} globe={p.globe}/>{p.office&&<span className="off">OFFICE</span>}</div>
          <div className="hn" style={{color:"var(--ink2)",fontSize:14}}>@{p.handle}{p.office&&post.author?<span className="by" style={{marginLeft:6}}>signed by @{post.author}</span>:null}</div>
        </div>
      </div>
      {post.text&&<div className="ptext" style={{fontSize:21,lineHeight:1.45}}>{post.text}</div>}
      {post.repostOf&&ctx.byId(post.repostOf)&&<div className="quote"><QuotedPost post={ctx.byId(post.repostOf)} ctx={ctx}/></div>}
      <div className="meta" style={{marginTop:12}}><span><Ic n="clock" s={14}/>{fmtWhen(post.at)}</span></div>
      <div className="stats">
        <span><strong>{ctx.repostsOf(post.id).length}</strong> reposts</span>

        <button className={"act rt"+(ctx.iRepostedOf(post.id)?" on":"")} onClick={()=>acts.repost(post)}><Ic n="repeat-2" s={18}/><span>{ctx.iRepostedOf(post.id)?"Reposted":"Repost"}</span></button>
        <button className="act" onClick={()=>acts.quote(post)}><Ic n="quote" s={17}/><span>Quote</span></button>

    <div className="subnav">
