function Profile({handle,office,ctx,acts,me,admin,onSaveBio,onSaveBanner,onVerify,onMessage,note}){
  // office=true → an office account handle; else a person username
  const oa=office?ctx.officeByHandle(handle):null;
  const acc=office?null:ctx.accounts[String(handle||"").toLowerCase()];
  const name=office?(oa?oa.displayName:handle):((acc&&(acc.displayName||acc.username))||handle);
  const bio=office?(oa?oa.bio:""):ctx.bioOf(handle);
  const p=office?{office:true,handle:oa?oa.handle:handle,name,img:oa&&oa.avatar}:{handle,name,mc:(acc&&(acc.mcName||acc.username))||handle};
  const badges=office?ctx.officeBadges(oa):ctx.userBadges(handle);
  const isMe=!office&&me&&String(handle||"").toLowerCase()===String(me.username||"").toLowerCase();
  const verified=!office&&ctx.verifiedSet.has(String(handle||"").toLowerCase());
  const u=String(handle||"").toLowerCase();
  const [tab,setTab]=useState("posts");
  const [editing,setEditing]=useState(false);const [draft,setDraft]=useState(bio||"");
  useEffect(()=>{setDraft(bio||"");},[bio]);
  useEffect(()=>{setTab("posts");setEditing(false);},[handle,office]);

  const mine=useMemo(()=>ctx.posts.filter(pp=>office?(pp.asOffice&&oa&&pp.asOffice===oa.id)
      :(!pp.asOffice&&String(pp.author||"").toLowerCase()===u)),[ctx.posts,u,office,oa]);
  const asOfficePosts=useMemo(()=>office?[]:ctx.posts.filter(pp=>pp.asOffice&&String(pp.author||"").toLowerCase()===u),[ctx.posts,u,office]);
  const held=useMemo(()=>office?[]:Object.values(ctx.officeAccounts).filter(o=>(o.offices||[]).some(id=>vwOfficeMatches(id,acc,ctx.data))),[ctx.officeAccounts,acc,ctx.data,office]);
  const heldOfficeLabels=useMemo(()=>{const out=[];held.forEach(o=>(o.offices||[]).forEach(id=>{if(vwOfficeMatches(id,acc,ctx.data))out.push(vwOfficeLabel(id));}));return [...new Set(out)];},[held,acc,ctx.data]);
  const holder=office&&oa?(oa.offices||[]).map(id=>vwOfficeHolder(id,ctx.data,ctx.accounts)).filter(Boolean)[0]:"";

  /* banners: a player uploads one, an administrator approves it. The approval
     records the exact upload it applies to, so replacing the image sends the new
     one back through review instead of inheriting the old permission. */
  const rec=office?null:ctx.profileRec(u);
  const bannerData=office?(oa&&oa.banner)||"":(rec&&rec.banner)||"";
  const bannerAt=(rec&&rec.bannerAt)||0;
  const appr=office?null:ctx.banners[u];
  const approved=!!appr&&appr.approvedAt===bannerAt&&!!bannerAt;
  const rejected=!!appr&&appr.rejectedAt===bannerAt&&!!bannerAt;
  const bannerState=office?"":(!bannerData?"none":approved?"ok":rejected?"rejected":"pending");
  const coverShown=office?!!bannerData:(!!bannerData&&(approved||isMe||admin));
  const [banBusy,setBanBusy]=useState(false);
  const fileRef=useRef(null);
  const pickBanner=async f=>{setBanBusy(true);
    try{const data=await shrinkImage(f,BANNER_W,BANNER_H,0.78);const r=await onSaveBanner(data);
      note(r.ok?"Banner uploaded — an administrator will review it.":(r.error||"Refused"),r.ok?"ok":"bad");}
    catch(e){note(e.message||"Could not use that image.","bad");}
    setBanBusy(false);};

  const shown=useMemo(()=>{
    let list;
    if(tab==="posts")list=mine.filter(pp=>!pp.replyTo&&!(pp.repostOf&&!String(pp.text||"").trim()));
    else if(tab==="replies")list=mine.filter(pp=>!!pp.replyTo);
    else if(tab==="reposts")list=mine.filter(pp=>pp.repostOf&&!String(pp.text||"").trim());
    else list=asOfficePosts;
    return list.slice().sort((a,b)=>(b.at||0)-(a.at||0));},[mine,asOfficePosts,tab]);

  return <div>
    <div className="coverwrap">
      <div className="cover" style={coverShown?{backgroundImage:"url("+bannerData+")"}:null}/>
      {bannerState==="pending"&&(isMe||admin)&&<span className="bstate wait">AWAITING APPROVAL — ONLY YOU AND ADMINISTRATORS SEE THIS</span>}
      {bannerState==="rejected"&&(isMe||admin)&&<span className="bstate no">REFUSED BY AN ADMINISTRATOR — TRY ANOTHER IMAGE</span>}
      {isMe&&<div className="coverctl">
        <button className="btn sec sm" disabled={banBusy} onClick={()=>fileRef.current&&fileRef.current.click()}>
          <span style={{display:"inline-flex",alignItems:"center",gap:7}}><Ic n="image" s={15}/>{banBusy?"Uploading…":(bannerData?"Change banner":"Add banner")}</span></button>
        {bannerData&&<button className="btn sec sm" disabled={banBusy} onClick={async()=>{const r=await onSaveBanner("");note(r.ok?"Banner removed.":(r.error||"Refused"),r.ok?"ok":"bad");}}>Remove</button>}
        <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}}
          onChange={e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)pickBanner(f);}}/>
      </div>}
    </div>
    <div className="profhd">
      <div className="top">
        <div style={{border:"3px solid var(--bg)",borderRadius:office?18:"50%",lineHeight:0}}><Avatar p={p} size={80}/></div>
        <div style={{marginLeft:"auto",marginBottom:6,display:"flex",gap:8,flexWrap:"wrap"}}>
          {!office&&!isMe&&me&&<button className="btn sec sm" onClick={()=>onMessage(u)}><span style={{display:"inline-flex",alignItems:"center",gap:7}}><Ic n="mail" s={15}/>Message</span></button>}
          {isMe&&!editing&&<button className="btn sec sm" onClick={()=>setEditing(true)}><span style={{display:"inline-flex",alignItems:"center",gap:7}}><Ic n="pencil" s={15}/>Edit bio</span></button>}
          {admin&&!office&&<button className="btn sec sm"
            onClick={async()=>{const r=await onVerify(handle,!verified);note(r.ok?(verified?"Verification removed.":"Verified."):(r.error||"Refused"),r.ok?"ok":"bad");}}>{verified?"Remove verification":"Verify account"}</button>}
        </div>
      </div>
      <div style={{marginTop:10}}>
        <div className="nm">{name}<Badge check={badges.check} globe={badges.globe}/>{office&&<span className="off">OFFICE</span>}</div>
        <div className="hn">@{p.handle}</div>
        {!editing&&bio&&<div className="bio">{bio}</div>}
        {editing&&<div style={{marginTop:10}}>
          <textarea value={draft} maxLength={BIO_MAX} onChange={e=>setDraft(e.target.value)}
            style={{width:"100%",background:"var(--bg2)",border:"1px solid var(--line)",borderRadius:10,color:"var(--ink)",padding:10,font:"inherit",resize:"vertical",minHeight:60}}/>
          <div style={{display:"flex",gap:10,alignItems:"center",marginTop:6}}>
            <span className="count">{BIO_MAX-draft.length}</span>
            <button className="btn sm" onClick={async()=>{const r=await onSaveBio(draft.trim());if(r.ok){setEditing(false);note("Bio saved.","ok");}else note(r.error||"Refused","bad");}}>Save</button>
            <button className="btn sec sm" onClick={()=>{setEditing(false);setDraft(bio||"");}}>Cancel</button>
          </div></div>}
        {!office&&heldOfficeLabels.length>0&&<div className="chips">
          <span style={{fontFamily:"var(--mono)",fontSize:10,letterSpacing:".1em",color:"var(--ink3)"}}>OFFICES HELD</span>
          {heldOfficeLabels.map(l=><span key={l} className="chip">{l}</span>)}
          {held.map(o=><button key={o.id} className="chip" style={{cursor:"pointer"}} onClick={()=>acts.profile({office:true,handle:o.handle})}>@{o.handle}</button>)}
        </div>}
        {office&&<div className="chips">
          <span style={{fontFamily:"var(--mono)",fontSize:10,letterSpacing:".1em",color:"var(--ink3)"}}>SPEAKS FOR</span>
          {(oa&&(oa.offices||[]).length?oa.offices:[]).map(id=><span key={id} className="chip">{vwOfficeLabel(id)}</span>)}
          {holder?<button className="chip" style={{cursor:"pointer"}} onClick={()=>acts.profile({handle:holder})}>held by @{holder}</button>
            :<span className="state vac">VACANT — NOBODY CAN POST AS THIS</span>}
        </div>}
        <div className="meta">
          <span><Ic n="file-text" s={14}/>{mine.length} posts</span>
          {verified&&<span><Ic n="badge-check" s={14}/>Verified account</span>}
          {!office&&acc&&acc.createdAt&&<span><Ic n="calendar" s={14}/>Joined {new Date(acc.createdAt).toLocaleDateString("en-GB",{month:"short",year:"numeric"})}</span>}
          {office&&oa&&oa.createdAt&&<span><Ic n="calendar" s={14}/>Opened {new Date(oa.createdAt).toLocaleDateString("en-GB",{month:"short",year:"numeric"})}</span>}
        </div>
      </div>
    </div>
    <div className="tabs">
      <button className={tab==="posts"?"on":""} onClick={()=>setTab("posts")}>Posts</button>
      <button className={tab==="replies"?"on":""} onClick={()=>setTab("replies")}>Replies</button>
      <button className={tab==="reposts"?"on":""} onClick={()=>setTab("reposts")}>Reposts</button>
      {!office&&asOfficePosts.length>0&&<button className={tab==="office"?"on":""} onClick={()=>setTab("office")}>As office</button>}
    </div>
    {shown.length===0?<div className="empty">Nothing here yet.</div>
      :shown.map(pp=><PostCard key={pp.id} post={pp} ctx={ctx} onOpen={acts.open} onReply={acts.reply} onRepost={acts.repost} onQuote={acts.quote} onDelete={acts.del} onProfile={acts.profile}/>)}
  </div>;
}

/* ══════════════════════════════════════════════════════════════════════════════
   NOTIFICATIONS — derived from the posts already on the page: replies to you,
   reposts and quotes of your posts, and @mentions. Nothing new is stored on the
   server; only "what you have already seen" is kept locally.
   ══════════════════════════════════════════════════════════════════════════════ */
function buildNotifs(posts,me,accounts){
  if(!me)return [];
  const u=String(me.username||"").toLowerCase();
  const mineIds=new Set(posts.filter(p=>String(p.author||"").toLowerCase()===u).map(p=>p.id));
  const mention=new RegExp("(^|[^a-z0-9_])@"+u.replace(/[^a-z0-9_]/g,"")+"([^a-z0-9_]|$)","i");
  const out=[];
  posts.forEach(p=>{
    const by=String(p.author||"").toLowerCase();
    if(by===u)return;
    const quoted=!!String(p.text||"").trim();
    if(p.replyTo&&mineIds.has(p.replyTo))out.push({kind:"reply",icon:"message-circle",post:p,target:p.replyTo,at:p.at||0,by});
    else if(p.repostOf&&mineIds.has(p.repostOf))out.push({kind:quoted?"quote":"repost",icon:quoted?"quote":"repeat-2",post:p,target:p.repostOf,at:p.at||0,by});
    else if(mention.test(String(p.text||"")))out.push({kind:"mention",icon:"bell",post:p,target:p.id,at:p.at||0,by});
  });
  return out.sort((a,b)=>b.at-a.at).slice(0,80);
}
const NOTIF_WORD={reply:"replied to you",repost:"reposted you",quote:"quoted you",mention:"mentioned you"};
function Notifications({ctx,notifs,seen,acts}){
  if(!notifs.length)return <div className="empty">No replies, reposts or mentions yet.<br/><span style={{fontSize:13}}>They will appear here the moment somebody answers you.</span></div>;
  return <div>{notifs.map((n,i)=>{
    const who=ctx.poster(n.post);
    return <button key={i} className={"notif"+(n.at>seen?" unread":"")} onClick={()=>acts.open(n.target||n.post.id)}>
      <span className="ni"><Ic n={n.icon} s={17}/></span>
      <span style={{flex:1,minWidth:0}}>
        <span className="phead" style={{fontSize:14}}>
          <Avatar p={who} size={22}/>
          <span className="nm">{who.name}</span><Badge check={who.check} globe={who.globe}/>
          <span className="hn">{NOTIF_WORD[n.kind]}</span><span className="dot">·</span><span className="tm">{timeAgo(n.at)}</span>
        </span>
        {n.post.text&&<span className="ptext" style={{display:"block",fontSize:14,color:"var(--ink2)",margin:"3px 0 0"}}>{n.post.text}</span>}
      </span>
    </button>;})}
  </div>;
}

/* ══════════════════════════════════════════════════════════════════════════════
   SEARCH — the box used to jump blindly to a profile; now it searches the posts,
   the people and the office accounts already loaded.
   ══════════════════════════════════════════════════════════════════════════════ */
function Search({q,ctx,acts,onQuery}){
  const [tab,setTab]=useState("top");
  const term=String(q||"").trim().replace(/^@/,"").toLowerCase();
  useEffect(()=>{setTab("top");},[q]);
  const people=useMemo(()=>!term?[]:Object.values(ctx.accounts).filter(a=>
    String(a.username||"").toLowerCase().includes(term)||String(a.displayName||"").toLowerCase().includes(term)).slice(0,20),[ctx.accounts,term]);
  const offices=useMemo(()=>!term?[]:Object.values(ctx.officeAccounts).filter(o=>
    String(o.handle||"").toLowerCase().includes(term)||String(o.displayName||"").toLowerCase().includes(term)).slice(0,20),[ctx.officeAccounts,term]);
  const hits=useMemo(()=>!term?[]:ctx.posts.filter(p=>String(p.text||"").toLowerCase().includes(term))
    .sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,50),[ctx.posts,term]);
  if(!term)return <div className="empty">Search for a person, an office or anything that has been posted.</div>;
  const counts={people:people.length,offices:offices.length,posts:hits.length};
  const showPeople=tab==="top"||tab==="people",showOffices=tab==="top"||tab==="offices",showPosts=tab==="top"||tab==="posts";
  return <div>
    <div className="subnav">
      <button className={tab==="top"?"on":""} onClick={()=>setTab("top")}>Top</button>
      <button className={tab==="people"?"on":""} onClick={()=>setTab("people")}>People <span style={{opacity:.7}}>{counts.people}</span></button>
      <button className={tab==="offices"?"on":""} onClick={()=>setTab("offices")}>Offices <span style={{opacity:.7}}>{counts.offices}</span></button>
      <button className={tab==="posts"?"on":""} onClick={()=>setTab("posts")}>Posts <span style={{opacity:.7}}>{counts.posts}</span></button>
    </div>
    {showPeople&&people.length>0&&<div style={{padding:"10px 16px 4px"}}>
      <div className="grp" style={{margin:"4px 0 2px"}}>People</div>
      {(tab==="top"?people.slice(0,4):people).map(a=>{const b=ctx.userBadges(a.username);
        return <button key={a.username} className="uitem" onClick={()=>acts.profile({handle:String(a.username).toLowerCase()})}>
          <Avatar p={{handle:a.username,mc:a.mcName||a.username}} size={40}/>
          <span><span className="nm">{a.displayName||a.username}<Badge check={b.check} globe={b.globe}/></span><span className="hn" style={{display:"block"}}>@{a.username}</span></span>
        </button>;})}
    </div>}
    {showOffices&&offices.length>0&&<div style={{padding:"10px 16px 4px",borderTop:"1px solid var(--line)"}}>
      <div className="grp" style={{margin:"4px 0 2px"}}>Offices</div>
      {offices.map(o=>{const holder=(o.offices||[]).map(id=>vwOfficeHolder(id,ctx.data,ctx.accounts)).filter(Boolean)[0];
        return <button key={o.id} className="uitem" onClick={()=>acts.profile({office:true,handle:o.handle})}>
          <Avatar p={{office:true,handle:o.handle,img:o.avatar}} size={40}/>
          <span><span className="nm">{o.displayName}<Badge check="verified" globe={isWorldLeaderOffice(o)}/></span>
            <span className="hn" style={{display:"block"}}>@{o.handle}{holder?" · held by @"+holder:" · vacant"}</span></span>
        </button>;})}
    </div>}
    {showPosts&&<div style={{borderTop:"1px solid var(--line)",marginTop:8}}>
      <div className="grp" style={{margin:"12px 16px 2px"}}>Posts</div>
      {hits.length===0?<div className="empty" style={{padding:"28px 16px"}}>No posts contain “{term}”.</div>
        :(tab==="top"?hits.slice(0,10):hits).map(p=><PostCard key={p.id} post={p} ctx={ctx} onOpen={acts.open} onReply={acts.reply} onRepost={acts.repost} onQuote={acts.quote} onDelete={acts.del} onProfile={acts.profile}/>)}
    </div>}
  </div>;
}

/* ══════════════════════════════════════════════════════════════════════════════
   MESSAGES (direct, private) — list and conversation side by side, unread marks,
   day dividers, clock times.
   ══════════════════════════════════════════════════════════════════════════════ */
function Messages({ctx,me,onSend,onRead,seenDM,initialOpen,note}){
  const [open,setOpen]=useState(initialOpen||null);
  const [newTo,setNewTo]=useState("");
  const [find,setFind]=useState("");
  const [text,setText]=useState("");
  const [starting,setStarting]=useState(false);
  const dms=ctx.dms;
  const meU=String(me.username||"").toLowerCase();
  const convs=useMemo(()=>{
    const m={};dms.forEach(d=>{const other=String(d.from||"").toLowerCase()===meU?String(d.to||"").toLowerCase():String(d.from||"").toLowerCase();
      if(!other)return;(m[other]=m[other]||[]).push(d);});
    return Object.entries(m).map(([other,list])=>({other,list:list.sort((a,b)=>(a.at||0)-(b.at||0))}))
      .sort((a,b)=>(b.list[b.list.length-1].at||0)-(a.list[a.list.length-1].at||0));},[dms,meU]);
  useEffect(()=>{if(initialOpen)setOpen(initialOpen);},[initialOpen]);
  useEffect(()=>{if(open)onRead(open);},[open,convs.length,onRead]);
  const active=open?convs.find(c=>c.other===open)||{other:open,list:[]}:null;
  const nameOf=u=>{const a=ctx.accounts[u];return (a&&(a.displayName||a.username))||u;};
  const unreadOf=c=>{const last=c.list.filter(d=>String(d.from||"").toLowerCase()!==meU).slice(-1)[0];
    return !!last&&(last.at||0)>(seenDM[c.other]||0);};
  const send=async()=>{if(!text.trim()||!active)return;const r=await onSend(active.other,text.trim());if(r.ok)setText("");else note(r.error||"Refused","bad");};
  const shownConvs=convs.filter(c=>{const t=find.trim().toLowerCase();if(!t)return true;
    return c.other.includes(t)||String(nameOf(c.other)).toLowerCase().includes(t);});

  return <div className={"dmsplit"+(active?" open":"")}>
    <div className="dmlist">
      <div style={{padding:12,borderBottom:"1px solid var(--line)",display:"flex",flexDirection:"column",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <h2 style={{fontSize:16,fontWeight:800}}>Conversations</h2>
          <button className="iconbtn" style={{marginLeft:"auto",background:"var(--brand)",borderColor:"var(--brand)",color:"#fff"}}
            title="New message" onClick={()=>setStarting(s=>!s)}><Ic n="plus" s={15}/></button>
        </div>
        {starting?<div style={{display:"flex",gap:6}}>
          <input className="inline-in" style={{flex:1,minWidth:0,padding:"7px 10px",fontSize:13}} value={newTo} onChange={e=>setNewTo(e.target.value)} list="vw-accts"
            placeholder="@username" autoFocus onKeyDown={e=>{if(e.key==="Enter"){const u=newTo.trim().replace(/^@/,"").toLowerCase();
              if(!u)return;if(u===meU){note("That's you.","bad");return;}setOpen(u);setNewTo("");setStarting(false);}}}/>
          <button className="btn sm" disabled={!newTo.trim()} onClick={()=>{const u=newTo.trim().replace(/^@/,"").toLowerCase();
            if(u===meU){note("That's you.","bad");return;}setOpen(u);setNewTo("");setStarting(false);}}>Go</button>
        </div>:<div className="box" style={{display:"flex",alignItems:"center",gap:7,background:"var(--bg2)",border:"1px solid var(--line)",borderRadius:8,padding:"6px 9px"}}>
          <Ic n="search" s={14}/><input style={{flex:1,minWidth:0,background:"none",border:0,color:"var(--ink)",font:"inherit",fontSize:13,outline:"none"}}
            value={find} onChange={e=>setFind(e.target.value)} placeholder="Search people"/>
        </div>}
      </div>
      {shownConvs.length===0?<div className="empty" style={{padding:"28px 12px",fontSize:14}}>No conversations yet.</div>
        :shownConvs.map(c=>{const last=c.list[c.list.length-1];
          return <button key={c.other} className={"conv"+(open===c.other?" on":"")} onClick={()=>setOpen(c.other)}>
            <Avatar p={{handle:c.other,mc:c.other}} size={34}/>
            <span style={{flex:1,minWidth:0}}>
              <span style={{display:"flex",alignItems:"baseline",gap:6}}>
                <span className="nm">{nameOf(c.other)}</span><span className="when">{timeAgo(last.at)}</span>
              </span>
              <span className="pv" style={{display:"block"}}>{String(last.from||"").toLowerCase()===meU?"You: ":""}{last.text}</span>
            </span>
            {unreadOf(c)&&<span className="unreaddot"/>}
          </button>;})}
    </div>
    <div className="dmpane">
      {!active?<div className="empty">Pick a conversation, or start a new one.</div>:<>
        <div className="colhd" style={{position:"static",padding:"10px 14px"}}>
          <button className="back" onClick={()=>setOpen(null)} title="Back"><Ic n="arrow-left" s={17}/></button>
          <Avatar p={{handle:active.other,mc:active.other}} size={34}/>
          <div><h1 style={{fontSize:16}}>{nameOf(active.other)}</h1><div className="sub">@{active.other}</div></div>
          <button className="btn sec sm" style={{marginLeft:"auto"}} onClick={()=>ctx.goProfile(active.other)}>
            <span style={{display:"inline-flex",alignItems:"center",gap:6}}><Ic n="user" s={14}/>Profile</span></button>
        </div>
        <div style={{flex:1,padding:"12px 0",minHeight:"40vh",display:"flex",flexDirection:"column",gap:3}}>
          {active.list.length===0&&<div className="empty">No messages yet. Say hello.</div>}
          {active.list.map((d,i)=>{const prev=active.list[i-1];const newDay=!prev||dayKey(prev.at)!==dayKey(d.at);
            const mine=String(d.from||"").toLowerCase()===meU;
            return <React.Fragment key={i}>
              {newDay&&<div className="daysep">{dayLabel(d.at)}</div>}
              <div style={{display:"flex",padding:"0 14px"}}>
                <div className={"bubble "+(mine?"me":"them")}>{d.text}<div className="bt" style={mine?null:{color:"var(--ink3)",opacity:1}}>{fmtClock(d.at)}</div></div>
              </div>
            </React.Fragment>;})}
        </div>
        <div className="dmfoot">
          <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")send();}} placeholder={"Message @"+active.other+"…"} maxLength={DM_MAX}/>
          <button className="btn sm" onClick={send} disabled={!text.trim()}><span style={{display:"inline-flex",alignItems:"center",gap:7}}><Ic n="send" s={15}/>Send</span></button>
        </div>
      </>}
    </div>
  </div>;
}

/* ══════════════════════════════════════════════════════════════════════════════
   ADMIN — office accounts, verification, word filter
   ══════════════════════════════════════════════════════════════════════════════ */
function AdminOffices({ctx,onSave,onSaveProfanity,onSetVerified,onSetBanner,ask,note}){
  const accounts=ctx.officeAccounts;
  const [tab,setTab]=useState("offices");
  const [edit,setEdit]=useState(null);   // null | office-account object
  const [newWord,setNewWord]=useState("");
  const [newVer,setNewVer]=useState("");
  const [filter,setFilter]=useState("");
  const [imgBusy,setImgBusy]=useState("");
  const bans=ctx.banners;
  const pendingBanners=ctx.profileRecs.filter(({u,rec})=>rec.banner&&rec.bannerAt&&
    !(bans[u]&&(bans[u].approvedAt===rec.bannerAt||bans[u].rejectedAt===rec.bannerAt)));
  const liveBanners=ctx.profileRecs.filter(({u,rec})=>rec.banner&&rec.bannerAt&&bans[u]&&bans[u].approvedAt===rec.bannerAt);
  const nameOfU=u=>{const a=ctx.accounts[u];return (a&&(a.displayName||a.username))||u;};
  const pickFor=async(file,which,w,h,q)=>{setImgBusy(which);
    try{const data=await shrinkImage(file,w,h,q);setEdit(e=>({...e,[which]:data}));}
    catch(err){note(err.message||"Could not use that image.","bad");}
    setImgBusy("");};
  const avail=useMemo(()=>vwAvailableOffices(ctx.data),[ctx.data]);
  const pick=useMemo(()=>{
    if(!edit)return avail;
    const known=new Set(avail.map(o=>o.id));
    const extra=(edit.offices||[]).filter(id=>!known.has(id)).map(id=>({id,label:vwOfficeLabel(id)+" — not currently filled",group:"Other"}));
    return [...avail,...extra];
  },[avail,edit]);
  const groups=useMemo(()=>{const g={};pick.forEach(o=>{(g[o.group]=g[o.group]||[]).push(o);});return g;},[pick]);
  const blank=()=>({id:"vwo_"+uid(),handle:"",displayName:"",bio:"",offices:[],createdAt:Date.now()});
  const save=async oa=>{const h=oa.handle.trim().replace(/^@/,"").replace(/[^a-zA-Z0-9_]/g,"");
    if(!h){note("Give it a handle.","bad");return;}if(!oa.displayName.trim()){note("Give it a display name.","bad");return;}
    const map={...accounts,[oa.id]:{...oa,handle:h,displayName:oa.displayName.trim(),bio:oa.bio.trim()}};
    const r=await onSave(map);if(r.ok){setEdit(null);note("Office account saved.","ok");}else note(r.error||"Refused","bad");};
  const remove=oa=>ask({title:"Delete this office account?",
    body:"@"+oa.handle+" ("+oa.displayName+") will no longer be usable by anyone. Its existing posts remain on the network.",
    confirmLabel:"Delete account",danger:true,onYes:async()=>{
      const map={...accounts};delete map[oa.id];const r=await onSave(map);if(r.ok)note("Deleted.","ok");else note(r.error||"Refused","bad");}});
  const words=(((ctx.data&&ctx.data["vw_profanity"])||{}).words)||[];
  const addWord=async()=>{const w=newWord.trim().toLowerCase();if(!w)return;
    if(words.map(x=>String(x).toLowerCase()).includes(w)){note("Already on the list.","bad");return;}
    const r=await onSaveProfanity([...words,w]);if(r.ok){setNewWord("");note("Word banned.","ok");}else note(r.error||"Refused","bad");};
  const rmWord=async w=>{const r=await onSaveProfanity(words.filter(x=>x!==w));if(!r.ok)note(r.error||"Refused","bad");};
  const verifiedList=[...ctx.verifiedSet].sort();
  const addVer=async()=>{const u=newVer.trim().replace(/^@/,"").toLowerCase();if(!u)return;
    const r=await onSetVerified(u,true);if(r.ok){setNewVer("");note("@"+u+" verified.","ok");}else note(r.error||"Refused","bad");};

  const list=Object.values(accounts);
  const rows=list.map(oa=>{
    const ids=oa.offices||[];
    const holders=ids.map(id=>({id,who:vwOfficeHolder(id,ctx.data,ctx.accounts)}));
    const filled=holders.filter(h=>h.who);
    return {oa,ids,holders,filled,posts:ctx.posts.filter(p=>p.asOffice===oa.id).length};
  }).filter(r=>{const t=filter.trim().toLowerCase();if(!t)return true;
    return String(r.oa.handle||"").toLowerCase().includes(t)||String(r.oa.displayName||"").toLowerCase().includes(t)
      ||r.ids.some(id=>vwOfficeLabel(id).toLowerCase().includes(t))||r.filled.some(h=>h.who.includes(t));});

  const subnav=<div className="subnav">
    <button className={tab==="offices"?"on":""} onClick={()=>{setTab("offices");setEdit(null);}}><Ic n="landmark" s={15}/>Offices <span style={{opacity:.7}}>{list.length}</span></button>
    <button className={tab==="verified"?"on":""} onClick={()=>setTab("verified")}><Ic n="badge-check" s={15}/>Verified <span style={{opacity:.7}}>{verifiedList.length}</span></button>
    <button className={tab==="banners"?"on":""} onClick={()=>setTab("banners")}><Ic n="image" s={15}/>Banners{pendingBanners.length>0&&<span style={{background:"var(--brand)",color:"#fff",borderRadius:999,padding:"0 7px",fontSize:11}}>{pendingBanners.length}</span>}</button>
    <button className={tab==="words"?"on":""} onClick={()=>setTab("words")}><Ic n="filter" s={15}/>Word filter <span style={{opacity:.7}}>{words.length}</span></button>
    {tab==="offices"&&!edit&&<button style={{marginLeft:"auto",background:"var(--brand)",color:"#fff",fontWeight:800}} onClick={()=>setEdit(blank())}><Ic n="plus" s={15}/>New office</button>}
  </div>;

  if(tab==="verified")return <div>{subnav}<div style={{padding:16}}>
    <h2 style={{fontSize:20,fontWeight:800}}>Verified accounts</h2>
    <p style={{fontSize:14,color:"var(--ink2)",marginBottom:14}}>Give a player the blue checkmark. Office accounts are verified automatically, and administrators, moderators and world leaders get their own badges. You can also verify from any profile.</p>
    <div style={{display:"flex",gap:8,marginBottom:16,maxWidth:420}}>
      <input className="inline-in" value={newVer} onChange={e=>setNewVer(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addVer();}} list="vw-accts" placeholder="Verify a @username" style={{flex:1}}/>
      <button className="btn sm" onClick={addVer} disabled={!newVer.trim()}>Verify</button></div>
    {verifiedList.length===0?<div className="empty">No players verified yet.</div>
      :verifiedList.map(u=>{const a=ctx.accounts[u];return <div key={u} className="uitem" style={{borderBottom:"1px solid var(--line)",paddingBottom:8}}>
        <Avatar p={{handle:u,mc:(a&&(a.mcName||a.username))||u}} size={40}/>
        <div style={{flex:1}}><div className="nm">{(a&&(a.displayName||a.username))||u}<Badge check="verified"/></div><div className="hn">@{u}</div></div>
        <button className="btn warn sm" onClick={()=>ask({title:"Remove verification?",body:"@"+u+" will lose the blue checkmark.",confirmLabel:"Remove",danger:true,
          onYes:async()=>{const r=await onSetVerified(u,false);if(!r.ok)note(r.error||"Refused","bad");else note("Removed.","");}})}>Remove</button></div>;})}
  </div></div>;

  if(tab==="banners")return <div>{subnav}<div style={{padding:"16px 16px 0"}}>
    <h2 style={{fontSize:20,fontWeight:800}}>Profile banners</h2>
    <p style={{fontSize:14,color:"var(--ink2)",marginBottom:6}}>Players upload a banner from their own profile; it stays hidden from everybody else until you approve it here. Approval applies to that exact image — if the player replaces it, the new one comes back for review.</p>
  </div>
    <div className="grp" style={{margin:"14px 16px 4px"}}>Waiting for approval — {pendingBanners.length}</div>
    {pendingBanners.length===0?<div className="empty" style={{padding:"26px 16px"}}>Nothing waiting.</div>
      :pendingBanners.map(({u,rec})=><div key={u} className="banrow">
        <div className="banprev" style={{backgroundImage:"url("+rec.banner+")"}}/>
        <div style={{flex:1,minWidth:0}}>
          <button className="uitem" style={{padding:0}} onClick={()=>ctx.goProfile(u)}>
            <Avatar p={{handle:u,mc:u}} size={28}/>
            <span><span className="nm">{nameOfU(u)}</span><span className="hn" style={{display:"block"}}>@{u}</span></span>
          </button>
          <div className="meta" style={{marginTop:6,fontSize:12}}><span><Ic n="clock" s={13}/>uploaded {timeAgo(rec.bannerAt)} ago</span>
            {bans[u]&&bans[u].rejectedAt?<span style={{color:"var(--amber)"}}>a previous upload was refused</span>:null}</div>
        </div>
        <div style={{display:"flex",gap:8,flex:"none"}}>
          <button className="btn sm" onClick={async()=>{const r=await onSetBanner(u,"approve",rec.bannerAt);note(r.ok?"Banner approved.":(r.error||"Refused"),r.ok?"ok":"bad");}}>Approve</button>
          <button className="btn warn sm" onClick={()=>ask({title:"Refuse this banner?",body:"@"+u+" will be told to try another image. Nothing else on their profile changes.",
            confirmLabel:"Refuse",danger:true,onYes:async()=>{const r=await onSetBanner(u,"reject",rec.bannerAt);note(r.ok?"Refused.":(r.error||"Refused"),r.ok?"":"bad");}})}>Refuse</button>
        </div>
      </div>)}
    <div className="grp" style={{margin:"18px 16px 4px"}}>Live on profiles — {liveBanners.length}</div>
    {liveBanners.length===0?<div className="empty" style={{padding:"26px 16px"}}>None approved yet.</div>
      :liveBanners.map(({u,rec})=><div key={u} className="banrow">
        <div className="banprev" style={{backgroundImage:"url("+rec.banner+")"}}/>
        <div style={{flex:1,minWidth:0}}>
          <button className="uitem" style={{padding:0}} onClick={()=>ctx.goProfile(u)}>
            <Avatar p={{handle:u,mc:u}} size={28}/>
            <span><span className="nm">{nameOfU(u)}</span><span className="hn" style={{display:"block"}}>@{u}</span></span>
          </button>
          <div className="meta" style={{marginTop:6,fontSize:12}}><span className="state ok">APPROVED</span></div>
        </div>
        <button className="btn warn sm" style={{flex:"none"}} onClick={()=>ask({title:"Take this banner down?",body:"@"+u+"'s banner stops showing to everyone else until it is approved again.",
          confirmLabel:"Take down",danger:true,onYes:async()=>{const r=await onSetBanner(u,"revoke",rec.bannerAt);note(r.ok?"Taken down.":(r.error||"Refused"),r.ok?"":"bad");}})}>Take down</button>
      </div>)}
  </div>;

  if(tab==="words")return <div>{subnav}<div style={{padding:16}}>
    <h2 style={{fontSize:20,fontWeight:800}}>Word filter</h2>
    <p style={{fontSize:14,color:"var(--ink2)",marginBottom:14}}>Posts and replies containing any of these words (whole-word, case-insensitive) are refused. The list is visible only to administrators.</p>
    <div style={{display:"flex",gap:8,marginBottom:16,maxWidth:420}}>
      <input className="inline-in" value={newWord} onChange={e=>setNewWord(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addWord();}} placeholder="Add a banned word" style={{flex:1}}/>
      <button className="btn sm" onClick={addWord} disabled={!newWord.trim()}>Ban</button></div>
    {words.length===0?<div className="empty">No banned words yet.</div>
      :<div style={{display:"flex",flexWrap:"wrap",gap:8}}>{words.map(w=><span key={w} className="tag" style={{fontSize:14,padding:"5px 12px"}}>{w}
        <button onClick={()=>rmWord(w)} style={{background:"none",border:0,color:"var(--red)",marginLeft:8,fontWeight:800,cursor:"pointer"}} title="Remove">×</button></span>)}</div>}
  </div></div>;

  if(edit)return <div>{subnav}<div style={{padding:16}}>
    <h2 style={{fontSize:20,fontWeight:800,marginBottom:14}}>{accounts[edit.id]?"Edit office account":"New office account"}</h2>
    <div className="field"><label>Handle</label><input value={edit.handle} onChange={e=>setEdit({...edit,handle:e.target.value})} placeholder="e.g. HomeOffice"/></div>
    <div className="field"><label>Display name</label><input value={edit.displayName} maxLength={DNAME_MAX} onChange={e=>setEdit({...edit,displayName:e.target.value})} placeholder="e.g. The Home Office"/></div>
    <div className="field"><label>Bio</label><textarea value={edit.bio} maxLength={BIO_MAX} onChange={e=>setEdit({...edit,bio:e.target.value})} style={{minHeight:60,resize:"vertical"}} placeholder="What this account is."/></div>
    <ImagePick label="Profile picture" hint="Square. Shown wherever this office posts." height={110} value={edit.avatar||""} busy={imgBusy==="avatar"}
      onPick={f=>pickFor(f,"avatar",PFP_SIZE,PFP_SIZE,0.86)} onClear={()=>setEdit({...edit,avatar:""})}/>
    <ImagePick label="Banner" hint="Wide. Shown at the top of the office profile. Office images need no approval — you are setting them." height={70} value={edit.banner||""} busy={imgBusy==="banner"}
      onPick={f=>pickFor(f,"banner",BANNER_W,BANNER_H,0.78)} onClear={()=>setEdit({...edit,banner:""})}/>
    <div className="field"><label>Which office may post as this account</label>
      <p style={{fontSize:13,color:"var(--ink2)",marginBottom:8}}>Whoever currently holds a ticked office can sign in as this account and post as it. Cabinet and ministerial posts are read live from each nation's register — the current holder is named beside each one, so you can see at a glance whether ticking it reaches anybody.</p>
      {Object.entries(groups).map(([g,l])=><div key={g}><div className="grp">{g}</div>
        {l.map(o=>{const who=vwOfficeHolder(o.id,ctx.data,ctx.accounts);
          return <label key={o.id} className="chk"><input type="checkbox" checked={edit.offices.includes(o.id)}
            onChange={e=>setEdit({...edit,offices:e.target.checked?[...edit.offices,o.id]:edit.offices.filter(x=>x!==o.id)})}/>{o.label}
            <span className="who" style={who?null:{color:"var(--amber)"}}>{who?"@"+who:"vacant"}</span></label>;})}</div>)}
    </div>
    <div style={{display:"flex",gap:10}}><button className="btn" onClick={()=>save(edit)}>Save</button><button className="btn sec" onClick={()=>setEdit(null)}>Cancel</button></div>
  </div></div>;

  return <div>{subnav}
    <div className="filterbar">
      <div className="box"><Ic n="search" s={14}/><input value={filter} onChange={e=>setFilter(e.target.value)} placeholder="Filter by handle, office or holder"/></div>
      <span className="hint">{rows.length} of {list.length}</span>
    </div>
    {list.length===0?<div className="empty">No office accounts yet. Create one for an office.</div>
      :rows.length===0?<div className="empty">Nothing matches that filter.</div>
      :rows.map(({oa,ids,holders,filled,posts})=><div key={oa.id} className="post" style={{alignItems:"flex-start"}}>
        <Avatar p={{office:true,handle:oa.handle,img:oa.avatar}} size={40}/>
        <div className="body">
          <div className="phead">
            <span className="nm" onClick={()=>ctx.goOffice(oa.handle)}>{oa.displayName}</span>
            <span className="hn">@{oa.handle}</span>
            {ids.length===0?<span className="state vac">NO OFFICE — UNREACHABLE</span>
              :filled.length===0?<span className="state vac">VACANT — NOBODY CAN POST</span>
              :<span className="state ok">HELD BY @{filled[0].who.toUpperCase()}{filled.length>1?" +"+(filled.length-1):""}</span>}
          </div>
          {oa.bio&&<div className="ptext" style={{fontSize:13,color:"var(--ink2)"}}>{oa.bio}</div>}
          <div className="meta" style={{marginTop:6,fontSize:12}}>
            <span>{ids.length?ids.map(id=>vwOfficeLabel(id)).join(" · "):"no office attached"}</span>
            <span>{posts} posts</span>
          </div>
        </div>
        <div style={{display:"flex",gap:6,flex:"none"}}>
          <button className="iconbtn" title="Edit" onClick={()=>setEdit({...oa,offices:[...(oa.offices||[])]})}><Ic n="pencil" s={15}/></button>
          <button className="iconbtn" title="Open profile" onClick={()=>ctx.goOffice(oa.handle)}><Ic n="external-link" s={15}/></button>
          <button className="iconbtn danger" title="Delete" onClick={()=>remove(oa)}><Ic n="trash-2" s={15}/></button>
        </div>
      </div>)}
  </div>;
}

/* ══════════════════════════════════════════════════════════════════════════════
   SIGN IN
   ══════════════════════════════════════════════════════════════════════════════ */
function SignIn({onClose,onAuth}){
  const [u,setU]=useState(""),[p,setP]=useState(""),[err,setErr]=useState(""),[busy,setBusy]=useState(false);
  const go=async()=>{if(!u.trim()||!p){setErr("Enter your username and password.");return;}setBusy(true);setErr("");
    const r=await slogin(u,p);setBusy(false);if(!r.ok){setErr(r.error||"Refused");return;}onAuth(r.account);};
  return <div className="modal-bg" onClick={onClose}><div className="modal" style={{maxWidth:420}} onClick={e=>e.stopPropagation()}>
    <div className="mh"><h2>Sign in to Vwitter</h2></div>
    <div className="mb">
      <p style={{color:"var(--ink2)",marginBottom:14,fontSize:14}}>One Vintranet account across the whole network. You already have a Vwitter — it's you.</p>
      {err&&<div style={{color:"var(--red)",marginBottom:12,fontSize:14}}>{err}</div>}
      <div className="field"><label>Username</label><input value={u} onChange={e=>setU(e.target.value)} autoFocus/></div>
      <div className="field"><label>Password</label><input type="password" value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")go();}}/></div>
      <button className="btn" style={{width:"100%"}} onClick={go} disabled={busy}>{busy?"Signing in…":"Sign in"}</button>
    </div></div></div>;
}

/* ══════════════════════════════════════════════════════════════════════════════
   APP
   ══════════════════════════════════════════════════════════════════════════════ */
function App(){
  const [raw,setRaw]=useState({});
  const [loading,setLoading]=useState(true);
  const [me,setMe]=useState(()=>cachedAccount());
  const [route,setRoute]=useState({name:"home"});
  const [signIn,setSignIn]=useState(false);
  const [toast,setToast]=useState(null);
  const [activeId,setActiveId]=useState("self");
  const [feedFilter,setFeedFilter]=useState("latest");
  const [query,setQuery]=useState("");
  const [menu,setMenu]=useState(false);
  const [quote,setQuote]=useState(null);
  const [confirm,setConfirm]=useState(null);
  const [seenNotif,setSeenNotif]=useState(()=>readSeenNotif());
  const [seenDM,setSeenDM]=useState(()=>readSeenDM());
  const [lastPost,setLastPost]=useState(0);
  const [nowTick,setNowTick]=useState(Date.now());
  const note=useCallback((m,c)=>{setToast({m,c:c||""});setTimeout(()=>setToast(null),3200);},[]);
  const ask=useCallback(cfg=>setConfirm(cfg),[]);

  const loadAll=useCallback(async()=>{const r=await sgetAll();setRaw(r);setLoading(false);return r;},[]);
  useEffect(()=>{loadAll();},[loadAll]);
  useEffect(()=>{srestore().then(a=>{if(a)setMe(a);else if(!AUTH_TOKEN)setMe(null);});},[]);
  useEffect(()=>{const id=setInterval(async()=>{if(document.visibilityState==="visible"){const r=await sgetAll();setRaw(r);}},9000);return()=>clearInterval(id);},[]);
  // ticks only while the one-a-minute limit is running, to count it down on the button
  useEffect(()=>{if(!lastPost)return;const id=setInterval(()=>setNowTick(Date.now()),1000);return()=>clearInterval(id);},[lastPost]);
  useEffect(()=>{const close=()=>setMenu(false);if(menu){document.addEventListener("click",close);return()=>document.removeEventListener("click",close);}},[menu]);

  const accounts=useMemo(()=>{const m={};Object.values(raw["mi_accounts"]||{}).forEach(a=>{if(a&&a.username)m[String(a.username).toLowerCase()]=a;});return m;},[raw]);
  const officeAccounts=useMemo(()=>raw["vw_office_accounts"]||{},[raw]);
  const posts=useMemo(()=>Object.entries(raw).filter(([k])=>k.indexOf("vw_post_")===0).map(([,v])=>v).filter(p=>p&&p.id),[raw]);
  const dms=useMemo(()=>Object.entries(raw).filter(([k])=>k.indexOf("vw_dm_")===0).map(([,v])=>v).filter(Boolean),[raw]);
  const postMap=useMemo(()=>{const m={};posts.forEach(p=>{m[p.id]=p;});return m;},[posts]);
  const bioOf=useCallback(u=>{const r=raw["vw_profile_"+String(u||"").toLowerCase()];return (r&&r.bio)||"";},[raw]);
  const verifiedSet=useMemo(()=>new Set(Object.entries(raw["vw_verified"]||{}).filter(([,v])=>v).map(([k])=>String(k).toLowerCase())),[raw]);
  const bannerApprovals=useMemo(()=>raw["vw_banners"]||{},[raw]);
  const profileRecs=useMemo(()=>Object.entries(raw).filter(([k])=>k.indexOf("vw_profile_")===0)
    .map(([k,v])=>({u:k.slice(11),rec:v||{}})).filter(x=>x.u),[raw]);
  const pendingBanners=useMemo(()=>profileRecs.filter(({u,rec})=>rec.banner&&rec.bannerAt&&
    !(bannerApprovals[u]&&(bannerApprovals[u].approvedAt===rec.bannerAt||bannerApprovals[u].rejectedAt===rec.bannerAt))),[profileRecs,bannerApprovals]);

  const myOffices=useMemo(()=>me?Object.values(officeAccounts).filter(oa=>vwUserControls(me,oa,raw)):[],[me,officeAccounts,raw]);
  const identities=useMemo(()=>{if(!me)return [];
    return [{id:"self",office:false,handle:me.username,name:me.displayName||me.username,mc:me.mcName||me.username},
      ...myOffices.map(oa=>({id:oa.id,office:true,handle:oa.handle,name:oa.displayName}))];},[me,myOffices]);
  useEffect(()=>{if(!identities.find(i=>i.id===activeId))setActiveId("self");},[identities,activeId]);

  const goProfile=useCallback(u=>setRoute({name:"profile",handle:String(u||"").toLowerCase()}),[]);
  const goOffice=useCallback(h=>setRoute({name:"profile",handle:h,office:true}),[]);

  const ctx=useMemo(()=>({
    me,accounts,officeAccounts,posts,dms,data:raw,verifiedSet,goProfile,goOffice,
    banners:bannerApprovals,profileRecs,
    profileRec:u=>raw["vw_profile_"+String(u||"").toLowerCase()]||{},
    byId:id=>postMap[id],
    poster:post=>{if(post.asOffice&&officeAccounts[post.asOffice]){const oa=officeAccounts[post.asOffice];
        return {office:true,id:post.asOffice,handle:oa.handle,name:oa.displayName||oa.handle,img:oa.avatar||"",check:"verified",globe:isWorldLeaderOffice(oa)};}
      const a=accounts[String(post.author||"").toLowerCase()];
      return {handle:post.author,name:(a&&(a.displayName||a.username))||post.author,mc:(a&&(a.mcName||a.username))||post.author,
        check:userCheck(a,verifiedSet),globe:a?isWorldLeaderUser(a,raw):false};},
    userBadges:username=>{const a=accounts[String(username||"").toLowerCase()];return {check:userCheck(a,verifiedSet),globe:a?isWorldLeaderUser(a,raw):false};},
    officeBadges:oa=>({check:"verified",globe:isWorldLeaderOffice(oa)}),
    canDelete:post=>!!(me&&(String(post.author||"").toLowerCase()===String(me.username||"").toLowerCase()||isAdmin(me))),
    repliesTo:id=>posts.filter(p=>p.replyTo===id),
    repostsOf:id=>posts.filter(p=>p.repostOf===id&&!p.text),
    iRepostedOf:id=>!!(me&&posts.find(p=>p.repostOf===id&&!p.text&&String(p.author||"").toLowerCase()===String(me.username||"").toLowerCase())),
    officeByHandle:h=>Object.values(officeAccounts).find(o=>String(o.handle||"").toLowerCase()===String(h||"").replace(/^@/,"").toLowerCase()),
    bioOf,
  }),[me,accounts,officeAccounts,posts,dms,postMap,bioOf,raw,verifiedSet,goProfile,goOffice,bannerApprovals,profileRecs]);

  const patch=(k,v)=>setRaw(r=>({...r,[k]:v}));
  const cooldown=lastPost?Math.max(0,Math.ceil((RATE_MS-(nowTick-lastPost))/1000)):0;
  const doPost=useCallback(async({text,asOffice,replyTo,repostOf})=>{
    if(!me){setSignIn(true);return{ok:false};}
    const id="p_"+uid();const key="vw_post_"+id;
    const rec={id,author:String(me.username||"").toLowerCase(),asOffice:asOffice||"",text:text||"",at:Date.now(),replyTo:replyTo||"",repostOf:repostOf||""};
    const r=await sset(key,rec);if(r.ok)patch(key,rec);return r;},[me]);
  // Reposting always targets the ORIGINAL, so a repost of a repost is impossible;
  // clicking again removes your repost. Rate-limited like a fresh post.
  const repost=useCallback(async post=>{if(!me){setSignIn(true);return;}
    const targetId=(post.repostOf&&!String(post.text||"").trim())?post.repostOf:post.id;
    const existing=posts.find(p=>p.repostOf===targetId&&!p.text&&String(p.author||"").toLowerCase()===String(me.username||"").toLowerCase());
    if(existing){await sdel("vw_post_"+existing.id);await loadAll();note("Repost removed.","");return;}
    if(cooldown>0){note("One post a minute — try again in "+cooldown+"s.","bad");return;}
    const ident=identities.find(i=>i.id===activeId)||identities[0];
    const r=await doPost({text:"",asOffice:ident&&ident.office?ident.id:"",repostOf:targetId});
    if(r.ok){setLastPost(Date.now());setNowTick(Date.now());note("Reposted.","ok");}else note(r.error||"Refused","bad");},[me,posts,identities,activeId,doPost,loadAll,note,cooldown]);
  const del=useCallback(post=>{ask({title:"Delete this post?",
    body:String(post.text||"").slice(0,140)||"This repost will be removed.",confirmLabel:"Delete",danger:true,
    onYes:async()=>{const r=await sdel("vw_post_"+post.id);if(r.ok){await loadAll();note("Deleted.","");}else note(r.error||"Refused","bad");}});},[loadAll,note,ask]);
  const saveProfile=useCallback(async fields=>{if(!me)return{ok:false};
    const u=String(me.username||"").toLowerCase(),key="vw_profile_"+u;
    const rec={...(raw[key]||{}),...fields,updatedAt:Date.now()};
    const r=await sset(key,rec);if(r.ok)patch(key,rec);return r;},[me,raw]);
  const saveBio=useCallback(bio=>saveProfile({bio}),[saveProfile]);
  // a fresh upload always resets approval, because the approval is tied to bannerAt
  const saveBanner=useCallback(data=>saveProfile(data?{banner:data,bannerAt:Date.now()}:{banner:"",bannerAt:0}),[saveProfile]);
  const setBannerApproval=useCallback(async(username,mode,bannerAt)=>{
    const u=String(username||"").toLowerCase();if(!u)return{ok:false};
    const map={...(raw["vw_banners"]||{})};const by=String((me&&me.username)||"").toLowerCase();
    if(mode==="approve")map[u]={approvedAt:bannerAt,at:Date.now(),by};
    else if(mode==="reject")map[u]={rejectedAt:bannerAt,at:Date.now(),by};
    else delete map[u];
    const r=await sset("vw_banners",map);if(r.ok)patch("vw_banners",map);else await loadAll();return r;},[raw,me,loadAll]);
  const sendDM=useCallback(async(to,text)=>{if(!me)return{ok:false};const id="d_"+uid();const key="vw_dm_"+id;
    const rec={id,from:String(me.username||"").toLowerCase(),fromOffice:"",to:String(to||"").toLowerCase(),text,at:Date.now()};
    const r=await sset(key,rec);if(r.ok)patch(key,rec);return r;},[me]);
  const saveOffices=useCallback(async map=>{const r=await sset("vw_office_accounts",map);if(r.ok)patch("vw_office_accounts",map);else await loadAll();return r;},[loadAll]);
  const saveProfanity=useCallback(async words=>{const r=await sset("vw_profanity",{words});if(r.ok)patch("vw_profanity",{words});else await loadAll();return r;},[loadAll]);
  const setVerified=useCallback(async(username,on)=>{const u=String(username||"").replace(/^@/,"").toLowerCase();if(!u)return{ok:false};
    const map={...(raw["vw_verified"]||{})};if(on)map[u]=true;else delete map[u];
    const r=await sset("vw_verified",map);if(r.ok)patch("vw_verified",map);else await loadAll();return r;},[raw,loadAll]);

  const guardPost=useCallback(async payload=>{if(!me){setSignIn(true);return{ok:false};}
    if(!payload.replyTo&&cooldown>0){note("One post a minute — try again in "+cooldown+"s.","bad");return{ok:false};}
    const r=await doPost(payload);if(r.ok&&!payload.replyTo){setLastPost(Date.now());setNowTick(Date.now());}return r;},[me,doPost,note,cooldown]);
  const openProfile=p=>setRoute(p.office?{name:"profile",handle:p.handle,office:true}:{name:"profile",handle:p.handle});
  const acts={open:id=>setRoute({name:"thread",id}),reply:post=>setRoute({name:"thread",id:post.id}),repost,del,profile:openProfile,
    quote:post=>{if(!me){setSignIn(true);return;}setQuote(post);},
    composerProps:{me,identities,activeId,setActiveId,onPost:guardPost,ctx,cooldown}};

  const admin=isAdmin(me);
  const notifs=useMemo(()=>buildNotifs(posts,me,accounts),[posts,me,accounts]);
  const notifUnseen=notifs.filter(n=>n.at>seenNotif).length;
  const dmUnseen=useMemo(()=>{if(!me)return 0;const meU=String(me.username||"").toLowerCase();const by={};
    dms.forEach(d=>{const from=String(d.from||"").toLowerCase(),to=String(d.to||"").toLowerCase();
      if(from===meU)return;if(to!==meU)return;by[from]=Math.max(by[from]||0,d.at||0);});
    return Object.entries(by).filter(([u,at])=>at>(seenDM[u]||0)).length;},[dms,me,seenDM]);
  const markDMRead=useCallback(other=>{setSeenDM(prev=>{const next={...prev,[other]:Date.now()};writeSeenDM(next);return next;});},[]);

  useEffect(()=>{if(route.name==="notifs"){const top=notifs.length?notifs[0].at:Date.now();
    if(top>seenNotif){writeSeenNotif(top);setSeenNotif(top);}}},[route.name,notifs,seenNotif]);

  const NAV=[
    {id:"home",ic:"home",label:"Home"},
    me&&{id:"notifs",ic:"bell",label:"Notifications",count:notifUnseen},
    {id:"messages",ic:"mail",label:"Messages",count:dmUnseen},
    {id:"search",ic:"search",label:"Explore"},
    me&&{id:"myprofile",ic:"user",label:"Profile"},
    admin&&{id:"admin",ic:"wrench",label:"Administration",count:pendingBanners.length}
  ].filter(Boolean);
  const goNav=id=>{setMenu(false);
    if(id==="myprofile"){if(me)setRoute({name:"profile",handle:me.username});else setSignIn(true);return;}
    if((id==="messages"||id==="admin"||id==="notifs")&&!me){setSignIn(true);return;}
    if(id==="search"){setRoute({name:"search",q:query});return;}
    setRoute({name:id});};
  const curNav=route.name==="profile"&&me&&route.handle===me.username&&!route.office?"myprofile":route.name;
  const runSearch=v=>{setQuery(v);setRoute({name:"search",q:v});};

  const searchBox=<div className="hdsearch"><Ic n="search" s={16}/>
    <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search posts, people, offices"
      onKeyDown={e=>{if(e.key==="Enter")runSearch(e.target.value);}}/></div>;

  let header,content;
  if(route.name==="thread"){
    header=<><button className="back" onClick={()=>setRoute({name:"home"})} title="Back"><Ic n="arrow-left" s={17}/></button>
      <div><h1 style={{fontSize:17}}>Thread</h1><div className="sub">{ctx.repliesTo(route.id).length} replies</div></div>{searchBox}</>;
    content=<Thread id={route.id} ctx={ctx} acts={acts}/>;}
  else if(route.name==="profile"){
    const nm=route.office?(ctx.officeByHandle(route.handle)||{}).displayName||route.handle:((accounts[String(route.handle).toLowerCase()]||{}).displayName||route.handle);
    header=<><button className="back" onClick={()=>setRoute({name:"home"})} title="Back"><Ic n="arrow-left" s={17}/></button>
      <div><h1 style={{fontSize:17}}>{nm}</h1><div className="sub">@{route.handle}</div></div>{searchBox}</>;
    content=<Profile handle={route.handle} office={route.office} ctx={ctx} acts={acts} me={me} admin={admin} onSaveBio={saveBio} onSaveBanner={saveBanner} onVerify={setVerified}
      onMessage={u=>setRoute({name:"messages",dm:u})} note={note}/>;}
  else if(route.name==="messages"){
    header=<><h1>Messages</h1>{dmUnseen>0&&<span className="badge" style={{background:"var(--brand)",color:"#fff",fontSize:12,fontWeight:700,borderRadius:999,padding:"1px 8px"}}>{dmUnseen} unread</span>}</>;
    content=me?<Messages ctx={ctx} me={me} onSend={sendDM} onRead={markDMRead} seenDM={seenDM} initialOpen={route.dm} note={note}/>
      :<div className="empty">Sign in to read your messages.</div>;}
  else if(route.name==="notifs"){
    header=<><h1>Notifications</h1><div className="sub" style={{marginLeft:2}}>replies, reposts, quotes and mentions</div>{searchBox}</>;
    content=me?<Notifications ctx={ctx} notifs={notifs} seen={seenNotif} acts={acts}/>:<div className="empty">Sign in to see your notifications.</div>;}
  else if(route.name==="search"){
    header=<><button className="back" onClick={()=>setRoute({name:"home"})} title="Back"><Ic n="arrow-left" s={17}/></button><h1 style={{fontSize:17}}>Explore</h1>{searchBox}</>;
    content=<Search q={route.q!==undefined?route.q:query} ctx={ctx} acts={acts} onQuery={runSearch}/>;}
  else if(route.name==="admin"){
    header=<><h1>Administration</h1><span className="state" style={{color:"var(--red)",border:"1px solid rgba(244,52,78,.5)"}}>ADMIN ONLY</span>{searchBox}</>;
    content=admin?<AdminOffices ctx={ctx} onSave={saveOffices} onSaveProfanity={saveProfanity} onSetVerified={setVerified} onSetBanner={setBannerApproval} ask={ask} note={note}/>
      :<div className="empty">Administrators only.</div>;}
  else {
    header=<><h1>Home</h1>
      {me&&<div className="seg" style={{marginLeft:6}}>
        <button className={feedFilter==="latest"?"on":""} onClick={()=>setFeedFilter("latest")}>Latest</button>
        <button className={feedFilter==="offices"?"on":""} onClick={()=>setFeedFilter("offices")}>Offices only</button>
      </div>}
      {searchBox}</>;
    content=me?<Feed ctx={ctx} acts={acts} filter={feedFilter}/>:<div>
      <div className="empty" style={{paddingBottom:8}}>Welcome to Vwitter. Sign in to post, reply and message.</div>
      <div style={{textAlign:"center"}}><button className="btn" onClick={()=>setSignIn(true)}>Sign in</button></div>
      <div style={{marginTop:20}}>{posts.filter(p=>!p.replyTo).sort((a,b)=>(b.at||0)-(a.at||0)).map(p=><PostCard key={p.id} post={p} ctx={ctx} onProfile={openProfile} compact/>)}</div>
    </div>;}

  const identSelf=identities[0];
  const people=useMemo(()=>Object.values(accounts).slice(0,5),[accounts]);
  const officeList=Object.values(officeAccounts);

  return <div className="shell">
    <datalist id="vw-accts">{Object.keys(accounts).map(u=><option key={u} value={u}/>)}</datalist>
    <nav className="rail">
      <div className="logo"><span className="v">V</span><span>Vwitter</span></div>
      {NAV.map(n=><button key={n.id} className={"navi"+(curNav===n.id?" on":"")} onClick={()=>goNav(n.id)} title={n.label}>
        <Ic n={n.ic} s={20}/><span>{n.label}</span>{n.count>0&&<span className="badge">{n.count}</span>}</button>)}
      {me&&<button className="postbtn" onClick={()=>{setRoute({name:"home"});setTimeout(()=>{const t=document.querySelector('.composer textarea');if(t)t.focus();},60);}}>
        <Ic n="pen-line" s={17}/><span>New post</span></button>}
      <div className="railfoot">
        {menu&&me&&<div className="menu" onClick={e=>e.stopPropagation()}>
          <div className="mlabel">SIGNED IN AS @{String(me.username||"").toUpperCase()}</div>
          <button onClick={()=>{setMenu(false);setRoute({name:"profile",handle:me.username});}}><Ic n="user" s={16}/>Your profile</button>
          {identities.length>1&&<button onClick={()=>{setMenu(false);setRoute({name:"home"});
            setTimeout(()=>{const t=document.querySelector('.composer textarea');if(t)t.focus();},60);}}><Ic n="repeat-2" s={16}/>Switch posting identity</button>}
          <button className="danger" onClick={()=>{setMenu(false);
            ask({title:"Sign out of Vwitter?",body:"You will need your Vintranet username and password to sign back in.",confirmLabel:"Sign out",danger:true,
              onYes:()=>{forgetSession();setMe(null);setRoute({name:"home"});note("Signed out.","");}});}}><Ic n="log-out" s={16}/>Sign out</button>
        </div>}
        {me?<button className="me-chip" onClick={e=>{e.stopPropagation();setMenu(m=>!m);}}>
            <Avatar p={identSelf} size={36}/>
            <div className="txt"><div className="nm">{me.displayName||me.username}</div><div className="hn">@{me.username}</div></div>
            <span className="caret"><Ic n={menu?"chevron-down":"chevron-up"} s={15}/></span>
          </button>
          :<button className="btn" style={{width:"100%"}} onClick={()=>setSignIn(true)}>Sign in</button>}
      </div>
    </nav>

    <main className="col">
      <div className="colhd">{header}</div>
      {loading?<div className="empty">Loading…</div>:content}
    </main>

    <aside className="side">
      <div className="widget">
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
          <h3 style={{marginBottom:0}}>Office accounts</h3>
          {officeList.length>6&&<button className="hint" style={{marginLeft:"auto",background:"none",border:0,color:"var(--brandL)"}}
            onClick={()=>runSearch("")}>all {officeList.length}</button>}
        </div>
        {officeList.length===0?<div style={{color:"var(--ink3)",fontSize:14}}>None yet.</div>
          :officeList.slice(0,6).map(oa=>{const holder=(oa.offices||[]).map(id=>vwOfficeHolder(id,raw,accounts)).filter(Boolean)[0];
            return <button key={oa.id} className="uitem" onClick={()=>goOffice(oa.handle)}>
              <Avatar p={{office:true,handle:oa.handle,img:oa.avatar}} size={38}/>
              <span><span className="nm">{oa.displayName}<Badge check="verified" globe={isWorldLeaderOffice(oa)}/></span>
                <span className="hn" style={{display:"block"}}>{holder?"held by @"+holder:<span style={{color:"var(--amber)"}}>vacant</span>}</span></span>
            </button>;})}
      </div>
      <div className="widget"><h3>Who's here</h3>
        {people.map(a=>{const b=ctx.userBadges(a.username);const n=posts.filter(p=>String(p.author||"").toLowerCase()===String(a.username).toLowerCase()).length;
          return <button key={a.username} className="uitem" onClick={()=>goProfile(a.username)}>
            <Avatar p={{handle:a.username,mc:a.mcName||a.username}} size={38}/>
            <span><span className="nm">{a.displayName||a.username}<Badge check={b.check} globe={b.globe}/></span>
              <span className="hn" style={{display:"block"}}>@{a.username}{n?" · "+n+" posts":""}</span></span>
          </button>;})}
      </div>
      <div style={{fontSize:12,color:"var(--ink3)",padding:"0 6px"}}>Vwitter · a service of the Vintranet · <a href="index.html">Networks</a></div>
    </aside>

    {quote&&<div className="modal-bg" onClick={()=>setQuote(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="mh"><button className="back" onClick={()=>setQuote(null)}><Ic n="arrow-left" s={17}/></button><h2>Quote this post</h2></div>
      <Composer {...acts.composerProps} quoted={quote} placeholder="Add your own words…" autoFocus onDone={()=>{setQuote(null);note("Quoted.","ok");}}/>
    </div></div>}

    {signIn&&<SignIn onClose={()=>setSignIn(false)} onAuth={a=>{setMe(a);setSignIn(false);loadAll();note("Signed in as "+(a.displayName||a.username)+".","ok");}}/>}
    <Confirm open={!!confirm} title={confirm&&confirm.title} body={confirm&&confirm.body} confirmLabel={confirm&&confirm.confirmLabel}
      danger={confirm&&confirm.danger} onNo={()=>setConfirm(null)}
      onYes={()=>{const c=confirm;setConfirm(null);if(c&&c.onYes)c.onYes();}}/>
    {toast&&<div className={"toast "+toast.c}>{toast.m}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
