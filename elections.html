/* ══════════════════════════════════════════════════════════════════════════════
   IMPERIAL ELECTORAL COMMISSION · REICHSWAHLAMT
   ──────────────────────────────────────────────────────────────────────────────
   Rebuilt 2026-07-31. One page, one pipeline:

     Draft → Nominations Open → Nominations Closed → Poll Open → Poll Closed
           → Certified (frozen into the Election History archive)

   ─ Sign-in is the shared Vintranet session; the whole net is one account.
   ─ The Registrar (Returning Officer) is any account the server recognises as
     such: the Emperor, a Minister, or clearance 3+. The server, not this page,
     is what actually enforces every write.
   ─ Candidates file their OWN nomination (el_reg_<electionId>_<username>). The
     Registrar rules on the candidacy and on any new-party application
     SEPARATELY — a denied party with an approved candidacy simply seats the
     candidate as an Independent, or under a party the Registrar assigns.
   ─ Parties come from the one imperial register, bk_parties, kept in the
     Bundeskongress. A newly recognised party is written straight onto it.
   ─ Ballot: each voter casts a fixed number of votes (2 by default) among named
     candidates — both to one, or one each to two. Seats are apportioned across
     candidates by largest remainder over the whole house, so a candidate on a
     third of the vote takes a third of the seats. A party's seats are the sum
     of its candidates'.
   ══════════════════════════════════════════════════════════════════════════════ */
const {useState,useEffect,useMemo,useCallback,useRef}=React;

/* ── design tokens — the Bundeskongress's imperial oxblood-and-gold ─────────── */

const CREED_ITEMS=CREED.reduce((a,s)=>a.concat(s.items),[]);
const CREED_COUNT=CREED_ITEMS.length;
const LIKERT=[
  {v:-2,l:"Strongly opposed",s:"−−",c:C.redL},
  {v:-1,l:"Opposed",         s:"−", c:"#a05050"},
  {v:0, l:"Neutral",         s:"·", c:C.textD},
  {v:1, l:"In favour",       s:"+", c:"#7a9a5a"},
  {v:2, l:"Strongly in favour",s:"++",c:C.greenL},
];
/* Resolve a set of answers into a position on each axis, −1 … +1. */
function creedAxes(answers){
  const acc={},cnt={};
  AXES.forEach(a=>{acc[a.id]=0;cnt[a.id]=0;});
  CREED_ITEMS.forEach(it=>{
    const v=(answers||{})[it.id];
    if(v==null)return;
    acc[it.ax]+=Number(v)*it.d; cnt[it.ax]++;
  });
  const out={};
  AXES.forEach(a=>{out[a.id]=cnt[a.id]>0?acc[a.id]/(cnt[a.id]*2):0;});
  return out;
}
/* A one-line reading of those axes, for lists and cards. */
function creedSummary(answers){
  const ax=creedAxes(answers);
  const word=(a,v)=>Math.abs(v)<0.12?"Centrist":(Math.abs(v)>=0.5?"Strongly ":"")+(v>0?a.right:a.left);
  return AXES.map(a=>word(a,ax[a.id])).join(" · ");
}
function creedAnswered(answers){
  return CREED_ITEMS.filter(it=>(answers||{})[it.id]!=null).length;
}

/* ══════════════════════════════════════════════════════════════════════════════
   BACKEND — the shared Vintranet session and snapshot, identical in protocol to
   every other page on the net.
   ══════════════════════════════════════════════════════════════════════════════ */
const API="https://lech-backend.onrender.com";
let AUTH_TOKEN=null;
const SESSION_KEY="lech_session";
const SESSION_ACC_KEY="lech_session_acc";
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function saveSession(t,acc){try{if(t)localStorage.setItem(SESSION_KEY,t);if(acc)localStorage.setItem(SESSION_ACC_KEY,JSON.stringify(acc));}catch(e){}}
function cachedAccount(){
  try{
    const t=localStorage.getItem(SESSION_KEY); if(!t)return null;
    const a=localStorage.getItem(SESSION_ACC_KEY); if(!a)return null;
    AUTH_TOKEN=t; return JSON.parse(a);
  }catch(e){return null;}
}
function clearSession(){try{localStorage.removeItem(SESSION_KEY);localStorage.removeItem(SESSION_ACC_KEY);}catch(e){}AUTH_TOKEN=null;}
function forgetSession(){const t=AUTH_TOKEN;clearSession();try{if(t)fetch(API+"/api/logout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t})});}catch(e){}}
async function srestore(){
  let t=null;try{t=localStorage.getItem(SESSION_KEY);}catch(e){}
  if(!t)return null;AUTH_TOKEN=t;
  try{
    const r=await fetch(API+"/api/me?token="+encodeURIComponent(t));
    const d=await r.json();
    if(d&&d.ok&&d.account){saveSession(t,d.account);return d.account;}
    clearSession();return null;
  }catch(e){return null;}
}
async function sgetAll(){try{const r=await fetch(API+"/api/data"+(AUTH_TOKEN?"?token="+encodeURIComponent(AUTH_TOKEN):""));const d=await r.json();return (d&&d.ok)?(d.data||{}):{};}catch(e){return{};}}
async function sset(k,v){
  try{
    const r=await fetch(API+"/api/set",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:AUTH_TOKEN,key:k,value:v})});
    const d=await r.json();
    return (d&&d.ok)?{ok:true}:{ok:false,error:(d&&d.error)||"Refused by the server"};
  }catch(e){return{ok:false,error:"Connection error"};}
}
async function sdel(k){try{await fetch(API+"/api/unset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:AUTH_TOKEN,key:k})});}catch(e){}}
async function slogin(username,password){
  try{
    const r=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:String(username||"").trim(),password})});
    const d=await r.json();
    if(d&&d.ok){AUTH_TOKEN=d.token;saveSession(d.token,d.account);return{ok:true,account:d.account};}
    return {ok:false,error:(d&&d.error)||"ACCESS DENIED"};
  }catch(e){return {ok:false,error:"Connection error"};}
}
/* Mirrors isReturningOfficer() on the server. The page hides what it must; the
   server is what actually refuses the write. */
const isRegistrar=a=>!!a&&(a.role==="emperor"||a.role==="minister"||(a.clearance||0)>=3);

/* ══════════════════════════════════════════════════════════════════════════════
   SEAT MATHS
   ══════════════════════════════════════════════════════════════════════════════ */
/* Largest remainder over the whole house: a candidate on a third of the vote
   takes a third of the seats, and the seats always sum to exactly seatsTotal. */
function allocateSeats(voteMap,seatsTotal){
  const entries=Object.entries(voteMap||{}).filter(([_,v])=>v>0);
  const total=entries.reduce((a,[_,v])=>a+v,0);
  if(total===0||seatsTotal<=0)return{};
  const rows=entries.map(([id,v])=>{const ex=v*seatsTotal/total;const fl=Math.floor(ex);return{id,votes:v,fl,rem:ex-fl};});
  const used=rows.reduce((a,r)=>a+r.fl,0);
  rows.sort((a,b)=>b.rem-a.rem||b.votes-a.votes||String(a.id).localeCompare(String(b.id)));
  const out={};rows.forEach(r=>{out[r.id]=r.fl;});
  for(let i=0;i<seatsTotal-used;i++)out[rows[i%rows.length].id]++;
  return out;
}
function pct(n,d){return d>0?(n/d*100):0;}
/* A polling date is a calendar date, not an instant. "2026-08-15" parses as UTC
   midnight, which renders as the 14th anywhere west of Greenwich — so a plain
   date is rebuilt from its own parts and left in local time. */
function fmtDate(d){
  if(!d)return"—";
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d).trim());
  const x=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(d);
  if(isNaN(x))return String(d);
  return x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
function fmtWhen(d){if(!d)return"—";const x=new Date(d);if(isNaN(x))return String(d);
  return x.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function slugify(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,28)||"party";}
function drift(n){return n>0?"▲ "+n:n<0?"▼ "+Math.abs(n):"—";}
function driftColor(n){return n>0?C.greenL:n<0?C.redL:C.textDD;}

/* Every minimal coalition that clears the majority line: a group where every
   member is load-bearing, so dropping any one of them loses the majority. */
function coalitions(parties,majority){
  const pool=parties.filter(p=>p.seats>0).slice(0,9);
  const out=[];
  const n=pool.length;
  for(let mask=1;mask<(1<<n);mask++){
    const members=[];let sum=0;
    for(let i=0;i<n;i++)if(mask&(1<<i)){members.push(pool[i]);sum+=pool[i].seats;}
    if(sum<majority)continue;
    if(members.some(m=>sum-m.seats>=majority))continue;   // not minimal
    out.push({key:members.map(m=>m.id).join("+"),members,seats:sum,over:sum-majority});
  }
  out.sort((a,b)=>a.members.length-b.members.length||b.seats-a.seats);
  return out;
}

/* Seats laid out as a hemicycle of dots. */
function hemicycle(n,rInner,rOuter){
  if(n<=0)return{pts:[],seatR:5};
  const rows=Math.max(3,Math.min(16,Math.round(Math.sqrt(n)*0.55)));
  const radii=[];for(let i=0;i<rows;i++)radii.push(rows===1?(rInner+rOuter)/2:rInner+(rOuter-rInner)*i/(rows-1));
  const sum=radii.reduce((a,b)=>a+b,0);
  const counts=radii.map(r=>Math.max(1,Math.floor(n*r/sum)));
  let used=counts.reduce((a,b)=>a+b,0),i=rows-1;
  while(used<n){counts[i]++;used++;i=(i-1+rows)%rows;}
  while(used>n){if(counts[i]>1){counts[i]--;used--;}i=(i-1+rows)%rows;}
  const rowSpacing=(rOuter-rInner)/Math.max(1,rows-1);
  let minArc=Infinity;for(let k=0;k<rows;k++){const a=Math.PI*radii[k]/counts[k];if(a<minArc)minArc=a;}
  const seatR=Math.max(2.4,0.42*Math.min(rowSpacing,minArc));
  const pts=[];
  for(let k=0;k<rows;k++){const m=counts[k],r=radii[k];for(let j=0;j<m;j++){pts.push({phi:Math.PI*(1-(j+0.5)/m),r});}}
  pts.sort((a,b)=>b.phi-a.phi||a.r-b.r);
  return{pts,seatR};
}

/* ── referendum tally ──────────────────────────────────────────────────────── */
function tallyReferendum(ref,ballots){
  const counts={};(ref.options||[]).forEach(o=>{counts[o.id]=0;});
  (ballots||[]).forEach(b=>{const pick=(b.refVotes||{})[ref.id];if(pick!=null&&counts[pick]!=null)counts[pick]++;});
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  const opts=(ref.options||[]).map(o=>({id:o.id,label:o.label,votes:counts[o.id]||0,
    pctv:total>0?(counts[o.id]||0)/total*100:0})).sort((a,b)=>b.votes-a.votes);
  const isBinary=(ref.options||[]).length===2;
  let verdict=null;
  if(isBinary){
    const aff=ref.options[0],neg=ref.options[1];
    const av=counts[aff.id]||0,nv=counts[neg.id]||0,dec=av+nv;
    let passed=false;
    if(dec>0){
      if(ref.threshold==="twothirds")      passed=av*3>=dec*2&&av>nv;
      else if(ref.threshold==="threefifths")passed=av*5>=dec*3&&av>nv;
      else                                  passed=av>nv;
    }
    const tied=av===nv&&dec>0;
    verdict={av,nv,dec,passed,tied,affLabel:aff.label,negLabel:neg.label,
      label:dec===0?"NO VOTES":tied?"TIED":passed?"CARRIED":"REJECTED",
      color:dec===0?C.textDD:tied?C.gold:passed?C.green:C.redL};
  }
  return{counts,total,opts,isBinary,verdict,winner:opts[0]&&opts[0].votes>0?opts[0]:null};
}

/* A number that rolls to its new value rather than jumping — the whole point of
   watching a count come in. */
function useCountUp(value,dur=700){
  const [disp,setDisp]=useState(value);
  const fromRef=useRef(value);
  useEffect(()=>{
    const from=fromRef.current,to=Number(value)||0;
    if(from===to)return;
    const start=performance.now();let raf;
    const tick=now=>{
      const t=Math.min(1,(now-start)/dur);
      setDisp(Math.round(from+(to-from)*(1-Math.pow(1-t,3))));
      if(t<1)raf=requestAnimationFrame(tick);else fromRef.current=to;
    };
    raf=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(raf);
  },[value,dur]);
  return disp;
}
function Clock(){
  const [t,setT]=useState(()=>new Date());
  useEffect(()=>{const id=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(id);},[]);
  const p=n=>String(n).padStart(2,"0");
  return <span className="mono" style={{fontSize:12.5,letterSpacing:"0.14em",color:C.textD}}>
    {p(t.getHours())+":"+p(t.getMinutes())+":"+p(t.getSeconds())}</span>;
}
/* Counts down to a deadline the Registrar set — the thing that makes an open
   nomination window or an open poll feel like it is actually running out. */
function Countdown({to,label}){
  const [,tick]=useState(0);
  useEffect(()=>{const id=setInterval(()=>tick(x=>x+1),1000);return()=>clearInterval(id);},[]);
  if(!to)return null;
  const ms=new Date(to).getTime()-Date.now();
  if(isNaN(ms))return null;
  if(ms<=0)return <span className="mono" style={{fontSize:10.5,color:C.redL,letterSpacing:"0.12em"}}>{label} · ELAPSED</span>;
  const d=Math.floor(ms/86400000),h=Math.floor(ms/3600000)%24,m=Math.floor(ms/60000)%60,s=Math.floor(ms/1000)%60;
  const p=n=>String(n).padStart(2,"0");
  return <span className="mono" style={{fontSize:10.5,color:C.gold,letterSpacing:"0.12em"}}>
    {label} · {d>0?d+"d ":""}{p(h)}:{p(m)}:{p(s)}</span>;
}

/* ══════════════════════════════════════════════════════════════════════════════
   THE RESULTS ENGINE
   ──────────────────────────────────────────────────────────────────────────────
   Candidates are never stored twice. The ballot paper IS the set of approved
   nominations, derived live, so approving or striking a candidacy changes the
   ballot with no second write to keep in step. A certified election freezes its
   own snapshot into el.result and the archive reads that instead.
   ══════════════════════════════════════════════════════════════════════════════ */

/* The party a nomination actually stands under, once the Registrar has ruled:
   the party assigned by the Registrar wins; then an approved new party; then the
   existing party chosen at nomination; failing all of that, Independent. */
function standsUnder(reg){
  if(!reg)return INDEPENDENT_ID;
  if(reg.assignedParty)return reg.assignedParty;
  if(reg.partyMode==="new")return reg.partyStatus==="approved"&&reg.newPartyId?reg.newPartyId:INDEPENDENT_ID;
  if(reg.partyMode==="existing"&&reg.partyId)return reg.partyId;
  return INDEPENDENT_ID;
}

function useElectionResults(el,ballots,regs,partyMap,sittingMembers){
  return useMemo(()=>{
    const seatsTotal=Number(el&&el.seatsTotal)||SEATS_DEFAULT;
    const majority=Math.floor(seatsTotal/2)+1;
    const getParty=id=>partyMap[id]||partyMap[INDEPENDENT_ID]||
      {id:id||INDEPENDENT_ID,name:"Independent",abbr:"IND",color:"#888888"};

    /* ── the ballot paper ── */
    const approved=(regs||[]).filter(r=>r.status==="approved");
    const cands=approved.map(r=>{
      const pid=standsUnder(r);
      const p=getParty(pid);
      return {id:r.id,name:r.ballotName||r.displayName||r.username,username:r.username,
        blurb:r.blurb||"",partyId:pid,party:p};
    }).sort((a,b)=>a.name.localeCompare(b.name));

    /* ── the count ── */
    const tally={};cands.forEach(c=>{tally[c.id]=0;});
    let spoilt=0;
    (ballots||[]).forEach(b=>{
      Object.entries(b.votes||{}).forEach(([cid,n])=>{
        if(tally[cid]!=null)tally[cid]+=Number(n)||0; else spoilt+=Number(n)||0;
      });
    });
    const totalVotes=Object.values(tally).reduce((a,b)=>a+b,0);
    const seatMap=allocateSeats(tally,seatsTotal);

    /* ── where the chamber stands today: the drift baseline ── */
    const sittingByParty={},sittingByUser={};
    Object.values(sittingMembers||{}).forEach(m=>{
      const s=Number(m.seats)||0;
      sittingByParty[m.party||INDEPENDENT_ID]=(sittingByParty[m.party||INDEPENDENT_ID]||0)+s;
      const u=String(m.username||m.name||"").toLowerCase();
      if(u)sittingByUser[u]=(sittingByUser[u]||0)+s;
    });

    /* ── candidate rows ── */
    const candRows=cands.map(c=>{
      const votes=tally[c.id]||0,seats=seatMap[c.id]||0;
      const before=sittingByUser[String(c.username||"").toLowerCase()]||0;
      return{...c,votes,seats,before,change:seats-before,
        incumbent:sittingByUser[String(c.username||"").toLowerCase()]!=null,
        share:pct(votes,totalVotes)};
    }).sort((a,b)=>b.votes-a.votes||b.seats-a.seats||a.name.localeCompare(b.name));

    /* ── party rows: seats are the sum of a party's candidates' ── */
    const pAgg={};
    candRows.forEach(r=>{
      const p=pAgg[r.partyId]||(pAgg[r.partyId]={...r.party,id:r.partyId,votes:0,seats:0,candidates:0,standing:[]});
      p.votes+=r.votes;p.seats+=r.seats;p.candidates++;p.standing.push(r);
    });
    /* A party that sits in the chamber but is not contesting still belongs on the
       drift table — losing every seat is the most newsworthy drift there is. */
    Object.keys(sittingByParty).forEach(pid=>{
      if(!pAgg[pid]&&sittingByParty[pid]>0){
        const p=getParty(pid);
        pAgg[pid]={...p,id:pid,votes:0,seats:0,candidates:0,standing:[]};
      }
    });
    const partyRows=Object.values(pAgg).map(p=>{
      const before=sittingByParty[p.id]||0;
      return{...p,before,change:p.seats-before,share:pct(p.votes,totalVotes)};
    }).sort((a,b)=>b.seats-a.seats||b.votes-a.votes||(a.name||"").localeCompare(b.name||""));

    const contesting=partyRows.filter(p=>p.candidates>0);
    const leader=partyRows.find(p=>p.seats>0)||null;
    const runnerUp=partyRows.filter(p=>p.seats>0)[1]||null;
    const hasMajority=!!(leader&&leader.seats>=majority);
    const coals=totalVotes>0?coalitions(partyRows.filter(p=>p.seats>0),majority):[];

    /* biggest movers, for the drift ribbon */
    const movers=partyRows.filter(p=>p.change!==0).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change));

    return{seatsTotal,majority,cands,candRows,partyRows,contesting,leader,runnerUp,hasMajority,
      coalitions:coals,movers,totalVotes,spoilt,
      ballotCount:(ballots||[]).length,tally,seatMap,getParty,sittingByParty};
  },[el,ballots,regs,partyMap,sittingMembers]);
}

/* Who is on the register for this election, and who has already voted. */
function useElectorate(citizens,el,ballots){
  return useMemo(()=>{
    const allow=new Set((el&&el.eligibility&&el.eligibility.length?el.eligibility:DEFAULT_ELIGIBILITY));
    const roll=(citizens||[]).filter(c=>allow.has(c.status||"citizen"));
    const voted=new Set((ballots||[]).map(b=>b.citizenId));
    return{roll,size:roll.length,voted,
      turnout:roll.length>0?pct((ballots||[]).length,roll.length):0,
      label:[...allow].map(s=>CITIZEN_STATUSES[s]||s).join(" · ")};
  },[citizens,el,ballots]);
}

/* ══════════════════════════════════════════════════════════════════════════════
   THE LIVE BOARD
   ──────────────────────────────────────────────────────────────────────────────
   Grouped into five reads, each a self-contained panel: the call, the chamber,
   the drift, the coalitions, the races. Nothing is a wall of text.
   ══════════════════════════════════════════════════════════════════════════════ */

/* The decision desk's call on the contest as it stands. */
function callFor(el,R,refs,ballots){
  const st=el.status,final=isFinal(st);
  const refOnly=R.candRows.length===0&&refs.length>0;
  if(refOnly){
    const r0=refs[0],t0=tallyReferendum(r0,ballots),v0=t0.verdict;
    const thr=(REF_THRESHOLDS[r0.threshold]||REF_THRESHOLDS.simple).short;
    const more=refs.length>1?" (+"+(refs.length-1)+" more)":"";
    if(!hasCount(st))return{k:"NOT YET OPEN",t:"The referendum has not opened",sub:r0.question+more,c:C.textD};
    if(t0.total===0)return{k:(final?"CERTIFIED · ":"")+"REFERENDUM · "+thr,t:"Awaiting the first ballots",sub:r0.question+more,c:C.gold};
    if(t0.isBinary&&v0)return{k:(final?"CERTIFIED RESULT · ":"REFERENDUM · LIVE · ")+thr,
      t:v0.tied?"Tied — too close to call":v0.passed?"The motion is carried":(final?"The motion is rejected":"Trailing — not yet carried"),
      sub:r0.question+more,c:v0.color,win:v0.passed};
    return{k:(final?"CERTIFIED · ":"REFERENDUM · LIVE")+"",t:t0.winner?"Leading: "+t0.winner.label:"Counting",sub:r0.question+more,c:C.gold};
  }
  if(!hasCount(st)){
    if(st==="registration")return{k:"NOMINATIONS OPEN",t:"The ballot paper is being drawn up",
      sub:"Candidates are filing their papers. The poll has not yet opened.",c:C.gold};
    if(st==="reg_closed")return{k:"BALLOT PAPER SETTLED",t:R.cands.length+" candidate"+(R.cands.length===1?"":"s")+" stand",
      sub:"Nominations are closed. The poll opens at the Registrar's word.",c:C.amber};
    return{k:"NOT YET OPEN",t:"This contest has not been called",sub:"Results appear here the moment the poll opens.",c:C.textD};
  }
  const L=R.leader;
  if(R.totalVotes===0)return{k:final?"CERTIFIED RESULT":"POLL OPEN",t:"Awaiting the first ballots",
    sub:"The register is open — "+R.cands.length+" candidates stand.",c:C.gold};
  if(final){
    if(R.hasMajority)return{k:"CERTIFIED · OVERALL MAJORITY",t:L.name,
      sub:L.abbr+" takes "+L.seats.toLocaleString()+" of "+R.seatsTotal.toLocaleString()+" seats",c:C.green,win:true};
    return{k:"CERTIFIED · NO OVERALL MAJORITY",t:L.name+" — largest party",
      sub:"A hung house: "+(R.majority-L.seats).toLocaleString()+" short of a majority",c:C.gold,win:true};
  }
  if(R.hasMajority)return{k:"PROJECTED MAJORITY",t:L.name,
    sub:L.abbr+" crosses the "+R.majority.toLocaleString()+"-seat line",c:C.green,win:true};
  const gap=R.runnerUp?L.votes-R.runnerUp.votes:0;
  return{k:"TOO CLOSE TO CALL",t:L.name+" leads the count",
    sub:R.runnerUp?("ahead of "+R.runnerUp.abbr+" by "+gap.toLocaleString()+" vote"+(gap===1?"":"s")+" — no majority yet"):"first returns in",
    c:C.gold};
}

function CallCard({call,R,el}){

  return(

          boxShadow:`0 0 14px ${call.c}`,animation:isLive(el.status)?"iec-glow 1.6s infinite":"none"}}/>

/* The chamber itself. */
function Hemicycle({R}){
  const W=560,rOuter=246,rInner=104,cx=W/2,cy=rOuter+18,H=cy+8;
  const geo=useMemo(()=>{
    const seatMap={};R.partyRows.forEach(p=>{if(p.seats>0)seatMap[p.id]=p.seats;});
    const tot=Object.values(seatMap).reduce((a,b)=>a+b,0);
    if(tot===0)return null;
    const DOTS=R.seatsTotal<=300?R.seatsTotal:300;
    const alloc=allocateSeats(seatMap,DOTS);
    const seq=[];
    R.partyRows.forEach(p=>{for(let i=0;i<(alloc[p.id]||0);i++)seq.push(p.color);});
    const {pts,seatR}=hemicycle(seq.length,rInner,rOuter);
    return{pts,seatR,seq};
  },[R.partyRows,R.seatsTotal]);
  const lead=useCountUp(R.leader?R.leader.seats:0);
  if(!geo)return <Empty tall>Seats are apportioned as the ballots are counted.</Empty>;
  return(
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}} role="img"
      aria-label={"Seat projection over "+R.seatsTotal+" seats"}>
      {geo.pts.map((p,i)=>(
        <circle key={i} cx={cx+p.r*Math.cos(p.phi)} cy={cy-p.r*Math.sin(p.phi)} r={geo.seatR}
          fill={geo.seq[i]} stroke={C.bg} strokeWidth={geo.seatR>4?0.9:0.4}/>
      ))}
      <line x1={cx} y1={cy-rInner+14} x2={cx} y2={cy-rOuter-6} stroke={C.gold} strokeWidth="1.6"
        strokeDasharray="4 6" opacity="0.8"/>
      <text x={cx} y={12} textAnchor="middle"
        style={{fontFamily:"'Space Mono',monospace",fontSize:10,letterSpacing:"2px",fill:C.gold}}>
        MAJORITY {R.majority.toLocaleString()}</text>
      <text x={cx} y={cy-26} textAnchor="middle"
        style={{fontFamily:"'Cinzel',serif",fontWeight:900,fontSize:38,fill:R.leader?R.leader.color:C.text}}>
        {lead.toLocaleString()}</text>
      <text x={cx} y={cy-8} textAnchor="middle"
        style={{fontFamily:"'Space Mono',monospace",fontSize:10,letterSpacing:"2px",fill:C.textDD}}>
        {R.leader?R.leader.abbr:"—"}</text>
    </svg>
  );
}

/* The battle bar: every party's share of the house against the majority line. */
function HouseBar({R}){
  return(
    <div>
      <div style={{position:"relative",height:26,borderRadius:2,overflow:"hidden",
        background:C.s3,border:`1px solid ${C.border}`,display:"flex"}}>
        {R.partyRows.filter(p=>p.seats>0).map(p=>(
          <div key={p.id} title={`${p.name} — ${p.seats.toLocaleString()} seats`}
            style={{width:pct(p.seats,R.seatsTotal)+"%",
              background:`linear-gradient(180deg,${p.color},${p.color}bb)`,
              transition:"width .8s cubic-bezier(.2,.7,.2,1)",borderRight:`1px solid ${C.bg}66`}}/>
        ))}
        <div style={{position:"absolute",left:"50%",top:-2,bottom:-2,width:2,background:C.gold,
          boxShadow:`0 0 8px ${C.gold}`}}/>
      </div>
      <div className="mono" style={{fontSize:10,color:C.textDD,marginTop:6,letterSpacing:"0.06em"}}>
        {R.leader
          ?<span style={{color:R.hasMajority?C.greenL:C.textD}}>
             {R.leader.abbr} {R.leader.seats.toLocaleString()} / {R.majority.toLocaleString()}
             {R.hasMajority?"  ✓ majority secured":"  — "+(R.majority-R.leader.seats).toLocaleString()+" short"}
           </span>
          :"Awaiting returns"}
      </div>
    </div>
  );
}

/* Projected seat drift — the ▲▼ table, against the chamber as it sits today. */
function DriftTable({R,baselineNote}){
  const rows=R.partyRows.filter(p=>p.seats>0||p.before>0||p.candidates>0);
  if(rows.length===0)return <Empty>No party has yet returned a vote.</Empty>;
  const maxSeats=Math.max(1,...rows.map(p=>Math.max(p.seats,p.before)));
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 62px 62px 62px",gap:8,padding:"0 2px 6px",
        borderBottom:`1px solid ${C.border}`}}>
        {["Party","Now","Proj.","Drift"].map((h,i)=>(
          <span key={h} className="mono" style={{fontSize:8.5,letterSpacing:"0.16em",color:C.textDD,
            textTransform:"uppercase",textAlign:i===0?"left":"right"}}>{h}</span>
        ))}
      </div>
      <div style={{display:"flex",flexDirection:"column"}}>
        {rows.map(p=>(
          <div key={p.id} style={{display:"grid",gridTemplateColumns:"1fr 62px 62px 62px",gap:8,
            alignItems:"center",padding:"9px 2px",borderBottom:`1px solid ${C.border}55`}}>
            <div style={{minWidth:0}}>
              <div style={{display:"flex",alignItems:"baseline",gap:7,flexWrap:"wrap"}}>
                <span style={{width:9,height:9,borderRadius:1,background:p.color,flexShrink:0,
                  boxShadow:`0 0 7px ${p.color}77`}}/>
                <span className="cz" style={{fontWeight:600,fontSize:13.5,color:C.text}}>{p.name}</span>
                <span className="mono" style={{fontSize:9,color:p.color}}>{p.abbr}</span>
                {p.candidates===0&&p.before>0&&
                  <span className="mono" style={{fontSize:8.5,color:C.redL,letterSpacing:"0.1em"}}>NOT CONTESTING</span>}
              </div>
              {/* the two bars: where they sit now (faint) against where they land (solid) */}
              <div style={{position:"relative",height:9,marginTop:5,borderRadius:1,background:C.s3,overflow:"hidden"}}>
                <div style={{position:"absolute",left:0,top:0,bottom:0,width:pct(p.before,maxSeats)+"%",
                  background:p.color+"33",borderRight:`1px solid ${p.color}88`}}/>
                <div style={{position:"absolute",left:0,top:2,bottom:2,width:pct(p.seats,maxSeats)+"%",
                  background:p.color,transition:"width .8s cubic-bezier(.2,.7,.2,1)"}}/>
              </div>
              <div className="mono" style={{fontSize:9,color:C.textDD,marginTop:3}}>
                {p.votes.toLocaleString()} vote{p.votes===1?"":"s"} · {p.share.toFixed(1)}%
                {p.candidates>0?" · "+p.candidates+" standing":""}
              </div>
            </div>
            <span className="mono" style={{fontSize:12,color:C.textDD,textAlign:"right"}}>{p.before.toLocaleString()}</span>
            <span className="cz" style={{fontSize:16,fontWeight:700,color:p.color,textAlign:"right"}}>{p.seats.toLocaleString()}</span>
            <span className="mono" style={{fontSize:11.5,fontWeight:700,color:driftColor(p.change),textAlign:"right"}}>
              {p.change===0?"—":(p.change>0?"▲":"▼")+" "+Math.abs(p.change).toLocaleString()}</span>
          </div>
        ))}
      </div>
      <div style={{fontSize:11.5,color:C.textDD,fontStyle:"italic",marginTop:8,lineHeight:1.5}}>
        {baselineNote||"“Now” is the chamber as it sits today. “Proj.” is where this count would leave it."}
      </div>
    </div>
  );
}

/* Which governments the arithmetic actually allows. */
function CoalitionProjector({R}){
  if(R.totalVotes===0)return <Empty>Possible governments appear once the first ballots are counted.</Empty>;
  if(R.hasMajority){
    const L=R.leader;
    return(
      <div style={{border:`1px solid ${C.green}55`,borderLeft:`4px solid ${C.green}`,borderRadius:2,
        padding:"0.9rem 1.1rem",background:C.green+"10"}}>
        <div className="mono" style={{fontSize:9,letterSpacing:"0.2em",color:C.greenL}}>SINGLE-PARTY GOVERNMENT</div>
        <div className="cz" style={{fontWeight:700,fontSize:17,color:C.text,marginTop:4}}>{L.name} governs alone</div>
        <div style={{fontSize:13,color:C.textD,marginTop:4,fontStyle:"italic"}}>
          {L.seats.toLocaleString()} seats — {(L.seats-R.majority).toLocaleString()} above the majority line. No partner is needed.
        </div>
      </div>
    );
  }
  const list=R.coalitions.slice(0,5);
  if(list.length===0)return <Empty>No combination of the parties returned so far reaches a majority.</Empty>;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {list.map((co,i)=>(
        <div key={co.key} style={{border:`1px solid ${i===0?C.gold+"66":C.border}`,borderRadius:2,
          padding:"0.75rem 0.95rem",background:i===0?C.gold+"0d":C.s2,
          borderLeft:`4px solid ${i===0?C.gold:C.border}`}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:10,flexWrap:"wrap",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",flex:1,minWidth:180}}>
              {co.members.map((m,j)=>(
                <React.Fragment key={m.id}>
                  {j>0&&<span style={{color:C.textDD,fontSize:13}}>+</span>}
                  <span className="mono" style={{fontSize:10,padding:"2px 8px",borderRadius:2,
                    background:m.color+"22",color:m.color,border:`1px solid ${m.color}55`}}>{m.abbr}</span>
                </React.Fragment>
              ))}
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <span className="cz" style={{fontWeight:700,fontSize:17,color:i===0?C.gold:C.text}}>{co.seats.toLocaleString()}</span>
              <span className="mono" style={{fontSize:9.5,color:C.textDD,marginLeft:6}}>+{co.over.toLocaleString()} over</span>
            </div>
          </div>
          {/* how the seats divide within the coalition */}
          <div style={{display:"flex",height:6,marginTop:8,borderRadius:1,overflow:"hidden",background:C.s3}}>
            {co.members.map(m=>(
              <div key={m.id} style={{width:pct(m.seats,co.seats)+"%",background:m.color}}/>
            ))}
          </div>
          <div style={{fontSize:11.5,color:C.textDD,marginTop:6,fontStyle:"italic"}}>
            {i===0?"Most likely — ":""}{co.members.length===1?"governs alone":co.members.length+" parties"}
            {co.members.length>1?" · led by "+co.members[0].name:""}
          </div>
        </div>
      ))}
      <div style={{fontSize:11.5,color:C.textDD,fontStyle:"italic"}}>
        Only workable coalitions are shown: in each, every partner is load-bearing — drop any one and the majority is gone.
      </div>
    </div>
  );
}

/* The individual races — who personally gains and who personally loses. */
function CandidateRaces({R}){
  const [all,setAll]=useState(false);
  if(R.candRows.length===0)return <Empty>No candidate stands in this contest.</Empty>;
  const rows=all?R.candRows:R.candRows.slice(0,10);
  const top=R.candRows[0]&&R.candRows[0].votes>0?R.candRows[0]:null;
  return(
    <div>
      <div style={{display:"flex",flexDirection:"column",gap:3}}>
        {rows.map((c,i)=>{
          const lead=top&&c.id===top.id;
          return(
            <div key={c.id} style={{display:"grid",gridTemplateColumns:"26px 1fr 74px",gap:10,
              alignItems:"center",padding:"8px 10px",borderRadius:2,
              background:lead?c.party.color+"12":"transparent",
              border:`1px solid ${lead?c.party.color+"44":"transparent"}`}}>
              <span className="cz" style={{fontWeight:700,fontSize:15,textAlign:"center",
                color:i===0?c.party.color:C.textDD}}>{i+1}</span>
              <div style={{minWidth:0}}>
                <div style={{display:"flex",alignItems:"baseline",gap:7,flexWrap:"wrap"}}>
                  <span className="cz" style={{fontWeight:600,fontSize:14.5,color:C.text}}>{c.name}</span>
                  <span className="mono" style={{fontSize:9,padding:"1px 6px",borderRadius:2,
                    background:c.party.color+"22",color:c.party.color,border:`1px solid ${c.party.color}44`}}>{c.party.abbr}</span>
                  {c.incumbent
                    ?<span className="mono" style={{fontSize:8.5,color:C.textDD,letterSpacing:"0.1em"}}>SITTING · {c.before.toLocaleString()}</span>
                    :<span className="mono" style={{fontSize:8.5,color:C.blue,letterSpacing:"0.1em"}}>NEW</span>}
                  <span className="mono" style={{fontSize:10,color:C.textDD}}>
                    {c.votes.toLocaleString()} v · {c.share.toFixed(1)}%</span>
                </div>
                {c.blurb&&<div style={{fontSize:12,color:C.textDD,fontStyle:"italic",marginTop:2,
                  overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.blurb}</div>}
                <div style={{position:"relative",height:6,marginTop:5,borderRadius:1,background:C.s3,overflow:"hidden"}}>
                  <div style={{position:"absolute",inset:0,width:c.share+"%",
                    background:`linear-gradient(90deg,${c.party.color}99,${c.party.color})`,
                    transition:"width .8s cubic-bezier(.2,.7,.2,1)"}}/>
                </div>
              </div>
              <div style={{textAlign:"right"}}>
                <div className="cz" style={{fontWeight:800,fontSize:19,color:c.party.color,lineHeight:1}}>{c.seats.toLocaleString()}</div>
                <div className="mono" style={{fontSize:9.5,fontWeight:700,color:driftColor(c.change),marginTop:2}}>
                  {c.change===0?"—":(c.change>0?"▲":"▼")+" "+Math.abs(c.change).toLocaleString()}</div>
              </div>
            </div>
          );
        })}
      </div>
      {R.candRows.length>10&&
        <div style={{marginTop:9,textAlign:"center"}}>
          <Btn small onClick={()=>setAll(a=>!a)}>{all?"Show top ten":"Show all "+R.candRows.length+" candidates"}</Btn>
        </div>}
    </div>
  );
}

/* ── referendum board ──────────────────────────────────────────────────────── */
function RefRow({r,idx,multi,t}){
  const thr=REF_THRESHOLDS[r.threshold]||REF_THRESHOLDS.simple;
  const binary=(r.options||[]).length===2;
  const palette=[C.gold,C.blue,C.green,"#8a5cc4","#3a7a8a",C.amber];
  const colorOf=oi=>binary?(oi===0?C.green:C.redL):palette[oi%palette.length];
  const rows=(r.options||[]).map((o,oi)=>({...o,oi,votes:t.counts[o.id]||0,
    pctv:t.total>0?((t.counts[o.id]||0)/t.total*100):0}));
  const ordered=binary?rows:rows.slice().sort((a,b)=>b.votes-a.votes);
  const v=t.verdict;
  const badge=binary?{label:v.label,color:v.color}
    :(t.winner?{label:"LEADING · "+t.winner.label,color:C.gold}:{label:"NO VOTES",color:C.textDD});
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",gap:12,flexWrap:"wrap",
        alignItems:"baseline",marginBottom:9}}>
        <div style={{flex:1,minWidth:200}}>
          <div className="mono" style={{fontSize:8.5,letterSpacing:"0.18em",color:C.gold,textTransform:"uppercase"}}>
            Referendum{multi?" "+(idx+1):""} · {thr.short}</div>
          <div className="cz" style={{fontWeight:700,fontSize:"clamp(0.98rem,2.2vw,1.25rem)",color:C.text,
            lineHeight:1.25,marginTop:3}}>{r.question}</div>
          {r.description&&<div style={{fontSize:12.5,color:C.textDD,fontStyle:"italic",marginTop:3,lineHeight:1.5}}>{r.description}</div>}
        </div>
        <span className="cz" style={{flexShrink:0,fontWeight:700,fontSize:11,letterSpacing:"0.16em",
          color:badge.color,border:`1px solid ${badge.color}66`,background:badge.color+"14",
          borderRadius:2,padding:"5px 11px",alignSelf:"center"}}>{badge.label}</span>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:9}}>
        {ordered.map(o=>{
          const c=colorOf(o.oi);
          const win=binary?(v&&v.passed&&o.oi===0):(t.winner&&t.winner.id===o.id);
          return(
            <div key={o.id}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:12,marginBottom:4}}>
                <span className="cz" style={{fontWeight:win?700:500,fontSize:14,color:win?c:C.text,lineHeight:1.35}}>
                  {win?"✓ ":""}{o.label}</span>
                <span className="mono" style={{fontSize:10.5,color:win?c:C.textDD,whiteSpace:"nowrap",flexShrink:0}}>
                  <b style={{fontSize:12.5}}>{o.pctv.toFixed(1)}%</b> · {o.votes.toLocaleString()}</span>
              </div>
              <div style={{height:12,borderRadius:1,background:C.s3,overflow:"hidden",border:`1px solid ${C.border}`}}>
                <div style={{width:o.pctv+"%",height:"100%",background:`linear-gradient(90deg,${c},${c}bb)`,
                  transition:"width .7s cubic-bezier(.2,.7,.2,1)",boxShadow:win?`0 0 10px ${c}55`:"none"}}/>
              </div>
            </div>
          );
        })}
      </div>
      <div className="mono" style={{fontSize:9.5,color:C.textDD,marginTop:7}}>
        {t.total.toLocaleString()} vote{t.total===1?"":"s"} cast{binary&&v&&v.dec>0?" · needs "+thr.need+" to carry":""}
      </div>
    </div>
  );
}
function ReferendumBoard({referendums,ballots}){
  if(!referendums||!referendums.length)return null;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:"1.5rem"}}>
      {referendums.map((r,i)=>
        <RefRow key={r.id} r={r} idx={i} multi={referendums.length>1} t={tallyReferendum(r,ballots)}/>)}
    </div>
  );
}

/* The crawl along the foot of the board. */
function Ticker({R,el,refs,ballots,electorate}){
  const parts=[];
  R.partyRows.filter(p=>p.seats>0||p.before>0).forEach(p=>{
    parts.push(p.abbr+"  "+p.seats.toLocaleString()+" SEATS  "+
      (p.change===0?"NO CHANGE":(p.change>0?"▲":"▼")+Math.abs(p.change).toLocaleString()));
  });
  refs.forEach((r,i)=>{
    const t=tallyReferendum(r,ballots),v=t.verdict;
    parts.push("REFERENDUM"+(refs.length>1?" "+(i+1):"")+"  "+
      (t.isBinary&&v?v.label+" "+v.av+"–"+v.nv:(t.winner?t.winner.label.toUpperCase():"NO VOTES")));
  });
  parts.push("BALLOTS CAST  "+R.ballotCount.toLocaleString());
  parts.push("TURNOUT  "+electorate.turnout.toFixed(1)+"%");
  parts.push("ON THE REGISTER  "+electorate.size.toLocaleString());
  parts.push("HOUSE "+R.seatsTotal.toLocaleString()+" · MAJORITY "+R.majority.toLocaleString());
  const line=parts.join("        ⚜        ")+"        ⚜        ";
  const final=isFinal(el.status);
  return(
    <div style={{position:"sticky",bottom:0,zIndex:6,display:"flex",alignItems:"stretch",
      borderTop:`1px solid ${C.border}`,background:C.bg+"f2",backdropFilter:"blur(6px)"}}>
      <div style={{flexShrink:0,display:"flex",alignItems:"center",gap:7,padding:"0 14px",
        background:final?C.goldD:C.redD}}>
        <span style={{width:7,height:7,borderRadius:"50%",background:"#fff",
          animation:isLive(el.status)?"iec-live 1.4s infinite":"none"}}/>
        <span className="cz" style={{fontWeight:700,fontSize:9.5,letterSpacing:"0.2em",color:"#fff"}}>
          {final?"FINAL":isLive(el.status)?"LIVE":"COUNT"}</span>
      </div>
      <div style={{overflow:"hidden",flex:1}}>
        <div style={{display:"inline-flex",whiteSpace:"nowrap",animation:"iec-crawl 42s linear infinite",padding:"7px 0"}}>
          <span className="mono" style={{fontSize:11,letterSpacing:"0.1em",color:C.textD}}>{line}</span>
          <span className="mono" style={{fontSize:11,letterSpacing:"0.1em",color:C.textD}}>{line}</span>
        </div>
      </div>
    </div>
  );
}

/* ── the pipeline, drawn for the public ────────────────────────────────────── */
function Pipeline({status,compact}){
  const cur=stageIdx(status);
  return(
    <div style={{display:"flex",alignItems:"stretch",gap:compact?3:5,flexWrap:"wrap"}}>
      {STAGES.map((s,i)=>{
        const done=i<cur,now=i===cur;
        const col=now?s.color:done?C.goldD:C.textDD;
        return(
          <div key={s.id} style={{flex:"1 1 110px",minWidth:96,borderTop:`2px solid ${now?s.color:done?C.goldD:C.border}`,
            paddingTop:6,opacity:done||now?1:0.45}}>
            <div className="mono" style={{fontSize:8,letterSpacing:"0.14em",color:col}}>
              {done?"✓":now?"▸":String(i+1).padStart(2,"0")}</div>
            <div className="cz" style={{fontSize:compact?9.5:10.5,letterSpacing:"0.1em",color:now?C.text:col,
              fontWeight:now?700:500,textTransform:"uppercase",marginTop:3,lineHeight:1.3}}>{s.label}</div>
          </div>
        );
      })}
    </div>
  );
}

/* ── the board ─────────────────────────────────────────────────────────────── */
function BoardView({el,elList,onSwitch,ballots,regs,partyMap,sitting,citizens,me,onGoVote,onGoStand,frozen}){
  const R=useElectionResults(el,ballots,regs,partyMap,sitting);
  const electorate=useElectorate(citizens,el,ballots);
  const refs=(el&&el.referendums)||[];
  const call=useMemo(()=>callFor(el,R,refs,ballots),[el,R,refs,ballots]);
  const ballotsCU=useCountUp(R.ballotCount);
  const votesCU=useCountUp(R.totalVotes);
  const showCount=hasCount(el.status);
  const refOnly=R.candRows.length===0&&refs.length>0;
  const pending=(regs||[]).filter(r=>r.status==="pending").length;

  return(
    <div>
      {/* contest switcher */}
      {elList.length>1&&
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:"1.1rem"}}>
          {elList.map(e=>{
            const act=e.id===el.id;
            return(
              <button key={e.id} onClick={()=>onSwitch(e.id)} className="cz"
                style={{display:"inline-flex",alignItems:"center",gap:8,padding:"6px 12px",borderRadius:2,
                  cursor:"pointer",border:`1px solid ${act?C.gold+"77":C.border}`,
                  background:act?C.gold+"14":"transparent",color:act?C.text:C.textD,
                  fontSize:11,fontWeight:600,letterSpacing:"0.05em"}}>
                {e.name}<StagePill status={e.status} small/>
              </button>
            );
          })}
        </div>}

      {/* headline */}
      <div style={{textAlign:"center",margin:"0.4rem 0 1.1rem",animation:"iec-rise .45s ease both"}}>
        <div className="mono" style={{fontSize:9.5,letterSpacing:"0.28em",color:C.gold,textTransform:"uppercase"}}>
          {isFinal(el.status)?"Certified Result":"Official Count"}{el.date?" · "+fmtDate(el.date):""}
        </div>
        <h1 className="cz" style={{fontWeight:900,fontSize:"clamp(1.8rem,5.5vw,3.2rem)",color:C.text,
          lineHeight:1.05,marginTop:6,letterSpacing:"0.02em"}}>{el.name}</h1>
        {el.description&&<p style={{color:C.textD,maxWidth:600,margin:"0.6rem auto 0",fontStyle:"italic",
          lineHeight:1.6,fontSize:14.5}}>{el.description}</p>}
      </div>

      <CallCard call={call} R={R} el={el}/>

      {/* where the contest stands in its pipeline, plus the live deadline */}
      <section style={{...card,padding:"0.95rem 1.15rem",marginBottom:"1.1rem"}}>
        <div style={{display:"flex",justifyContent:"space-between",gap:12,flexWrap:"wrap",
          alignItems:"center",marginBottom:10}}>
          <span className="cz" style={{fontSize:10.5,letterSpacing:"0.2em",color:C.textD,textTransform:"uppercase",fontWeight:600}}>
            Stage of proceedings</span>
          <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
            {el.status==="registration"&&<Countdown to={el.regClosesAt} label="NOMINATIONS CLOSE IN"/>}
            {el.status==="voting"&&<Countdown to={el.voteClosesAt} label="POLL CLOSES IN"/>}
            {el.status==="reg_closed"&&<Countdown to={el.voteOpensAt} label="POLL OPENS IN"/>}
            <StagePill status={el.status}/>
          </div>
        </div>
        <Pipeline status={el.status}/>
        <div style={{fontSize:13,color:C.textD,fontStyle:"italic",marginTop:10,lineHeight:1.55}}>
          {stage(el.status).blurb}
          {el.status==="registration"&&pending>0?`  ${pending} nomination${pending===1?"":"s"} awaiting the Registrar.`:""}
        </div>
        {(el.status==="registration"||el.status==="voting")&&
          <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
            {el.status==="registration"&&
              <Btn variant="gold" onClick={onGoStand}>Stand for election →</Btn>}
            {el.status==="voting"&&
              <Btn variant="red" onClick={onGoVote}>Cast your ballot →</Btn>}
          </div>}
      </section>

      {/* ── the count ── */}
      {showCount?<>
        {!refOnly&&
          <div style={{display:"flex",flexWrap:"wrap",gap:"1rem",marginBottom:"1.1rem"}}>
            <section style={{...card,flex:"1 1 420px",minWidth:296,padding:"1rem 1.15rem"}}>
              <STitle>The Chamber — {R.seatsTotal.toLocaleString()} seats</STitle>
              <Hemicycle R={R}/>
              <div style={{display:"flex",flexWrap:"wrap",gap:"4px 14px",padding:"8px 0 10px"}}>
                {R.partyRows.filter(p=>p.seats>0).map(p=>(
                  <span key={p.id} style={{display:"inline-flex",alignItems:"center",gap:6}}>
                    <span style={{width:10,height:10,borderRadius:1,background:p.color,
                      boxShadow:`0 0 7px ${p.color}77`}}/>
                    <span className="mono" style={{fontSize:10.5,color:C.textDD}}>
                      {p.abbr} <b style={{color:p.color}}>{p.seats.toLocaleString()}</b></span>
                  </span>
                ))}
              </div>
              <HouseBar R={R}/>
            </section>
            <section style={{...card,flex:"1 1 400px",minWidth:296,padding:"1rem 1.15rem"}}>
              <STitle>Projected Seat Drift</STitle>
              <DriftTable R={R}/>
            </section>
          </div>}

        {!refOnly&&
          <div style={{display:"flex",flexWrap:"wrap",gap:"1rem",marginBottom:"1.1rem"}}>
            <section style={{...card,flex:"1 1 340px",minWidth:280,padding:"1rem 1.15rem"}}>
              <STitle>Possible Governments</STitle>
              <CoalitionProjector R={R}/>
            </section>
            <section style={{...card,flex:"1 1 460px",minWidth:296,padding:"1rem 1.15rem"}}>
              <STitle right={<span className="mono" style={{fontSize:9,color:C.textDD}}>
                {R.candRows.length} STANDING</span>}>Individual Returns</STitle>
              <CandidateRaces R={R}/>
            </section>
          </div>}

        {refs.length>0&&
          <section style={{...card,padding:"1rem 1.15rem",marginBottom:"1.1rem"}}>
            <STitle>{refs.length>1?"The Referendums":"The Referendum"}</STitle>
            <ReferendumBoard referendums={refs} ballots={ballots}/>
          </section>}

        <div style={{display:"flex",gap:"0.7rem",flexWrap:"wrap",marginBottom:"1.1rem"}}>
          <Chip k="Ballots cast" v={ballotsCU.toLocaleString()} color={C.gold}/>
          {!refOnly&&<Chip k="Votes counted" v={votesCU.toLocaleString()}/>}
          <Chip k="Turnout" v={electorate.turnout.toFixed(1)+"%"} color={C.greenL}/>
          <Chip k="On the register" v={electorate.size.toLocaleString()} sub={electorate.label}/>
          {!refOnly&&<Chip k="Majority" v={R.majority.toLocaleString()} sub={"of "+R.seatsTotal.toLocaleString()}/>}
        </div>

        <div className="mono" style={{textAlign:"center",fontSize:9.5,letterSpacing:"0.16em",
          color:C.textDD,marginBottom:"1.2rem"}}>
          {isLive(el.status)?"● LIVE COUNT — REFRESHES AUTOMATICALLY"
            :isFinal(el.status)?("CERTIFIED"+(el.result&&el.result.at?" · "+fmtWhen(el.result.at):""))
            :"THE POLL HAS CLOSED — AWAITING CERTIFICATION"}

            ?<Empty tall>{el.status==="registration"

            :<div style={{display:"flex",flexDirection:"column",gap:5}}>
              {R.cands.map(c=>(
                <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"0.6rem 0.8rem",
                  border:`1px solid ${C.border}`,borderLeft:`4px solid ${c.party.color}`,borderRadius:2,background:C.s2}}>
                  <div style={{flex:1,minWidth:0}}>
                    <span className="cz" style={{fontWeight:600,fontSize:14.5,color:C.text}}>{c.name}</span>
                    <span className="mono" style={{fontSize:9.5,marginLeft:8,color:c.party.color}}>{c.party.abbr}</span>
                    {c.blurb&&<div style={{fontSize:12.5,color:C.textDD,fontStyle:"italic",marginTop:2}}>{c.blurb}</div>}
                  </div>
                  <span className="cz" style={{fontSize:11,color:C.textDD,letterSpacing:"0.1em"}}>{c.party.name}</span>
                </div>
              ))}

        {refs.length>0&&
          <section style={{...card,padding:"1rem 1.15rem",marginBottom:"1.1rem"}}>
            <STitle>{refs.length>1?"Questions on the Ballot":"The Question on the Ballot"}</STitle>
            <div style={{display:"flex",flexDirection:"column",gap:"0.9rem"}}>
              {refs.map((r,i)=>{
                const thr=REF_THRESHOLDS[r.threshold]||REF_THRESHOLDS.simple;
                return(
                  <div key={r.id} style={{border:`1px solid ${C.border}`,borderLeft:`4px solid ${C.gold}`,
                    borderRadius:2,padding:"0.75rem 0.95rem",background:C.s2}}>
                    <div className="mono" style={{fontSize:8.5,letterSpacing:"0.18em",color:C.gold,textTransform:"uppercase"}}>
                      Referendum{refs.length>1?" "+(i+1):""} · {thr.short}</div>
                    <div className="cz" style={{fontWeight:700,fontSize:15.5,color:C.text,marginTop:3,lineHeight:1.3}}>{r.question}</div>
                    {r.description&&<div style={{fontSize:12.5,color:C.textDD,fontStyle:"italic",marginTop:4,lineHeight:1.5}}>{r.description}</div>}
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
                      {(r.options||[]).map(o=>(
                        <span key={o.id} className="mono" style={{fontSize:10,padding:"3px 9px",borderRadius:2,
                          border:`1px solid ${C.border}`,color:C.textD}}>{o.label}</span>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </section>}
        <div style={{display:"flex",gap:"0.7rem",flexWrap:"wrap",marginBottom:"1.1rem"}}>
          <Chip k="On the register" v={electorate.size.toLocaleString()} sub={electorate.label}/>
          <Chip k="Seats at stake" v={R.seatsTotal.toLocaleString()}/>
          <Chip k="Votes per elector" v={(el.votesPerVoter||VPV_DEFAULT)}/>
          <Chip k="Candidates" v={R.cands.length} color={C.gold}/>
        </div>
      </>}
    </div>
  );
}
