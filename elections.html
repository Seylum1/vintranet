function ReferendumManager({el,ballots,onUpsert,note}){
  const refs=el.referendums||[];
  const [draft,setDraft]=useState(null);
  const startNew=()=>setDraft(blankReferendum());
  const setD=(k,v)=>setDraft(d=>({...d,[k]:v}));
  const setOpt=(i,v)=>setDraft(d=>({...d,options:d.options.map((o,ix)=>ix===i?{...o,label:v}:o)}));
  const addOpt=()=>setDraft(d=>d.options.length>=8?d:{...d,options:[...d.options,{id:"opt_"+uid(),label:""}]});
  const rmOpt=i=>setDraft(d=>d.options.length<=2?d:{...d,options:d.options.filter((_,ix)=>ix!==i)});
  const commit=async()=>{
    const clean=draft.options.map(o=>({id:o.id,label:String(o.label||"").trim()})).filter(o=>o.label);
    if(!String(draft.question||"").trim()||clean.length<2){
      note("A question and at least two answers are required.",C.redL);return;}
    const rec={...draft,question:draft.question.trim(),description:(draft.description||"").trim(),options:clean};
    const exists=refs.some(r=>r.id===rec.id);
    await onUpsert({...el,referendums:exists?refs.map(r=>r.id===rec.id?rec:r):[...refs,rec]});
    setDraft(null);note(exists?"Question amended.":"Question added to the ballot.",C.green);
  };
  const remove=async id=>{await onUpsert({...el,referendums:refs.filter(r=>r.id!==id)});note("Question struck.",C.gold);};
  const locked=hasCount(el.status);

  return(
    <div>
      {refs.length>0&&
        <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:"0.9rem"}}>
          {refs.map(r=>{
            const t=tallyReferendum(r,ballots),v=t.verdict;
            const m=REF_THRESHOLDS[r.threshold]||REF_THRESHOLDS.simple;
            return(
              <div key={r.id} style={{border:`1px solid ${C.border}`,borderLeft:`4px solid ${C.gold}`,
                borderRadius:2,padding:"0.65rem 0.85rem",background:C.s2}}>
                <div style={{display:"flex",justifyContent:"space-between",gap:9,alignItems:"flex-start",flexWrap:"wrap"}}>
                  <div style={{flex:"1 1 220px",minWidth:0}}>
                    <span className="cz" style={{fontWeight:600,fontSize:14,color:C.text}}>{r.question}</span>
                    <div className="mono" style={{fontSize:9,color:C.textDD,marginTop:3}}>
                      {m.short} · {(r.options||[]).map(o=>o.label).join(" / ")}</div>
                  </div>
                  <div style={{display:"flex",gap:7,alignItems:"center",flexShrink:0}}>
                    <span className="mono" style={{fontSize:10,color:v?v.color:C.gold}}>
                      {v?v.label+" "+v.av+"–"+v.nv:(t.winner?t.winner.label:"—")}</span>
                    {!locked&&<Btn small onClick={()=>setDraft({...r,options:(r.options||[]).map(o=>({...o}))})}>Edit</Btn>}
                    {!locked&&<ArmBtn small label="Strike" confirmLabel="Strike?" onConfirm={()=>remove(r.id)}/>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>}

      {locked
        ?<div style={{fontSize:12.5,color:C.textDD,fontStyle:"italic"}}>
           The poll has opened — the questions on the ballot are now fixed.</div>
        :draft
        ?<div style={{border:`1px solid ${C.gold}44`,borderRadius:2,padding:"1rem",background:C.s2}}>
          <FL>The question *</FL>
          <Inp value={draft.question} onChange={v=>setD("question",v)}
            placeholder="e.g. Shall the Crown ratify the Treaty of Viridis?"/>
          <div style={{height:9}}/>
          <FL hint="optional, shown to voters beneath the question">Explanatory note</FL>
          <TA value={draft.description||""} onChange={v=>setD("description",v)} rows={2}
            placeholder="Plain-language explanation of what a vote either way would mean."/>
          <div style={{height:9}}/>
          <div style={{maxWidth:300}}>
            <FL>Threshold to carry</FL>
            <select value={draft.threshold} onChange={e=>setD("threshold",e.target.value)} style={inp}>
              {Object.entries(REF_THRESHOLDS).map(([k,m])=><option key={k} value={k}>{m.l}</option>)}
            </select>
          </div>
          <div style={{height:11}}/>
          <FL hint={draft.options.length===2?"the first answer is the affirmative — it is what must clear the threshold":"more than two answers: the plurality wins"}>
            Answers on the ballot</FL>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {draft.options.map((o,i)=>(
              <div key={o.id} style={{display:"flex",gap:7,alignItems:"center"}}>
                <span className="mono" style={{fontSize:10,color:C.textDD,width:16,flexShrink:0}}>{i+1}</span>
                <Inp value={o.label} onChange={v=>setOpt(i,v)} placeholder={"Answer "+(i+1)}/>
                <button onClick={()=>rmOpt(i)} disabled={draft.options.length<=2} className="mono"
                  style={{fontSize:11,color:draft.options.length<=2?C.textDD:C.redL,background:"transparent",
                    border:`1px solid ${C.border}`,borderRadius:2,padding:"7px 10px",flexShrink:0,
                    cursor:draft.options.length<=2?"not-allowed":"pointer"}}>✕</button>
              </div>
            ))}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:12,gap:8,flexWrap:"wrap"}}>
            <Btn onClick={addOpt} disabled={draft.options.length>=8}>+ Answer</Btn>
            <div style={{display:"flex",gap:7}}>
              <Btn onClick={()=>setDraft(null)}>Cancel</Btn>
              <Btn variant="gold" onClick={commit}>Save question</Btn>
            </div>
          </div>
        </div>
        :<Btn variant="gold" onClick={startNew}>+ Add a referendum question</Btn>}
    </div>
  );
}

/* One filed paper, with its two independent decisions. */
function NominationCard({reg,el,partyMap,partyList,onRule,note}){
  const [openCreed,setOpenCreed]=useState(false);
  const [assign,setAssign]=useState(reg.assignedParty||"");
  const [reason,setReason]=useState("");
  const [busy,setBusy]=useState(false);
  const isNew=reg.partyMode==="new";
  const np=reg.newParty||{};
  const stands=partyMap[standsUnder(reg)]||{name:"Independent",abbr:"IND",color:"#888888"};
  const col=s=>s==="approved"?C.green:s==="denied"?C.redL:C.gold;
  const lbl=s=>s==="approved"?"APPROVED":s==="denied"?"REFUSED":"PENDING";

  const rule=async patch=>{
    if(busy)return;setBusy(true);
    const r=await onRule(reg,patch);
    setBusy(false);
    if(!r.ok)note(r.error||"The ruling could not be recorded.",C.redL);
  };

  return(
    <div style={{...card,background:C.s2,borderLeft:`4px solid ${col(reg.status)}`,overflow:"hidden"}}>
      <div style={{padding:"0.9rem 1.05rem"}}>
        <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-start"}}>
          <div style={{flex:"1 1 220px",minWidth:0}}>
            <div className="cz" style={{fontWeight:700,fontSize:16,color:C.text}}>{reg.ballotName||reg.displayName}</div>
            <div className="mono" style={{fontSize:9.5,color:C.textDD,marginTop:3,letterSpacing:"0.06em"}}>
              @{reg.username} · FILED {fmtWhen(reg.filedAt)}</div>
            {reg.blurb&&<div style={{fontSize:13,color:C.textD,fontStyle:"italic",marginTop:5,lineHeight:1.5}}>“{reg.blurb}”</div>}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:5,alignItems:"flex-end",flexShrink:0}}>
            <span className="mono" style={{fontSize:9,letterSpacing:"0.16em",color:col(reg.status),
              border:`1px solid ${col(reg.status)}55`,background:col(reg.status)+"14",borderRadius:2,padding:"3px 9px"}}>
              CANDIDACY {lbl(reg.status)}</span>
            {isNew&&
              <span className="mono" style={{fontSize:9,letterSpacing:"0.16em",color:col(reg.partyStatus),
                border:`1px solid ${col(reg.partyStatus)}55`,background:col(reg.partyStatus)+"14",borderRadius:2,padding:"3px 9px"}}>
                PARTY {lbl(reg.partyStatus)}</span>}
          </div>
        </div>

        {/* what party this paper claims */}
        <div style={{display:"flex",gap:9,alignItems:"center",flexWrap:"wrap",marginTop:11,
          padding:"0.6rem 0.8rem",borderRadius:2,background:C.s1,border:`1px solid ${C.border}`}}>
          <span className="mono" style={{fontSize:8.5,letterSpacing:"0.16em",color:C.textDD}}>CLAIMS</span>
          {isNew
            ?<>
              <span style={{width:11,height:11,borderRadius:1,background:np.color||"#888"}}/>
              <span className="cz" style={{fontSize:13.5,color:C.text,fontWeight:600}}>{np.name||"(unnamed)"}</span>
              <span className="mono" style={{fontSize:9.5,color:np.color||C.textD}}>{np.abbr}</span>
              <span className="mono" style={{fontSize:8.5,letterSpacing:"0.14em",color:C.gold,
                border:`1px solid ${C.gold}44`,borderRadius:2,padding:"1px 7px"}}>NEW PARTY APPLICATION</span>
             </>
            :reg.partyMode==="existing"
            ?<>
              <span style={{width:11,height:11,borderRadius:1,background:(partyMap[reg.partyId]||{}).color||"#888"}}/>
              <span className="cz" style={{fontSize:13.5,color:C.text}}>{(partyMap[reg.partyId]||{}).name||reg.partyId}</span>
             </>
            :<span className="cz" style={{fontSize:13.5,color:C.textD}}>Independent</span>}
          <span style={{flex:1}}/>
          <span className="mono" style={{fontSize:8.5,letterSpacing:"0.14em",color:C.textDD}}>WILL STAND AS</span>
          <span className="cz" style={{fontSize:13,color:stands.color,fontWeight:600}}>{stands.name}</span>
        </div>

        {/* the party application in full */}
        {isNew&&
          <div style={{marginTop:10}}>
            <button onClick={()=>setOpenCreed(o=>!o)} className="cz"
              style={{width:"100%",display:"flex",alignItems:"center",gap:9,padding:"0.55rem 0.8rem",
                background:"transparent",border:`1px solid ${C.border}`,borderRadius:2,cursor:"pointer",
                color:C.textD,fontSize:11,letterSpacing:"0.14em",textTransform:"uppercase"}}>
              <span style={{flex:1,textAlign:"left"}}>The party's creed</span>
              <span className="mono" style={{fontSize:9,color:C.gold}}>
                {creedAnswered(np.answers)}/{CREED_COUNT} ANSWERED</span>
              <span style={{fontSize:11}}>{openCreed?"▾":"▸"}</span>
            </button>
            {openCreed&&
              <div style={{border:`1px solid ${C.border}`,borderTop:"none",borderRadius:"0 0 2px 2px",
                padding:"0.9rem 1rem",background:C.s1}}>
                {np.manifesto&&<>
                  <FL>Manifesto</FL>
                  <div style={{fontSize:13.5,color:C.textD,lineHeight:1.7,whiteSpace:"pre-wrap",
                    marginBottom:"1rem",fontStyle:"italic"}}>{np.manifesto}</div>
                </>}
                <FL>Position</FL>
                <AxisBars answers={np.answers}/>
                <div className="mono" style={{fontSize:10,color:C.gold,margin:"10px 0 14px",letterSpacing:"0.08em"}}>
                  {creedSummary(np.answers).toUpperCase()}</div>
                <FL>Answers in full</FL>
                <div style={{maxHeight:320,overflowY:"auto",border:`1px solid ${C.border}`,borderRadius:2}}>
                  {CREED.map(sec=>{
                    const given=sec.items.filter(it=>(np.answers||{})[it.id]!=null);
                    if(given.length===0)return null;
                    return(
                      <div key={sec.id}>
                        <div className="mono" style={{fontSize:8.5,letterSpacing:"0.16em",color:C.gold,
                          textTransform:"uppercase",padding:"7px 10px",background:C.s3,
                          borderBottom:`1px solid ${C.border}`}}>{sec.title}</div>
                        {given.map(it=>{
                          const k=LIKERT.find(l=>l.v===np.answers[it.id]);
                          return(
                            <div key={it.id} style={{display:"flex",gap:10,padding:"6px 10px",
                              borderBottom:`1px solid ${C.border}44`,alignItems:"center"}}>
                              <span style={{flex:1,fontSize:12.5,color:C.textD,lineHeight:1.45}}>{it.q}</span>
                              <span className="mono" style={{fontSize:9.5,color:k?k.c:C.textDD,flexShrink:0,
                                whiteSpace:"nowrap"}}>{k?k.l:"—"}</span>
                            </div>
                          );
                        })}
                      </div>
                    );
                  })}
                </div>
              </div>}
          </div>}

        {/* ── the rulings ── */}
        <div style={{marginTop:12,paddingTop:11,borderTop:`1px solid ${C.border}`,
          display:"flex",flexDirection:"column",gap:10}}>
          {isNew&&
            <div style={{display:"flex",gap:9,flexWrap:"wrap",alignItems:"center"}}>
              <span className="mono" style={{fontSize:9,letterSpacing:"0.14em",color:C.textDD,minWidth:78}}>PARTY</span>
              <Btn small variant="green" disabled={busy||reg.partyStatus==="approved"}
                onClick={()=>rule({partyDecision:"approved"})}>Recognise the party</Btn>
              <Btn small variant="red" disabled={busy||reg.partyStatus==="denied"}
                onClick={()=>rule({partyDecision:"denied",partyReason:reason.trim()})}>Refuse the party</Btn>
              {reg.partyStatus==="denied"&&
                <span style={{fontSize:12,color:C.textDD,fontStyle:"italic"}}>
                  Refused — they stand as {stands.name} unless you assign another party below.</span>}
            </div>}

          <div style={{display:"flex",gap:9,flexWrap:"wrap",alignItems:"center"}}>
            <span className="mono" style={{fontSize:9,letterSpacing:"0.14em",color:C.textDD,minWidth:78}}>CANDIDACY</span>
            <Btn small variant="green" disabled={busy||reg.status==="approved"}
              onClick={()=>rule({decision:"approved"})}>Approve</Btn>
            <Btn small variant="red" disabled={busy||reg.status==="denied"}
              onClick={()=>rule({decision:"denied",reason:reason.trim()})}>Deny</Btn>
            {reg.status!=="pending"&&
              <Btn small onClick={()=>rule({decision:"pending"})}>Return to pending</Btn>}
          </div>

          <div style={{display:"flex",gap:9,flexWrap:"wrap",alignItems:"center"}}>
            <span className="mono" style={{fontSize:9,letterSpacing:"0.14em",color:C.textDD,minWidth:78}}>SEAT UNDER</span>
            <select value={assign} onChange={e=>{setAssign(e.target.value);rule({assignedParty:e.target.value});}}
              style={{...inp,maxWidth:260,marginBottom:0,fontSize:13}}>
              <option value="">— as filed ({stands.name}) —</option>
              {partyList.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>

          <div style={{display:"flex",gap:9,flexWrap:"wrap",alignItems:"center"}}>
            <span className="mono" style={{fontSize:9,letterSpacing:"0.14em",color:C.textDD,minWidth:78}}>REASON</span>
            <Inp value={reason} onChange={setReason} style={{flex:"1 1 220px",maxWidth:360}}
              placeholder="Shown to the candidate if you refuse (optional)"/>
          </div>

          {(reg.reason||reg.partyReason)&&
            <div style={{fontSize:12.5,color:C.textDD,fontStyle:"italic",lineHeight:1.5}}>
              {reg.reason?"Candidacy: "+reg.reason:""}{reg.reason&&reg.partyReason?" · ":""}
              {reg.partyReason?"Party: "+reg.partyReason:""}
            </div>}
        </div>
      </div>
    </div>
  );
}

function NominationsQueue({el,regs,partyMap,partyList,onRule,onNominate,onStrike,note}){
  const [filter,setFilter]=useState("all");
  const [adding,setAdding]=useState(false);
  const [nm,setNm]=useState({username:"",ballotName:"",blurb:"",partyId:INDEPENDENT_ID});
  const counts={
    all:regs.length,
    pending:regs.filter(r=>r.status==="pending").length,
    approved:regs.filter(r=>r.status==="approved").length,
    denied:regs.filter(r=>r.status==="denied").length,
  };
  const shown=filter==="all"?regs:regs.filter(r=>r.status===filter);
  const order={pending:0,approved:1,denied:2};
  const sorted=shown.slice().sort((a,b)=>(order[a.status]??3)-(order[b.status]??3)||(a.filedAt||0)-(b.filedAt||0));

  return(
    <div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:"0.9rem",alignItems:"center"}}>
        {[["all","All"],["pending","Pending"],["approved","Approved"],["denied","Refused"]].map(([k,l])=>(
          <button key={k} onClick={()=>setFilter(k)} className="cz"
            style={{fontSize:10,letterSpacing:"0.14em",textTransform:"uppercase",padding:"5px 11px",
              borderRadius:2,cursor:"pointer",border:`1px solid ${filter===k?C.gold+"77":C.border}`,
              background:filter===k?C.gold+"14":"transparent",color:filter===k?C.gold:C.textD}}>
            {l} <span className="mono" style={{fontSize:9,opacity:0.75}}>{counts[k]}</span>
          </button>
        ))}
        <span style={{flex:1}}/>
        <Btn small onClick={()=>setAdding(a=>!a)}>{adding?"Cancel":"+ Nominate on their behalf"}</Btn>
      </div>

      {adding&&
        <div style={{...card,background:C.s2,padding:"0.95rem 1.1rem",marginBottom:"0.9rem"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10}}>
            <div><FL>Vintranet username *</FL><Inp value={nm.username} onChange={v=>setNm(o=>({...o,username:v}))}/></div>
            <div><FL>Name on the ballot *</FL><Inp value={nm.ballotName} onChange={v=>setNm(o=>({...o,ballotName:v}))}/></div>
            <div><FL>Party</FL>
              <select value={nm.partyId} onChange={e=>setNm(o=>({...o,partyId:e.target.value}))} style={{...inp,marginBottom:0}}>
                {partyList.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select></div>
          </div>
          <div style={{marginTop:9}}><FL>Slogan</FL><Inp value={nm.blurb} onChange={v=>setNm(o=>({...o,blurb:v}))}/></div>
          <div style={{marginTop:11,display:"flex",justifyContent:"flex-end"}}>
            <Btn variant="gold" disabled={!nm.username.trim()||!nm.ballotName.trim()}
              onClick={async()=>{
                const r=await onNominate(nm);
                if(r.ok){setAdding(false);setNm({username:"",ballotName:"",blurb:"",partyId:INDEPENDENT_ID});
                  note("Candidate entered and approved.",C.green);}
                else note(r.error||"Could not enter the candidate.",C.redL);
              }}>Enter as approved</Btn>
          </div>
        </div>}

      {sorted.length===0
        ?<Empty>{regs.length===0?"No papers have been filed.":"Nothing in this category."}</Empty>
        :<div style={{display:"flex",flexDirection:"column",gap:9}}>
          {sorted.map(r=>(
            <div key={r.id}>
              <NominationCard reg={r} el={el} partyMap={partyMap} partyList={partyList}
                onRule={onRule} note={note}/>
              <div style={{display:"flex",justifyContent:"flex-end",marginTop:5}}>
                <ArmBtn small label="Strike this paper" confirmLabel="Remove entirely?"
                  onConfirm={async()=>{const x=await onStrike(r.id);
                    note(x.ok?"Paper struck from the record.":(x.error||"Could not strike."),x.ok?C.gold:C.redL);}}/>
              </div>
            </div>
          ))}
        </div>}
    </div>
  );
}

function RegistrarView({me,elList,elections,ballotsByEl,regsByEl,citizens,partyMap,partyList,sitting,
  onSave,onDelete,onStatus,onCertify,onRule,onNominate,onStrike,onClearBallots,note,reload}){
  const [openId,setOpenId]=useState(null);
  const [editing,setEditing]=useState(null);
  const [tab,setTab]=useState("pipeline");
  useEffect(()=>{
    if(!openId||!elections[openId])setOpenId(elList[0]?elList[0].id:null);
  },[elList,elections,openId]);
  const el=openId?elections[openId]:null;
  const ballots=el?(ballotsByEl[el.id]||[]):[];
  const regs=el?(regsByEl[el.id]||[]):[];
  const R=useElectionResults(el||{},ballots,regs,partyMap,sitting);
  const electorate=useElectorate(citizens,el||{},ballots);
  const step=el?nextStep(el,R):null;
  const pending=regs.filter(r=>r.status==="pending").length;

  /* Keep the Registrar's count live on election night — the same 15-second pull
     the public board uses. Paused while a contest editor is open, so a refresh
     never pulls the snapshot out from under an edit in progress, and only while
     the open contest is actually running (a poll open, or nominations open). */
  const liveContest=!!el&&(el.status==="voting"||el.status==="registration");
  useEffect(()=>{
    if(editing||!liveContest)return;
    const id=setInterval(()=>{reload();},15000);
    return()=>clearInterval(id);
  },[editing,liveContest,reload]);

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",
        gap:12,marginBottom:"1.2rem"}}>
        <div>
          <div className="mono" style={{fontSize:9.5,letterSpacing:"0.26em",color:C.gold,textTransform:"uppercase"}}>
            Returning Officer · {(me.displayName||me.username).toUpperCase()}</div>
          <h1 className="cz" style={{fontWeight:900,fontSize:"clamp(1.4rem,3.6vw,2rem)",color:C.text,
            marginTop:5,lineHeight:1.1}}>The Registrar's Office</h1>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn onClick={reload}>↻ Refresh</Btn>
          <Btn variant="gold" onClick={()=>setEditing(blankElection())}>+ New contest</Btn>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"minmax(0,240px) minmax(0,1fr)",gap:"1.1rem",
        alignItems:"start"}}>
        <style>{`@media(max-width:820px){.regGrid{display:block!important}.regGrid>aside{margin-bottom:1rem}}`}</style>
        <aside style={{display:"flex",flexDirection:"column",gap:7}}>
          {elList.length===0&&<Empty>No contest is on the books.</Empty>}
          {elList.map(e=>{
            const act=openId===e.id;
            const p=(regsByEl[e.id]||[]).filter(r=>r.status==="pending").length;
            return(
              <button key={e.id} onClick={()=>setOpenId(e.id)}
                style={{textAlign:"left",background:act?C.s3:C.s1,border:`1px solid ${act?C.gold+"66":C.border}`,
                  borderLeft:`4px solid ${act?C.gold:C.border}`,borderRadius:2,padding:"0.7rem 0.85rem",cursor:"pointer"}}>
                <div className="cz" style={{fontWeight:600,fontSize:13.5,color:C.text,lineHeight:1.3}}>{e.name}</div>
                <div className="mono" style={{fontSize:9,color:C.textDD,marginTop:4}}>
                  {fmtDate(e.date)} · {(ballotsByEl[e.id]||[]).length} BALLOTS</div>
                <div style={{marginTop:6,display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                  <StagePill status={e.status} small/>
                  {p>0&&<span className="mono" style={{fontSize:8.5,color:C.gold,letterSpacing:"0.12em"}}>{p} PENDING</span>}
                </div>
              </button>
            );
          })}
        </aside>

        <section style={{minWidth:0}}>
          {!el?<Empty tall>Select a contest, or create one.</Empty>:<>
            {/* header + the one lawful next step */}
            <div style={{...card,padding:"1.1rem 1.2rem",marginBottom:"1rem"}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:12,flexWrap:"wrap",
                alignItems:"flex-start",marginBottom:12}}>
                <div style={{flex:"1 1 220px",minWidth:0}}>
                  <h2 className="cz" style={{fontWeight:800,fontSize:20,color:C.text,lineHeight:1.15}}>{el.name}</h2>
                  <div className="mono" style={{fontSize:9.5,color:C.textDD,marginTop:5,lineHeight:1.7}}>
                    {fmtDate(el.date)} · {(el.votesPerVoter||VPV_DEFAULT)} VOTES/ELECTOR ·
                    {" "+(el.seatsTotal||SEATS_DEFAULT).toLocaleString()} SEATS · REGISTER {electorate.size.toLocaleString()}
                  </div>
                </div>
                <div style={{display:"flex",gap:7,flexWrap:"wrap",alignItems:"center"}}>
                  <StagePill status={el.status}/>
                  <Btn small onClick={()=>setEditing(el)}>Edit</Btn>
                </div>
              </div>
              <Pipeline status={el.status}/>
              <div style={{display:"flex",gap:9,flexWrap:"wrap",alignItems:"center",marginTop:14,
                paddingTop:12,borderTop:`1px solid ${C.border}`}}>
                {step&&
                  <Btn variant={step.variant} disabled={step.disabled}
                    onClick={()=>{
                      if(step.to==="certified")onCertify(el,R,electorate);
                      else onStatus(el,step.to);
                    }}>{step.label} →</Btn>}
                {stageIdx(el.status)>0&&
                  <ArmBtn small label="Step back" confirmLabel="Reopen the previous stage?"
                    onConfirm={()=>onStatus(el,STAGES[stageIdx(el.status)-1].id)}/>}
                <span style={{flex:1}}/>
                {el.status==="registration"&&pending>0&&
                  <span className="mono" style={{fontSize:10,color:C.gold,letterSpacing:"0.1em"}}>
                    {pending} PAPER{pending===1?"":"S"} AWAITING YOUR RULING</span>}
              </div>
              {step&&step.warn&&
                <div className="mono" style={{fontSize:10.5,color:C.amber,marginTop:9,lineHeight:1.6}}>⚠ {step.warn}</div>}
              {el.status==="voting_closed"&&
                <div style={{fontSize:13,color:C.textD,fontStyle:"italic",marginTop:9,lineHeight:1.6}}>
                  Certifying freezes this count into the archive exactly as it stands — the seat drift,
                  the individual returns and every referendum verdict — and it cannot be recomputed afterwards.
                </div>}
            </div>

            {/* sub-navigation */}
            <div style={{display:"flex",gap:2,flexWrap:"wrap",borderBottom:`1px solid ${C.border}`,
              marginBottom:"1rem"}}>
              {[["pipeline","Nominations"+(pending>0?" ("+pending+")":"")],
                ["questions","Referendums"],
                ["count","The Count"],
                ["log","Ballot Log"]].map(([k,l])=>(
                <button key={k} onClick={()=>setTab(k)} className="cz"
                  style={{background:"transparent",border:"none",cursor:"pointer",padding:"9px 13px",
                    fontSize:10.5,letterSpacing:"0.14em",textTransform:"uppercase",fontWeight:600,
                    color:tab===k?C.gold:C.textD,borderBottom:`2px solid ${tab===k?C.gold:"transparent"}`}}>{l}</button>
              ))}
            </div>

            {tab==="pipeline"&&
              <NominationsQueue el={el} regs={regs} partyMap={partyMap} partyList={partyList}
                onRule={onRule} onNominate={n=>onNominate(el,n)} onStrike={onStrike} note={note}/>}

            {tab==="questions"&&
              <ReferendumManager el={el} ballots={ballots} onUpsert={onSave} note={note}/>}

            {tab==="count"&&<>
              <div style={{display:"flex",gap:"0.7rem",flexWrap:"wrap",marginBottom:"1rem"}}>
                <Chip k="Ballots" v={R.ballotCount.toLocaleString()} color={C.gold}/>
                <Chip k="Votes" v={R.totalVotes.toLocaleString()}/>
                <Chip k="Turnout" v={electorate.turnout.toFixed(1)+"%"} color={C.greenL}/>
                <Chip k="On the register" v={electorate.size.toLocaleString()}/>
                <Chip k="Candidates" v={R.cands.length}/>
              </div>
              <div style={{...card,padding:"1rem 1.15rem",marginBottom:"1rem"}}>
                <STitle>Seat Drift</STitle>
                <DriftTable R={R}/>
              </div>
              <div style={{...card,padding:"1rem 1.15rem"}}>
                <STitle>Individual Returns</STitle>
                <CandidateRaces R={R}/>
              </div>
            </>}

            {tab==="log"&&<>
              <div style={{...card,maxHeight:400,overflowY:"auto"}}>
                {ballots.length===0&&<Empty>No ballot has been cast.</Empty>}
                {ballots.slice().sort((a,b)=>(b.at||0)-(a.at||0)).map((b,i)=>(
                  <div key={i} style={{display:"flex",justifyContent:"space-between",gap:10,flexWrap:"wrap",
                    padding:"0.5rem 0.8rem",borderBottom:`1px solid ${C.border}55`}}>
                    <span className="cz" style={{fontSize:13,color:C.text,flexShrink:0}}>{b.citizenName}</span>
                    <span className="mono" style={{fontSize:9.5,color:C.textDD,textAlign:"right",flex:"1 1 180px"}}>
                      {[
                        Object.entries(b.votes||{}).map(([cid,n])=>{
                          const c=R.cands.find(x=>x.id===cid);
                          return (c?c.name:"—")+"×"+n;}).join(", "),
                        (el.referendums||[]).map(r=>{
                          const pick=(b.refVotes||{})[r.id];if(!pick)return null;
                          const o=(r.options||[]).find(x=>x.id===pick);
                          return "▸"+(o?o.label:"?");}).filter(Boolean).join(" ")
                      ].filter(Boolean).join("  ·  ")}
                    </span>
                  </div>
                ))}
              </div>
              <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:"1rem",flexWrap:"wrap"}}>
                <ArmBtn label="Clear all ballots" confirmLabel="Destroy every ballot cast?"
                  onConfirm={()=>onClearBallots(el)}/>
                <ArmBtn label="Delete this contest" confirmLabel="Delete the contest and all its papers?"
                  onConfirm={()=>{onDelete(el);setOpenId(null);}}/>
              </div>
            </>}
          </>}
        </section>
      </div>

      {editing&&
        <ElectionEditor el={editing} onClose={()=>setEditing(null)}
          onSave={async x=>{const r=await onSave(x);
            if(r.ok){setOpenId(x.id);setEditing(null);note("Contest saved.",C.green);}
            else note(r.error||"Could not save.",C.redL);}}/>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════════
   APP
   ══════════════════════════════════════════════════════════════════════════════ */
function App(){
  const [raw,setRaw]=useState({});
  const [loading,setLoading]=useState(true);
  const [me,setMe]=useState(()=>cachedAccount());
  const [view,setView]=useState("board");
  const [selId,setSelId]=useState(null);
  const [signIn,setSignIn]=useState(null);      // null | {reason}
  const [toast,setToast]=useState(null);
  const note=useCallback((m,c)=>{setToast({m,c:c||C.gold});setTimeout(()=>setToast(null),3200);},[]);

  const loadAll=useCallback(async()=>{
    const r=await sgetAll();setRaw(r);setLoading(false);return r;
  },[]);
  // srestore() seeds AUTH_TOKEN from localStorage synchronously before its
  // network check, so starting it first lets the one snapshot download carry the
  // session; /api/me validates in parallel.
  useEffect(()=>{
    const restoring=srestore();
    loadAll();
    restoring.then(acc=>{if(acc)setMe(acc);else if(!AUTH_TOKEN)setMe(null);});
  },[loadAll]);

  /* ── derive ── */
  const elections=useMemo(()=>raw["el_elections"]||{},[raw]);
  const elList=useMemo(()=>Object.values(elections)
    .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||(b.createdAt||0)-(a.createdAt||0)),[elections]);
  const citizens=useMemo(()=>Object.values(raw["mfa_citizens"]||{}),[raw]);
  const sitting=useMemo(()=>raw["bk_members"]||{},[raw]);
  const partiesRaw=useMemo(()=>{
    const p=raw["bk_parties"]||{};
    if(Object.keys(p).length)return p;
    const seed={};SEED_PARTIES.forEach((x,i)=>{seed[x.id]={...x,order:i};});
    return seed;
  },[raw]);
  const partyMap=useMemo(()=>{
    const m={};Object.entries(partiesRaw).forEach(([id,p])=>{m[id]={...p,id};});
    if(!m[INDEPENDENT_ID])m[INDEPENDENT_ID]={id:INDEPENDENT_ID,name:"Independent",abbr:"IND",color:"#888888"};
    return m;
  },[partiesRaw]);
  const partyList=useMemo(()=>Object.values(partyMap).sort((a,b)=>(a.order??99)-(b.order??99)),[partyMap]);

  const ballotsByEl=useMemo(()=>{
    const m={};
    Object.entries(raw).forEach(([k,v])=>{
      if(k.indexOf("el_ballot_")===0&&v&&v.elId)(m[v.elId]=m[v.elId]||[]).push(v);
    });
    return m;
  },[raw]);
  const regsByEl=useMemo(()=>{
    const m={};
    Object.entries(raw).forEach(([k,v])=>{
      if(k.indexOf("el_reg_")===0&&v&&v.elId)(m[v.elId]=m[v.elId]||[]).push({...v,id:k});
    });
    return m;
  },[raw]);

  const registrar=isRegistrar(me);
  const myCitizen=useMemo(()=>{
    if(!me)return null;
    const u=String(me.username||"").toLowerCase();
    return citizens.find(c=>String(c.username||"").trim().toLowerCase()===u)||null;
  },[me,citizens]);

  /* which contest the board is showing */
  useEffect(()=>{
    if(loading)return;
    const ids=new Set(elList.map(e=>e.id));
    if(!selId||!ids.has(selId)){
      const pick=elList.find(e=>e.status==="voting")||elList.find(e=>e.status==="registration")
        ||elList.find(e=>e.status==="voting_closed")||elList.find(e=>e.status==="reg_closed")
        ||elList.find(e=>isFinal(e.status))||elList[0]||null;
      setSelId(pick?pick.id:null);
    }
  },[loading,elList,selId]);
  const el=selId?elections[selId]:null;

  /* live polling while a poll is open and we're watching */
  useEffect(()=>{
    const anyLive=elList.some(e=>e.status==="voting"||e.status==="registration");
    if(!anyLive||view==="admin"||view==="vote")return;
    // Fifteen seconds keeps election night feeling live without re-downloading
    // the whole snapshot nine times a minute.
    const id=setInterval(async()=>{const r=await sgetAll();setRaw(r);},15000);
    return()=>clearInterval(id);
  },[elList,view]);

  const ballots=el?(ballotsByEl[el.id]||[]):[];
  const regs=el?(regsByEl[el.id]||[]):[];
  const R=useElectionResults(el||{},ballots,regs,partyMap,sitting);
  const electorate=useElectorate(citizens,el||{},ballots);

  /* ── writes ── */
  const patchRaw=(k,v)=>setRaw(r=>({...r,[k]:v}));

  const saveElection=useCallback(async next=>{
    const map={...(raw["el_elections"]||{}),[next.id]:next};
    patchRaw("el_elections",map);
    const r=await sset("el_elections",map);
    if(!r.ok)await loadAll();
    return r;
  },[raw,loadAll]);

  const setStatus=useCallback(async(e,to)=>{
    const r=await saveElection({...e,status:to,
      openedAt:to==="voting"?Date.now():e.openedAt,
      closedAt:to==="voting_closed"?Date.now():e.closedAt});
    note(r.ok?stage(to).label+".":(r.error||"Refused."),r.ok?C.green:C.redL);
  },[saveElection,note]);

  /* Certification freezes the count exactly as it stands. */
  const certify=useCallback(async(e,Res,elec)=>{
    const result={
      at:Date.now(),by:me?(me.displayName||me.username):"",
      seatsTotal:Res.seatsTotal,majority:Res.majority,
      totalVotes:Res.totalVotes,ballotCount:Res.ballotCount,
      electorate:elec.size,turnout:elec.turnout,hasMajority:Res.hasMajority,
      parties:Res.partyRows.map(p=>({id:p.id,name:p.name,abbr:p.abbr,color:p.color,
        votes:p.votes,seats:p.seats,before:p.before,change:p.change})),
      candidates:Res.candRows.map(c=>({id:c.id,name:c.name,username:c.username,
        partyId:c.partyId,partyName:c.party.name,abbr:c.party.abbr,color:c.party.color,
        votes:c.votes,seats:c.seats,before:c.before,change:c.change})),
      coalitions:Res.coalitions.slice(0,5).map(co=>({members:co.members.map(m=>m.abbr),seats:co.seats})),
      referendums:(e.referendums||[]).map(r=>{
        const t=tallyReferendum(r,ballotsByEl[e.id]||[]);
        return{id:r.id,question:r.question,threshold:r.threshold,
          options:(r.options||[]).map(o=>({id:o.id,label:o.label,votes:t.counts[o.id]||0})),
          total:t.total,
          verdictLabel:t.verdict?t.verdict.label:(t.winner?"LEADING · "+t.winner.label:"NO VOTES"),
          verdictColor:t.verdict?t.verdict.color:C.gold};
      }),
    };
    const r=await saveElection({...e,status:"certified",result});
    note(r.ok?"The result is certified and entered in the archive.":(r.error||"Refused."),r.ok?C.green:C.redL);
  },[saveElection,me,ballotsByEl,note]);

  const deleteElection=useCallback(async e=>{
    const map={...(raw["el_elections"]||{})};delete map[e.id];
    const r=await sset("el_elections",map);
    if(!r.ok){note(r.error||"Refused.",C.redL);return;}
    const keys=Object.keys(raw).filter(k=>k.indexOf("el_ballot_"+e.id+"_")===0||k.indexOf("el_reg_"+e.id+"_")===0);
    for(const k of keys)await sdel(k);
    await loadAll();note("Contest deleted.",C.gold);
  },[raw,loadAll,note]);

  const clearBallots=useCallback(async e=>{
    const keys=Object.keys(raw).filter(k=>k.indexOf("el_ballot_"+e.id+"_")===0);
    for(const k of keys)await sdel(k);
    await loadAll();note("Ballots cleared.",C.gold);
  },[raw,loadAll,note]);

  /* ── candidacy ── */
  const fileRegistration=useCallback(async rec=>{
    const key="el_reg_"+rec.elId+"_"+rec.username;
    const r=await sset(key,rec);
    if(r.ok)patchRaw(key,rec);else await loadAll();
    return r;
  },[loadAll]);

  const withdrawRegistration=useCallback(async key=>{
    await sdel(key);await loadAll();return{ok:true};
  },[loadAll]);

  /* The Registrar's ruling. Recognising a new party writes it onto the one
     imperial register (bk_parties) and stamps its new id onto the paper, so the
     candidate is seated under a real party from that moment on. */
  const ruleOnRegistration=useCallback(async(reg,patch)=>{
    let next={...reg};
    delete next.id;
    const stamp={decidedBy:me?me.username:"",decidedAt:Date.now()};

    if(patch.partyDecision==="approved"){
      const np=reg.newParty||{};
      if(!np.name)return{ok:false,error:"This paper carries no party application."};
      let pid=reg.newPartyId||slugify(np.name);
      if(!reg.newPartyId&&partyMap[pid])pid=pid+"_"+uid().slice(-4);
      const map={...partiesRaw};
      map[pid]={id:pid,name:np.name,abbr:(np.abbr||np.name.slice(0,3)).toUpperCase(),
        color:np.color||"#888888",founded:np.founded||"",order:Object.keys(map).length,
        manifesto:np.manifesto||"",creed:np.answers||{}};
      const pr=await sset("bk_parties",map);
      if(!pr.ok)return pr;
      patchRaw("bk_parties",map);
      next={...next,partyStatus:"approved",newPartyId:pid,partyReason:"",...stamp};
    }
    if(patch.partyDecision==="denied")
      next={...next,partyStatus:"denied",newPartyId:"",partyReason:patch.partyReason||"",...stamp};
    if(patch.decision)
      next={...next,status:patch.decision,reason:patch.decision==="denied"?(patch.reason||""):"",...stamp};
    if("assignedParty" in patch)
      next={...next,assignedParty:patch.assignedParty||""};

    const r=await sset(reg.id,next);
    if(r.ok)patchRaw(reg.id,next);else await loadAll();
    return r;
  },[me,partiesRaw,partyMap,loadAll]);

  const nominateOnBehalf=useCallback(async(e,n)=>{
    const u=String(n.username||"").trim().toLowerCase();
    if(!u)return{ok:false,error:"A username is required."};
    const key="el_reg_"+e.id+"_"+u;
    const rec={elId:e.id,username:u,displayName:n.ballotName.trim(),citizenId:"",
      ballotName:n.ballotName.trim(),blurb:(n.blurb||"").trim(),
      partyMode:n.partyId===INDEPENDENT_ID?"independent":"existing",
      partyId:n.partyId===INDEPENDENT_ID?"":n.partyId,newParty:null,
      status:"approved",partyStatus:null,byRegistrar:true,
      filedAt:Date.now(),decidedBy:me?me.username:"",decidedAt:Date.now()};
    const r=await sset(key,rec);
    if(r.ok)patchRaw(key,rec);else await loadAll();
    return r;
  },[me,loadAll]);

  const strikeRegistration=useCallback(async key=>{
    await sdel(key);await loadAll();return{ok:true};
  },[loadAll]);

  /* ── the ballot ── */
  const castBallot=useCallback(async payload=>{
    if(!el||!myCitizen)return{ok:false,error:"Not eligible."};
    const key="el_ballot_"+el.id+"_"+myCitizen.id;
    const ballot={elId:el.id,citizenId:myCitizen.id,citizenName:myCitizen.name,
      votes:payload.votes||{},refVotes:payload.refVotes||{},at:Date.now()};
    const r=await sset(key,ballot);
    if(r.ok)patchRaw(key,ballot);
    return r;
  },[el,myCitizen]);

  /* ── chrome state ── */
  const canStand=!!el&&el.status==="registration";
  const canVote=!!el&&el.status==="voting";
  useEffect(()=>{
    if(view==="admin"&&!registrar)setView("board");
    if(view==="stand"&&!canStand)setView("board");
    if(view==="vote"&&!canVote)setView("board");
  },[view,registrar,canStand,canVote]);

  const need=reason=>{if(me)return true;setSignIn({reason});return false;};

  return(
    <div style={{minHeight:"100vh",position:"relative",background:C.bg}}>
      <Backdrop/>
      <Masthead view={view} setView={setView} me={me} registrar={registrar}
        canStand={canStand} canVote={canVote}
        onSignIn={()=>setSignIn({})}
        onSignOut={()=>{forgetSession();setMe(null);setView("board");note("Signed out.",C.gold);}}/>

      <main style={{position:"relative",zIndex:2,maxWidth:1180,margin:"0 auto",padding:"1.6rem 1.1rem 1rem"}}>
        {loading
          ?<div className="mono" style={{textAlign:"center",padding:"5rem 1rem",color:C.textDD,
             letterSpacing:"0.24em",fontSize:11}}>OPENING THE COUNT…</div>
          :view==="admin"&&registrar
          ?<RegistrarView me={me} elList={elList} elections={elections} ballotsByEl={ballotsByEl}
             regsByEl={regsByEl} citizens={citizens} partyMap={partyMap} partyList={partyList} sitting={sitting}
             onSave={saveElection} onDelete={deleteElection} onStatus={setStatus} onCertify={certify}
             onRule={ruleOnRegistration} onNominate={nominateOnBehalf} onStrike={strikeRegistration}
             onClearBallots={clearBallots} note={note} reload={loadAll}/>
          :!el
          ?<div style={{textAlign:"center",padding:"3rem 1rem"}}>
             <Seal size={116} style={{opacity:0.9,animation:"iec-seal .5s ease"}}/>
             <div className="cz" style={{fontWeight:800,fontSize:24,color:C.text,marginTop:"1rem"}}>
               No contest is on the books.</div>
             <p style={{color:C.textD,maxWidth:460,margin:"0.7rem auto 0",lineHeight:1.7,fontStyle:"italic"}}>
               When the Registrar calls an election, the pipeline appears here — nominations, the poll,
               and the live count — and every subject on the register may take part.
             </p>
             {registrar&&<div style={{marginTop:18}}>
               <Btn variant="gold" onClick={()=>setView("admin")}>Open the Registrar's office →</Btn></div>}
           </div>
          :view==="stand"
          ?<StandView el={el} me={me} myCitizen={myCitizen} electorate={electorate} regs={regs}
             partyMap={partyMap} partyList={partyList}
             onFile={fileRegistration} onWithdraw={withdrawRegistration} note={note}/>
          :view==="vote"
          ?<VoteView el={el} me={me} myCitizen={myCitizen} electorate={electorate} R={R} ballots={ballots}
             onCast={castBallot} onBack={()=>setView("board")} note={note}/>
          :view==="archive"
          ?<ArchiveView elList={elList} onOpen={id=>{setSelId(id);setView("board");}}/>
          :<BoardView el={el} elList={elList} onSwitch={setSelId} ballots={ballots} regs={regs}
             partyMap={partyMap} sitting={sitting} citizens={citizens} me={me}
             onGoVote={()=>{if(need("Voting is verified through your Vintranet account. Sign in to cast your ballot."))setView("vote");}}
             onGoStand={()=>{if(need("Candidacy is filed against your Vintranet account. Sign in to stand."))setView("stand");}}/>}
      </main>

      {!loading&&el&&view==="board"&&hasCount(el.status)&&
        <Ticker R={R} el={el} refs={el.referendums||[]} ballots={ballots} electorate={electorate}/>}

      <Footer/>
      {signIn&&<SignInModal reason={signIn.reason} onClose={()=>setSignIn(null)}
        onAuth={acc=>{setMe(acc);setSignIn(null);loadAll();note("Signed in as "+(acc.displayName||acc.username)+".",C.green);}}/>}
      {toast&&<Toast {...toast}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
