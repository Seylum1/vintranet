/* A party's position on the five axes, drawn as a row of sliders. */
function AxisBars({answers,compact}){
  const ax=creedAxes(answers);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:compact?6:9}}>
      {AXES.map(a=>{
        const v=ax[a.id];                       // −1 … +1
        const posPct=(v+1)/2*100;
        const col=Math.abs(v)<0.12?C.textD:v>0?C.gold:C.blue;
        return(
          <div key={a.id}>
            <div style={{display:"flex",justifyContent:"space-between",gap:8,marginBottom:3}}>
              <span className="mono" style={{fontSize:8.5,letterSpacing:"0.12em",color:C.textDD,textTransform:"uppercase"}}>{a.left}</span>
              {!compact&&<span className="cz" style={{fontSize:9.5,letterSpacing:"0.14em",color:C.textD,textTransform:"uppercase"}}>{a.label}</span>}
              <span className="mono" style={{fontSize:8.5,letterSpacing:"0.12em",color:C.textDD,textTransform:"uppercase"}}>{a.right}</span>
            </div>
            <div style={{position:"relative",height:compact?7:9,background:C.s3,borderRadius:1,
              border:`1px solid ${C.border}`}}>
              <div style={{position:"absolute",left:"50%",top:-2,bottom:-2,width:1,background:C.border}}/>
              <div style={{position:"absolute",top:-1,bottom:-1,borderRadius:1,background:col+"cc",
                left:(v>=0?50:posPct)+"%",width:Math.abs(v)*50+"%",transition:"all .4s"}}/>
              <div style={{position:"absolute",top:compact?-2:-3,width:3,height:compact?11:15,
                background:col,left:`calc(${posPct}% - 1.5px)`,boxShadow:`0 0 6px ${col}`,transition:"left .4s"}}/>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* The questionnaire. Seventy-two propositions in twelve heads of doctrine, each
   collapsible so the form reads as a dozen short pages rather than one wall. */
function CreedForm({answers,setAnswers}){
  const [open,setOpen]=useState(CREED[0].id);
  const answered=creedAnswered(answers);
  const setOne=(id,v)=>setAnswers(a=>({...a,[id]:v}));
  const fillSection=(sec,v)=>setAnswers(a=>{const n={...a};sec.items.forEach(it=>{n[it.id]=v;});return n;});
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",gap:10,flexWrap:"wrap",
        alignItems:"center",marginBottom:10}}>
        <span style={{fontSize:13,color:C.textD,fontStyle:"italic"}}>
          Answer as many as your party has a settled view on. Blanks read as “no position taken”.
        </span>
        <span className="mono" style={{fontSize:10,color:answered>0?C.gold:C.textDD,whiteSpace:"nowrap"}}>
          {answered} / {CREED_COUNT} ANSWERED
        </span>
      </div>
      <div style={{height:4,background:C.s3,borderRadius:1,marginBottom:"1rem",overflow:"hidden"}}>
        <div style={{width:pct(answered,CREED_COUNT)+"%",height:"100%",
          background:`linear-gradient(90deg,${C.goldD},${C.gold})`,transition:"width .3s"}}/>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        {CREED.map((sec,si)=>{
          const isOpen=open===sec.id;
          const done=sec.items.filter(it=>(answers||{})[it.id]!=null).length;
          return(
            <div key={sec.id} style={{border:`1px solid ${isOpen?C.gold+"44":C.border}`,borderRadius:2,
              background:isOpen?C.s2:C.s1}}>
              <button onClick={()=>setOpen(isOpen?null:sec.id)}
                style={{width:"100%",display:"flex",alignItems:"center",gap:10,padding:"0.7rem 0.9rem",
                  background:"transparent",border:"none",cursor:"pointer",textAlign:"left"}}>
                <span className="mono" style={{fontSize:9.5,color:C.textDD,flexShrink:0}}>
                  {String(si+1).padStart(2,"0")}</span>
                <span className="cz" style={{flex:1,fontSize:13,fontWeight:600,letterSpacing:"0.06em",
                  color:isOpen?C.gold:C.text}}>{sec.title}</span>
                <span className="mono" style={{fontSize:9,color:done===sec.items.length?C.greenL:C.textDD,flexShrink:0}}>
                  {done}/{sec.items.length}</span>
                <span style={{color:C.textDD,fontSize:11,flexShrink:0}}>{isOpen?"▾":"▸"}</span>
              </button>
              {isOpen&&
                <div style={{padding:"0 0.9rem 0.9rem"}}>
                  <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10,
                    paddingBottom:9,borderBottom:`1px solid ${C.border}`}}>
                    <span className="mono" style={{fontSize:8.5,color:C.textDD,alignSelf:"center",
                      letterSpacing:"0.12em",marginRight:4}}>SET ALL:</span>
                    {LIKERT.map(k=>(
                      <Btn key={k.v} small onClick={()=>fillSection(sec,k.v)} style={{color:k.c,borderColor:k.c+"44"}}>{k.s}</Btn>
                    ))}
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:9}}>
                    {sec.items.map(it=>{
                      const cur=(answers||{})[it.id];
                      const axm=AXES.find(a=>a.id===it.ax);
                      return(
                        <div key={it.id} style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center",
                          paddingBottom:9,borderBottom:`1px solid ${C.border}44`}}>
                          <div style={{flex:"1 1 260px",minWidth:200}}>
                            <div style={{fontSize:14.5,color:C.text,lineHeight:1.5}}>{it.q}</div>
                            <div className="mono" style={{fontSize:8,letterSpacing:"0.12em",color:C.textDD,
                              textTransform:"uppercase",marginTop:3}}>{axm?axm.label:it.ax}</div>
                          </div>
                          <div style={{display:"flex",gap:3,flexShrink:0}}>
                            {LIKERT.map(k=>{
                              const sel=cur===k.v;
                              return(
                                <button key={k.v} onClick={()=>setOne(it.id,sel?null:k.v)} title={k.l}
                                  className="mono" style={{width:34,height:30,borderRadius:2,cursor:"pointer",
                                    border:`1px solid ${sel?k.c:C.border}`,background:sel?k.c+"22":"transparent",
                                    color:sel?k.c:C.textDD,fontSize:12,fontWeight:700,transition:"all .12s"}}>
                                  {k.s}
                                </button>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>}
            </div>
          );
        })}
      </div>

      {answered>0&&
        <div style={{marginTop:"1.1rem",...card,background:C.s2,padding:"0.9rem 1.05rem"}}>
          <STitle>Where That Places You</STitle>
          <AxisBars answers={answers}/>
          <div className="mono" style={{fontSize:10,color:C.gold,marginTop:10,letterSpacing:"0.08em"}}>
            {creedSummary(answers).toUpperCase()}
          </div>
        </div>}
    </div>
  );
}

/* The decision the Registrar has handed down on a filed paper. */
function DecisionCard({reg,partyMap}){
  const P=id=>partyMap[id]||{name:"Independent",abbr:"IND",color:"#888888"};
  const rows=[
    {k:"Candidacy",st:reg.status,
     note:reg.status==="approved"?"You are on the ballot paper."
       :reg.status==="denied"?(reg.reason||"The Registrar has refused this nomination.")
       :"With the Registrar."},
  ];
  if(reg.partyMode==="new")rows.push({k:"New party",st:reg.partyStatus||"pending",
    note:reg.partyStatus==="approved"?`“${(reg.newParty||{}).name}” is entered on the imperial register.`
      :reg.partyStatus==="denied"?(reg.partyReason||"The application to found this party was refused.")
      :"The application is with the Registrar."});
  const col=s=>s==="approved"?C.green:s==="denied"?C.redL:C.gold;
  const lbl=s=>s==="approved"?"APPROVED":s==="denied"?"REFUSED":"PENDING";
  return(
    <div style={{...card,background:C.s2,padding:"1rem 1.15rem",marginBottom:"1.1rem"}}>
      <STitle>Your Nomination</STitle>
      <div style={{display:"flex",flexDirection:"column",gap:9}}>
        {rows.map(r=>(
          <div key={r.k} style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"flex-start",
            borderLeft:`3px solid ${col(r.st)}`,paddingLeft:11}}>
            <div style={{flex:1,minWidth:180}}>
              <div className="cz" style={{fontSize:12,letterSpacing:"0.12em",color:C.text,
                textTransform:"uppercase",fontWeight:600}}>{r.k}</div>
              <div style={{fontSize:13.5,color:C.textD,fontStyle:"italic",marginTop:3,lineHeight:1.5}}>{r.note}</div>
            </div>
            <span className="mono" style={{fontSize:9.5,letterSpacing:"0.16em",color:col(r.st),
              border:`1px solid ${col(r.st)}55`,background:col(r.st)+"14",borderRadius:2,padding:"3px 10px",flexShrink:0}}>
              {lbl(r.st)}</span>
          </div>
        ))}
      </div>
      {reg.status==="approved"&&
        <div style={{marginTop:12,paddingTop:11,borderTop:`1px solid ${C.border}`,
          display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          <span className="mono" style={{fontSize:9,letterSpacing:"0.14em",color:C.textDD}}>YOU STAND AS</span>
          <span className="cz" style={{fontSize:14,fontWeight:700,color:P(standsUnder(reg)).color}}>
            {P(standsUnder(reg)).name}</span>
          {reg.partyMode==="new"&&reg.partyStatus==="denied"&&
            <span style={{fontSize:12.5,color:C.textDD,fontStyle:"italic"}}>
              — your party was refused, so you are seated under this instead.</span>}
        </div>}
    </div>
  );
}

function StandView({el,me,myCitizen,electorate,regs,partyMap,partyList,onFile,onWithdraw,note}){
  const myKey=me?("el_reg_"+el.id+"_"+String(me.username||"").toLowerCase()):null;
  const mine=(regs||[]).find(r=>r.id===myKey)||null;
  const locked=!!mine&&mine.status!=="pending";
  const [editing,setEditing]=useState(false);
  const open=el.status==="registration";
  const allowNew=el.allowNewParties!==false;

  const [ballotName,setBallotName]=useState("");
  const [blurb,setBlurb]=useState("");
  const [mode,setMode]=useState("existing");
  const [partyId,setPartyId]=useState("");
  const [np,setNp]=useState({name:"",abbr:"",color:"#8B0000",founded:"",manifesto:""});
  const [answers,setAnswers]=useState({});
  const [busy,setBusy]=useState(false);

  /* Load the form from a paper already on file, so an edit is a real edit. */
  const hydrate=useCallback(()=>{
    if(mine){
      setBallotName(mine.ballotName||"");setBlurb(mine.blurb||"");
      setMode(mine.partyMode||"existing");setPartyId(mine.partyId||"");
      setNp({name:"",abbr:"",color:"#8B0000",founded:"",manifesto:"",...(mine.newParty||{})});
      setAnswers((mine.newParty&&mine.newParty.answers)||{});
    }else{
      setBallotName((me&&(me.displayName||me.username))||"");
      setPartyId((partyList[0]&&partyList[0].id)||"");
    }
  },[mine,me,partyList]);
  useEffect(()=>{hydrate();},[hydrate]);

  if(!me)return(
    <Notice title="Sign in to stand for election"
      body="Candidacy is filed against your Vintranet account, so the Registrar knows who is standing. Sign in above and return here."/>
  );
  if(!open&&!mine)return(
    <Notice title="Nominations are not open"
      body={el.status==="draft"?"This contest has not yet opened for nominations."
        :"The nomination period for this contest has closed. Watch the count on the board."}/>
  );
  if(!myCitizen)return(
    <Notice title="No citizenship record is linked to your account" tone="warn"
      body="Standing for election requires a record on the imperial citizenship register linked to your username. Open the Foreign Affairs portal and claim your record, or ask the Ministry to link it."/>
  );
  if(!electorate.roll.some(c=>c.id===myCitizen.id))return(
    <Notice title="Your category may not stand in this contest" tone="warn"
      body={`Your record lists you as ${CITIZEN_STATUSES[myCitizen.status||"citizen"]}. This election is open to ${electorate.label}.`}/>
  );

  const showForm=open&&(!mine||editing);
  const npReady=mode!=="new"||(np.name.trim().length>1&&np.abbr.trim().length>0);
  const canFile=ballotName.trim().length>1&&npReady&&(mode!=="existing"||!!partyId);

  const file=async()=>{
    if(!canFile||busy)return;
    setBusy(true);
    const rec={
      elId:el.id,username:String(me.username||"").toLowerCase(),
      displayName:me.displayName||me.username,citizenId:myCitizen.id,
      ballotName:ballotName.trim(),blurb:blurb.trim(),
      partyMode:mode,
      partyId:mode==="existing"?partyId:"",
      newParty:mode==="new"?{name:np.name.trim(),abbr:np.abbr.trim().toUpperCase().slice(0,6),
        color:np.color,founded:np.founded,manifesto:np.manifesto.trim(),answers}:null,
      status:"pending",
      partyStatus:mode==="new"?"pending":null,
      filedAt:(mine&&mine.filedAt)||Date.now(),updatedAt:Date.now(),
    };
    const res=await onFile(rec);
    setBusy(false);
    if(res.ok){setEditing(false);note(mine?"Your nomination has been amended.":"Your papers are filed with the Registrar.",C.green);}
    else note(res.error||"The Registrar's office refused the filing.",C.redL);
  };

  return(
    <div>
      <div style={{marginBottom:"1.2rem"}}>
        <div className="mono" style={{fontSize:9.5,letterSpacing:"0.26em",color:C.gold,textTransform:"uppercase"}}>
          {el.name}</div>
        <h1 className="cz" style={{fontWeight:900,fontSize:"clamp(1.5rem,4vw,2.3rem)",color:C.text,
          marginTop:5,lineHeight:1.1}}>Stand for Election</h1>
        <p style={{color:C.textD,fontStyle:"italic",marginTop:7,lineHeight:1.6,maxWidth:640,fontSize:14.5}}>
          File your papers with the Registrar. You may stand under a party already on the imperial
          register, as an Independent, or apply to found a party of your own — the Registrar rules on
          the candidacy and on the party separately.
        </p>
        {el.regClosesAt&&open&&
          <div style={{marginTop:9}}><Countdown to={el.regClosesAt} label="NOMINATIONS CLOSE IN"/></div>}
      </div>

      {mine&&<DecisionCard reg={mine} partyMap={partyMap}/>}

      {mine&&!showForm&&
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:"1.2rem"}}>
          {!locked&&open&&<Btn variant="gold" onClick={()=>{hydrate();setEditing(true);}}>Amend my papers</Btn>}
          {!locked&&open&&<ArmBtn label="Withdraw" confirmLabel="Withdraw your candidacy?"
            onConfirm={async()=>{const r=await onWithdraw(myKey);
              note(r.ok?"Your candidacy is withdrawn.":(r.error||"Could not withdraw."),r.ok?C.gold:C.redL);}}/>}
          {locked&&<div style={{fontSize:13,color:C.textDD,fontStyle:"italic"}}>
            The Registrar has ruled on this paper, so it can no longer be changed here.</div>}
        </div>}

      {showForm&&<>
        <section style={{...card,padding:"1.15rem 1.25rem",marginBottom:"1rem"}}>
          <STitle>The Candidate</STitle>
          <div style={{display:"grid",gap:"0.85rem"}}>
            <div>
              <FL hint="how you appear on the ballot paper">Name on the ballot *</FL>
              <Inp value={ballotName} onChange={setBallotName} placeholder="e.g. Anna von Kessler"/>
            </div>
            <div>
              <FL hint="one line, shown beside your name">Slogan or standing</FL>
              <Inp value={blurb} onChange={setBlurb} placeholder="e.g. For the farms of the eastern march"/>
            </div>
            <div className="mono" style={{fontSize:10.5,color:C.textDD,lineHeight:1.6}}>
              Filed by <b style={{color:C.textD}}>{me.username}</b> · citizenship record <b style={{color:C.textD}}>{myCitizen.name}</b>
            </div>
          </div>
        </section>

        <section style={{...card,padding:"1.15rem 1.25rem",marginBottom:"1rem"}}>
          <STitle>Your Party</STitle>
          <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:"1rem"}}>
            {[
              {id:"existing",t:"Stand for a registered party",d:"Choose from the parties on the imperial register."},
              {id:"independent",t:"Stand as an Independent",d:"No party affiliation at all."},
              allowNew&&{id:"new",t:"Apply to found a new party",d:"Name it, choose its colour, and set out its creed. The Registrar rules on it separately from your candidacy."},
            ].filter(Boolean).map(o=>{
              const sel=mode===o.id;
              return(
                <button key={o.id} onClick={()=>setMode(o.id)}
                  style={{display:"flex",gap:11,alignItems:"flex-start",textAlign:"left",width:"100%",
                    padding:"0.75rem 0.9rem",borderRadius:2,cursor:"pointer",
                    border:`1px solid ${sel?C.gold+"77":C.border}`,background:sel?C.gold+"0f":"transparent"}}>
                  <span style={{width:16,height:16,borderRadius:"50%",flexShrink:0,marginTop:2,
                    border:`2px solid ${sel?C.gold:C.border}`,display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
                    {sel&&<span style={{width:8,height:8,borderRadius:"50%",background:C.gold}}/>}
                  </span>
                  <span>
                    <span className="cz" style={{fontSize:13.5,fontWeight:600,color:sel?C.gold:C.text,display:"block"}}>{o.t}</span>
                    <span style={{fontSize:12.5,color:C.textDD,fontStyle:"italic",lineHeight:1.5}}>{o.d}</span>
                  </span>
                </button>
              );
            })}
          </div>

          {mode==="existing"&&
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {partyList.map(p=>{
                const sel=partyId===p.id;
                return(
                  <button key={p.id} onClick={()=>setPartyId(p.id)}
                    style={{display:"inline-flex",alignItems:"center",gap:8,padding:"7px 12px",borderRadius:2,
                      cursor:"pointer",border:`1px solid ${sel?p.color:C.border}`,
                      background:sel?p.color+"1c":"transparent"}}>
                    <span style={{width:10,height:10,borderRadius:1,background:p.color}}/>
                    <span className="cz" style={{fontSize:12.5,color:sel?C.text:C.textD,fontWeight:sel?600:400}}>{p.name}</span>
                    <span className="mono" style={{fontSize:9,color:p.color}}>{p.abbr}</span>
                  </button>
                );
              })}
            </div>}

          {mode==="new"&&
            <div style={{borderTop:`1px solid ${C.border}`,paddingTop:"1rem"}}>
              <div style={{display:"grid",gap:"0.8rem"}}>
                <div style={{display:"flex",gap:"0.8rem",flexWrap:"wrap"}}>
                  <div style={{flex:"2 1 240px"}}>
                    <FL>Party name *</FL>
                    <Inp value={np.name} onChange={v=>setNp(o=>({...o,name:v}))} placeholder="e.g. Lech Progressive Union"/>
                  </div>
                  <div style={{flex:"1 1 110px"}}>
                    <FL hint="max 6">Abbreviation *</FL>
                    <Inp value={np.abbr} onChange={v=>setNp(o=>({...o,abbr:v.toUpperCase().slice(0,6)}))} placeholder="LPU"/>
                  </div>
                  <div style={{flex:"1 1 140px"}}>
                    <FL>Founded</FL>
                    <Inp value={np.founded} onChange={v=>setNp(o=>({...o,founded:v}))} type="date"/>
                  </div>
                </div>
                <div>
                  <FL hint="worn on every chart in the Empire">Party colour *</FL>
                  <div style={{display:"flex",gap:9,alignItems:"center",flexWrap:"wrap"}}>
                    <input type="color" value={np.color} onChange={e=>setNp(o=>({...o,color:e.target.value}))}
                      style={{width:52,height:38,background:"transparent",border:`1px solid ${C.border}`,
                        borderRadius:2,cursor:"pointer",padding:2}}/>
                    <Inp value={np.color} onChange={v=>setNp(o=>({...o,color:v}))} style={{flex:"1 1 120px",maxWidth:180}}/>
                    <div style={{display:"flex",alignItems:"center",gap:8,padding:"7px 13px",borderRadius:2,
                      border:`1px solid ${np.color}66`,background:np.color+"1c"}}>
                      <span style={{width:12,height:12,borderRadius:1,background:np.color}}/>
                      <span className="cz" style={{fontSize:12.5,color:C.text}}>{np.name||"Your party"}</span>
                      <span className="mono" style={{fontSize:9.5,color:np.color}}>{np.abbr||"ABC"}</span>
                    </div>
                  </div>
                </div>
                <div>
                  <FL hint="what the party is for, in your own words">Manifesto</FL>
                  <TA value={np.manifesto} onChange={v=>setNp(o=>({...o,manifesto:v}))} rows={5}
                    placeholder="Set out the party's purpose, its founding grievance, and what it would do with a majority…"/>
                </div>
              </div>

              <div style={{marginTop:"1.3rem",paddingTop:"1.1rem",borderTop:`1px solid ${C.border}`}}>
                <STitle>The Party Creed</STitle>
                <CreedForm answers={answers} setAnswers={setAnswers}/>
              </div>
            </div>}
        </section>

        <div style={{display:"flex",justifyContent:"space-between",gap:9,flexWrap:"wrap",marginBottom:"1.5rem"}}>
          {mine
            ?<Btn onClick={()=>setEditing(false)}>Cancel</Btn>
            :<span/>}
          <Btn variant="gold" disabled={!canFile||busy} onClick={file}>
            {busy?"Filing…":mine?"Amend my papers":"File my papers ⚜"}</Btn>
        </div>
      </>}
    </div>
  );
}

/* A plain framed message — used wherever a view has a reason it cannot proceed. */
function Notice({title,body,tone,children}){
  const col=tone==="warn"?C.amber:tone==="bad"?C.redL:C.gold;
  return(
    <div style={{...card,background:C.s2,borderLeft:`4px solid ${col}`,padding:"1.3rem 1.4rem",
      maxWidth:640,margin:"1rem auto"}}>
      <div className="cz" style={{fontWeight:700,fontSize:17,color:C.text,letterSpacing:"0.03em"}}>{title}</div>
      {body&&<p style={{color:C.textD,fontSize:14,lineHeight:1.65,marginTop:7,fontStyle:"italic"}}>{body}</p>}
      {children&&<div style={{marginTop:13}}>{children}</div>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════════
   THE BALLOT PAPER — printed on paper, not on ink, so it reads as a document
   rather than as a screen.
   ══════════════════════════════════════════════════════════════════════════════ */
const pInp={width:"100%",background:"#fff",border:`1px solid ${C.paperLine}`,borderRadius:2,
  color:C.pInk,padding:"9px 11px",fontSize:15,outline:"none"};
function PaperLabel({children}){
  return <div className="cz" style={{fontWeight:700,fontSize:10,letterSpacing:"0.2em",
    textTransform:"uppercase",color:C.red,marginBottom:"0.7rem"}}>{children}</div>;
}
function PaperBtn({children,onClick,disabled}){
  return <button onClick={disabled?undefined:onClick} disabled={disabled} className="cz"
    style={{fontWeight:700,fontSize:12,letterSpacing:"0.12em",textTransform:"uppercase",
      background:disabled?C.paperLine:C.red,color:disabled?C.pMute:"#fff",border:"none",borderRadius:2,
      padding:"11px 22px",cursor:disabled?"not-allowed":"pointer",
      boxShadow:disabled?"none":"0 4px 14px #9a1a1a55"}}>{children}</button>;
}
function stepBtn(dis){
  return{width:32,height:32,borderRadius:2,border:`1px solid ${dis?C.paperLine:C.pInk}`,
    background:dis?C.paper2:"#fff",color:dis?C.paperLine:C.pInk,fontSize:19,fontWeight:700,
    cursor:dis?"not-allowed":"pointer",lineHeight:1,flexShrink:0};
}

function VoteView({el,me,myCitizen,electorate,R,ballots,onCast,onBack,note}){
  const vpv=Number(el.votesPerVoter)||VPV_DEFAULT;
  const refs=el.referendums||[];
  const hasCands=R.cands.length>0;
  const already=myCitizen?electorate.voted.has(myCitizen.id):false;
  const [alloc,setAlloc]=useState({});
  const [refAns,setRefAns]=useState({});
  const [saving,setSaving]=useState(false);
  const [done,setDone]=useState(false);

  if(!me)return <Notice title="Sign in to vote"
    body="Voting is verified through your Vintranet account, which must be linked to a record on the imperial citizenship register. Sign in above and return here."/>;
  if(el.status!=="voting")return <Notice title={el.status==="voting_closed"||isFinal(el.status)?"The poll has closed":"The poll is not yet open"}
    body="You can follow the count on the main board."><Btn variant="gold" onClick={onBack}>View the count →</Btn></Notice>;
  if(!myCitizen)return <Notice title="No citizenship record is linked to your account" tone="warn"
    body="Voting requires a record on the imperial citizenship register linked to your username. Open the Foreign Affairs portal and claim your record, or ask the Ministry to link it."/>;
  if(!electorate.roll.some(c=>c.id===myCitizen.id)){
    const st=myCitizen.status||"citizen";
    return <Notice title="Your category is not enfranchised for this election" tone="warn"
      body={st==="revoked"?"Your citizenship is recorded as revoked. You are not entitled to vote."
        :st==="renounced"?"Our records show you have renounced your citizenship. You are not entitled to vote."
        :`Your record lists you as ${CITIZEN_STATUSES[st]||st}. This election is open to ${electorate.label}.`}/>;
  }
  if(already||done)return(
    <div style={{background:C.paper,borderRadius:3,border:`1px solid ${C.paperLine}`,
      boxShadow:"0 24px 60px #000a",overflow:"hidden",maxWidth:640,margin:"0 auto",
      padding:"2.4rem 1.5rem",textAlign:"center"}}>
      <Seal size={104} style={{animation:"iec-seal .5s ease"}}/>
      <div className="cz" style={{fontWeight:800,fontSize:22,color:C.pInk,marginTop:"0.9rem"}}>
        {done?"Ballot recorded":"You have already voted"}</div>
      <p style={{color:C.pMute,marginTop:8,lineHeight:1.65,fontSize:15}}>
        {done?`${myCitizen.name}, your vote in “${el.name}” is counted and cannot be changed.`
             :`${myCitizen.name}, our records show you have already cast a ballot in “${el.name}”.`}
      </p>
      <div style={{marginTop:18}}><PaperBtn onClick={onBack}>Watch the live count →</PaperBtn></div>
    </div>
  );

  const used=Object.values(alloc).reduce((a,b)=>a+b,0);
  const left=vpv-used;
  const bump=(cid,d)=>setAlloc(a=>{
    const n=Math.max(0,(a[cid]||0)+d);
    const others=used-(a[cid]||0);
    if(others+n>vpv)return a;
    return{...a,[cid]:n};
  });
  const candsOk=!hasCands||used===vpv;
  const refsOk=refs.every(r=>!!refAns[r.id]);
  const canSubmit=candsOk&&refsOk&&(hasCands||refs.length>0);
  const submit=async()=>{
    if(!canSubmit||saving)return;
    setSaving(true);
    const votes={};Object.entries(alloc).forEach(([k,v])=>{if(v>0)votes[k]=v;});
    const res=await onCast({votes,refVotes:{...refAns}});
    setSaving(false);
    if(res.ok){setDone(true);note("Ballot recorded. Thank you for voting.",C.green);}
    else note(res.error||"The ballot box refused your paper.",C.redL);
  };

  return(
    <div style={{maxWidth:720,margin:"0 auto"}}>
      <div style={{marginBottom:"1rem"}}><Btn onClick={onBack}>← Back to the count</Btn></div>
      <div style={{background:C.paper,borderRadius:3,border:`1px solid ${C.paperLine}`,
        boxShadow:"0 24px 60px #000a",overflow:"hidden"}}>
        <div style={{padding:"1.2rem 1.4rem",borderBottom:`2px solid ${C.pInk}`,display:"flex",
          justifyContent:"space-between",gap:"1rem",flexWrap:"wrap",alignItems:"center"}}>
          <div>
            <div className="mono" style={{fontSize:9.5,letterSpacing:"0.24em",color:C.red,textTransform:"uppercase"}}>
              Official Ballot Paper</div>
            <h1 className="cz" style={{fontWeight:900,fontSize:"clamp(1.3rem,3.6vw,1.9rem)",color:C.pInk,
              lineHeight:1.1,marginTop:4}}>{el.name}</h1>
            <div style={{fontSize:13,color:C.pMute,fontStyle:"italic",marginTop:3}}>
              Voting as <b style={{color:C.pInk}}>{myCitizen.name}</b> · one ballot per elector
            </div>
          </div>
          <Seal size={62} style={{opacity:0.5,filter:"saturate(0.4) brightness(0.5)"}}/>
        </div>

        {hasCands&&
          <div style={{padding:"1.3rem 1.4rem",borderBottom:refs.length>0?`1px dashed ${C.paperLine}`:"none"}}>
            <PaperLabel>{refs.length>0?"Part 1":"Step 1"} — Cast your {vpv} vote{vpv===1?"":"s"}</PaperLabel>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
              marginBottom:"0.9rem",flexWrap:"wrap",gap:8}}>
              <span style={{color:C.pMute,fontSize:14,lineHeight:1.55,flex:"1 1 260px"}}>
                {vpv>1?`Give all ${vpv} votes to one candidate, or split them between ${vpv}. You must use every vote.`
                     :"Give your vote to one candidate."}
              </span>
              <span className="cz" style={{fontWeight:800,fontSize:14,color:left===0?C.green:C.red,
                border:`1px solid ${left===0?C.green:C.red}55`,borderRadius:2,padding:"5px 12px",whiteSpace:"nowrap"}}>
                {left} vote{left===1?"":"s"} remaining</span>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:"0.5rem"}}>
              {R.cands.map(c=>{
                const n=alloc[c.id]||0;
                return(
                  <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,padding:"0.65rem 0.85rem",
                    border:`1px solid ${n>0?c.party.color:C.paperLine}`,borderLeft:`4px solid ${c.party.color}`,
                    borderRadius:2,background:n>0?c.party.color+"14":"#fff"}}>
                    <div style={{flex:1,minWidth:0}}>
                      <span className="cz" style={{fontWeight:600,fontSize:16,color:C.pInk}}>{c.name}</span>
                      <span className="mono" style={{fontSize:9.5,marginLeft:8,color:C.pMute}}>{c.party.abbr}</span>
                      <div style={{fontSize:12.5,color:C.pMute,marginTop:2}}>
                        {c.party.name}{c.blurb?" — "+c.blurb:""}</div>
                    </div>
                    <button onClick={()=>bump(c.id,-1)} disabled={n===0} style={stepBtn(n===0)}>−</button>
                    <span className="cz" style={{fontWeight:800,fontSize:20,width:26,textAlign:"center",color:C.pInk}}>{n}</span>
                    <button onClick={()=>bump(c.id,1)} disabled={left===0} style={stepBtn(left===0)}>+</button>
                  </div>
                );
              })}
            </div>
          </div>}

        {refs.length>0&&
          <div style={{padding:"1.3rem 1.4rem"}}>
            <PaperLabel>{hasCands?"Part 2":"Step 1"} — {refs.length>1?"The referendums":"The referendum"}</PaperLabel>
            <div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
              {refs.map((r,ri)=>{
                const chosen=refAns[r.id];
                const thr=REF_THRESHOLDS[r.threshold]||REF_THRESHOLDS.simple;
                const binary=(r.options||[]).length===2;
                return(
                  <div key={r.id} style={{border:`1px solid ${chosen?C.red+"66":C.paperLine}`,
                    borderLeft:`4px solid ${C.red}`,borderRadius:2,padding:"0.9rem 1.05rem",
                    background:chosen?C.red+"08":"#fff"}}>
                    <div className="mono" style={{fontSize:9,letterSpacing:"0.18em",color:C.red,textTransform:"uppercase"}}>
                      Referendum{refs.length>1?" "+(ri+1):""} · {thr.short}</div>
                    <div className="cz" style={{fontWeight:700,fontSize:16.5,color:C.pInk,lineHeight:1.3,marginTop:3}}>{r.question}</div>
                    {r.description&&<p style={{fontSize:13.5,color:C.pMute,margin:"5px 0 0",lineHeight:1.6}}>{r.description}</p>}
                    <div style={{display:"flex",flexDirection:"column",gap:7,marginTop:"0.85rem"}}>
                      {(r.options||[]).map((o,oi)=>{
                        const sel=chosen===o.id;
                        const oc=binary?(oi===0?C.green:C.red):C.pInk;
                        return(
                          <button key={o.id} onClick={()=>setRefAns(a=>({...a,[r.id]:o.id}))} className="cz"
                            style={{display:"flex",alignItems:"center",gap:12,width:"100%",textAlign:"left",
                              fontWeight:sel?700:500,fontSize:15,padding:"11px 14px",cursor:"pointer",
                              border:`2px solid ${sel?oc:C.paperLine}`,borderRadius:2,
                              background:sel?oc+"12":"#fff",color:sel?oc:C.pInk,transition:"all .12s",lineHeight:1.35}}>
                            <span style={{width:18,height:18,borderRadius:"50%",flexShrink:0,
                              border:`2px solid ${sel?oc:C.paperLine}`,background:"#fff",
                              display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
                              {sel&&<span style={{width:9,height:9,borderRadius:"50%",background:oc}}/>}
                            </span>
                            <span style={{flex:1}}>{o.label}</span>
                            {sel&&<span className="mono" style={{fontSize:8.5,letterSpacing:"0.16em",color:oc,flexShrink:0}}>MARKED</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>}

        <div style={{padding:"1.1rem 1.4rem",borderTop:`1px solid ${C.paperLine}`,background:C.paper2,
          display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <span style={{fontSize:12.5,color:C.pMute,fontStyle:"italic",flex:"1 1 220px",lineHeight:1.5}}>
            {canSubmit?"Once cast, a ballot cannot be changed or withdrawn."
              :!candsOk?`You must use all ${vpv} of your votes before casting.`
              :"Answer every referendum question before casting."}
          </span>
          <PaperBtn disabled={!canSubmit||saving} onClick={submit}>{saving?"Recording…":"Cast ballot ⚜"}</PaperBtn>
        </div>
      </div>
    </div>
  );
}

function blankElection(){
  return{id:"el_"+uid(),name:"",description:"",date:new Date().toISOString().slice(0,10),
    status:"draft",seatsTotal:SEATS_DEFAULT,votesPerVoter:VPV_DEFAULT,
    eligibility:[...DEFAULT_ELIGIBILITY],allowNewParties:true,
    regOpensAt:"",regClosesAt:"",voteOpensAt:"",voteClosesAt:"",
    referendums:[],createdAt:Date.now()};
}

/* The next lawful step in the pipeline, with whatever must be true first. */
function nextStep(el,R){
  const s=el.status;
  const cands=R.cands.length,refs=(el.referendums||[]).length;
  if(s==="draft")        return{to:"registration",label:"Open nominations",variant:"gold"};
  if(s==="registration") return{to:"reg_closed",label:"Close nominations",variant:"gold"};
  if(s==="reg_closed"){
    const ok=cands>=2||(cands===0&&refs>=1);
    return{to:"voting",label:"Open the poll",variant:"red",disabled:!ok,
      warn:ok?"":cands===0?"Add at least one referendum question, or approve at least two candidates, before opening the poll."
        :"At least two candidates must be approved before the poll opens."};
  }
  if(s==="voting")       return{to:"voting_closed",label:"Close the poll",variant:"red"};
  if(s==="voting_closed")return{to:"certified",label:"Certify the result",variant:"green"};
  return null;
}
